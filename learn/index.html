<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="8人制サッカーのポジション別レッスン。見たい動きを選んで、3Dのお手本とスロー解説で見て学ぶ。">

<style>
/* ポジションのタブ → 見たい動きのカード → 押すとボードのレッスンモードで再生（../board/?lesson=ID） */
:root{
  --bg:#05070d; --surface:rgba(14,20,36,.88); --surface-2:rgba(22,30,52,.94); --line:rgba(170,200,255,.16);
  --fg:#eef3ff; --muted:#8c9bbb; --accent:#ff7a3c; --accent-ink:#1a0800; --mate:#ffd23d;
  --display:"Chakra Petch","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;padding:22px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
header{text-align:center}
h1{font-family:var(--display);font-weight:300 !important;font-size:1.9rem;letter-spacing:.26em;padding-left:.26em;line-height:1.05;margin:0;color:#fff}   /* (like MAESTRO BOARD) */
h1 em{font-style:normal;color:var(--accent);margin-left:.4em;font-weight:400}
.tagline{margin:4px 0 0;font-size:.66rem;letter-spacing:.28em;color:var(--muted)}
.lead{margin:0;color:var(--muted);font-size:.9rem;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.tabs button{font:inherit;font-weight:700;letter-spacing:.1em;color:var(--muted);background:none;border:0;border-radius:10px;padding:10px 4px;cursor:pointer}
.tabs button small{display:block;font-size:.66rem;font-weight:500;letter-spacing:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-selected="true"] small{color:var(--accent-ink)}
/* (a long name never breaks into a second line or out of its button: ミッドフィルダー, SITUATION) */
.tabs button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .tabs{grid-template-columns:repeat(3,minmax(0,1fr))} .tabs button{font-size:.88rem;letter-spacing:.04em;padding:9px 2px} .tabs button small{font-size:.64rem} }
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;text-decoration:none;position:relative}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
.card h2{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0;line-height:1.4}
.card .en{font-size:.66rem;letter-spacing:.2em;color:var(--accent);font-weight:700}
.card p{margin:0;color:var(--muted);font-size:.85rem}
.card .meta{font-size:.75rem;color:var(--mate)}
.card.soon{opacity:.45}
.card.soon .meta{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.foot{font-size:.85rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);font-weight:700}

/* MAESTRO NIGHT (2026-10-27): stadium sky with two floodlight glows from the top corners */
body{background:radial-gradient(60vw 50vh at 0% -8%,rgba(255,240,200,.14),transparent 60%),radial-gradient(60vw 50vh at 100% -8%,rgba(255,240,200,.14),transparent 60%),linear-gradient(to bottom,#0b1222,var(--bg) 60%);background-attachment:fixed;min-height:100vh}
h1,h2{font-weight:700}
/* MAESTRO NIGHT broadcast parts: the score bug, how many chapters have been watched, CLEAR on a lesson watched to the end */
.wrap{grid-template-columns:minmax(0,1fr)}   /* (a wide title or the tabs never push the page sideways) */
@media (max-width:420px){ h1{font-size:1.45rem;letter-spacing:.2em;padding-left:.2em} }
.watched{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.watched p{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta .part{color:#7cf5ff;font-weight:700}
.card.cleared{border-color:rgba(255,200,61,.45)}

/* BCAST CSS BEGIN: copied from app/drill/broadcast.css by build.py, do not edit here */
/* ===== MAESTRO NIGHT broadcast parts (2026-10-27): shared by DRILL, BOARD, TACTICS GUIDE and LESSONS.
   The single source is this file: build.py adds it to the drill; clip3d_sync.py copies it into tactics-board.html,
   learn.html and explain-head.html between the BCAST CSS markers (edit here, never the copies).
   Every colour has a fallback, so a page only needs its own --accent / --line / --muted / --fg. ===== */
:root{--bc-live:#ff3355; --bc-gold:#ffc83d; --bc-gold-2:#ff9f1c; --bc-xp:#7cf5ff; --bc-good:#3dffa0; --bc-warn:#ffc83d; --bc-bad:#ff4d6a;
  --bc-en:"Chakra Petch","Noto Sans JP",sans-serif; --bc-ja:"Noto Sans JP","Hiragino Sans",sans-serif; --bc-panel:rgba(22,30,52,.94)}
@keyframes nt-blink{50%{opacity:.25}}
@keyframes nt-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* the TV score bug: ● LIVE | MAESTRO ○○ | what is on | where we are */
.nt-bug{display:flex;align-items:stretch;width:max-content;max-width:100%;margin:0 auto;border-radius:8px;overflow:hidden;background:var(--bc-panel);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:var(--bc-en);font-weight:600;white-space:nowrap;color:var(--fg,#eef3ff)}
.nt-bug > *{display:flex;align-items:center;gap:6px;padding:7px 12px;border-right:1px solid var(--line);font-size:.8rem;letter-spacing:.08em;min-width:0}
.nt-bug > *:last-child{border-right:0}
.nt-bug .live{background:var(--bc-live);color:#fff;letter-spacing:.18em;flex:none}
.nt-bug .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:nt-blink 1.4s infinite}
.nt-bug .live.replay{background:#2b3a66}
.nt-bug .live.replay::before{animation:none;border-radius:1px;width:0;height:0;background:none;border-left:7px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.nt-bug .title{background:linear-gradient(90deg,#141c33,#1b2544);letter-spacing:.2em;flex:none}
.nt-bug .title b{color:var(--accent);font-weight:700}
.nt-bug .num{font-variant-numeric:tabular-nums;flex:none} .nt-bug .num small{color:var(--muted);font-size:.68rem;margin-right:2px}
.nt-bug .what{font-family:var(--bc-ja);font-weight:700;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.45}
.nt-bug .m{color:var(--accent)} .nt-bug .o{color:#7fb6ff}
.nt-bug .combo,.nt-bug .clear{color:#2a1600;background:linear-gradient(180deg,#ffd75e,var(--bc-gold-2));letter-spacing:.12em;animation:nt-pop .5s;flex:none}
.nt-bug .combo b{font-size:.95rem}
.nt-bug .part{font-family:var(--bc-ja);font-weight:700;letter-spacing:.04em;flex:none}
.nt-bug .part.slow{color:var(--bc-xp)} .nt-bug .part.bad{background:#7a1e1e;color:#fff}
@media (max-width:640px){ .nt-bug > *{padding:6px 8px;font-size:.72rem} .nt-bug .title span,.nt-bug .opt{display:none} .nt-bug .what{min-width:4.5em} }   /* (.opt: a cell or label left out on a phone) */
@media (max-width:380px){ .nt-bug > *{padding:5px 6px;letter-spacing:.02em} }

/* how much has been watched: WATCHED, a bar, 3/12 */
.nt-prog{display:flex;align-items:center;gap:8px;font-family:var(--bc-en)}
.nt-prog .k{font-size:.6rem;font-weight:600;letter-spacing:.22em;color:var(--bc-gold);white-space:nowrap}
.nt-prog .bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line)}
.nt-prog .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--bc-xp),#b7fbff);box-shadow:0 0 10px var(--bc-xp);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.nt-prog .val{font-size:.78rem;font-weight:700;color:var(--bc-xp);font-variant-numeric:tabular-nums;white-space:nowrap}
.nt-prog.done .bar i{background:linear-gradient(90deg,var(--bc-gold),#fff1b8);box-shadow:0 0 10px var(--bc-gold)} .nt-prog.done .val{color:var(--bc-gold)}
/* a small gold CLEAR chip (a lesson or a category watched to the end) */
.nt-clear{display:inline-flex;align-items:center;gap:4px;font:700 .62rem var(--bc-en);letter-spacing:.16em;color:#2a1600;background:linear-gradient(180deg,#ffd75e,var(--bc-gold-2));border-radius:999px;padding:2px 9px;white-space:nowrap}

/* rewards: a stamp over the picture, a flash, confetti */
.pitchbox.nt-shake{animation:nt-shake .4s}
@keyframes nt-shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.nt-stamp{position:absolute;left:50%;top:44%;z-index:6;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);opacity:0;
  font:700 clamp(1.8rem,7vw,3rem)/1 var(--bc-en);letter-spacing:.06em;text-align:center;white-space:nowrap;padding:10px 22px;border-radius:14px;
  border:4px solid currentColor;background:rgba(5,7,13,.72);text-shadow:0 0 22px currentColor;max-width:94%}
.nt-stamp small{display:block;font:700 .8rem var(--bc-ja);letter-spacing:.1em;margin-top:6px;text-shadow:none;color:var(--fg,#eef3ff);white-space:normal}
.nt-stamp .combo{display:inline-block;margin-top:8px;font:700 .8rem var(--bc-en);letter-spacing:.14em;color:#2a1600;background:linear-gradient(180deg,#ffd75e,var(--bc-gold-2));border-radius:999px;padding:3px 12px;text-shadow:none}
.nt-stamp.r2{color:var(--bc-good)} .nt-stamp.r1{color:var(--bc-warn)} .nt-stamp.r0{color:var(--bc-bad)} .nt-stamp.gold{color:var(--bc-gold)}
.nt-stamp.show{animation:nt-stamp 1.9s cubic-bezier(.2,1.3,.4,1) forwards}
.nt-stamp.long.show{animation-duration:2.8s}
@keyframes nt-stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}14%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.96)}}
.nt-flash{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:12px;background:radial-gradient(circle at 50% 45%,rgba(255,246,220,.55),transparent 65%);opacity:0}
.nt-flash.show{animation:nt-flash .7s ease-out forwards}
@keyframes nt-flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.nt-confetti{position:fixed;inset:0;z-index:50;pointer-events:none}
@media (prefers-reduced-motion:reduce){ .nt-bug .live::before,.nt-bug .combo,.nt-bug .clear{animation:none} .nt-stamp.show{animation:none;opacity:1;transform:translate(-50%,-50%) rotate(-8deg)} .nt-flash,.pitchbox.nt-shake{animation:none} }
/* BCAST CSS END */
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>MAESTRO<em>LESSONS</em></h1>
    <p class="tagline">WATCH. UNDERSTAND. PLAY.</p>
  </header>
  <div class="nt-bug" id="ntBug" aria-hidden="true"></div>
  <div class="watched" id="watched"></div>
  <p class="lead">ポジションを選んで、見たい動きを押してね。<br>お手本 → スローで解説の順に流れます。ダメな例は、ボタンで選んで見られます。</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="cards" id="cards" role="tabpanel"></div>
  <p class="foot"><a href="../">ほかのアプリ</a></p>
</div>
<script>/* BCAST JS BEGIN: copied from app/drill/broadcast.js by build.py, do not edit here */
// ===== MAESTRO NIGHT broadcast parts (2026-10-27): the TV score bug, a stamp over the picture, confetti, and what has been
// watched (TACTICS GUIDE scenes, LESSONS chapters). Shared by BOARD, GUIDE and LESSONS: clip3d_sync.py copies this file into
// tactics-board.html and learn.html between the BCAST JS markers, build-explain.py adds it to the guide (edit here only). =====
const BCAST = (() => {
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // the bug: live ("LIVE" or "REPLAY"), the app's name after MAESTRO, then cells [class, html] (html is trusted: callers escape)
  function bug(el, {live = "LIVE", app, cells = []}){
    if (!el) return;
    const html = `<span class="live${live === "REPLAY" ? " replay" : ""}">${live}</span><span class="title">MAESTRO<span>&nbsp;<b>${app}</b></span></span>`
      + cells.filter(Boolean).map(([c, h]) => `<span class="${c}">${h}</span>`).join("");
    if (el.dataset.html !== html){ el.innerHTML = html; el.dataset.html = html; }
  }
  function confetti(n = 140){
    if (calm()) return;
    const cv = document.createElement("canvas"); cv.className = "nt-confetti"; document.body.appendChild(cv);
    const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1; cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr, dpr);
    const cols = ["#ff7a3c", "#ffc83d", "#3dffa0", "#7cf5ff", "#ffffff"];
    const ps = Array.from({length:n}, (_, i) => ({x:innerWidth/2 + (Math.random() - .5)*120, y:innerHeight*.38, vx:(Math.random() - .5)*14, vy:-Math.random()*14 - 4,
      s:4 + Math.random()*5, a:Math.random()*6, va:(Math.random() - .5)*.4, c:cols[i % cols.length]}));
    const t0 = performance.now();
    (function step(t){ const k = (t - t0)/1600; ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of ps){ p.vy += .45; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
      k < 1 ? requestAnimationFrame(step) : cv.remove(); })(t0);
  }
  // a stamp over host (positioned): big English word, a Japanese line under it; gold = a CLEAR (with a flash and confetti)
  function stamp(host, big, small, {cls = "gold", party = false, ms = 2100} = {}){
    if (!host) return;
    if (getComputedStyle(host).position === "static") host.style.position = "relative";
    host.querySelectorAll(".nt-stamp,.nt-flash").forEach(n => n.remove());
    if (party){ const f = document.createElement("div"); f.className = "nt-flash"; host.appendChild(f); requestAnimationFrame(() => f.classList.add("show")); setTimeout(() => f.remove(), 900); confetti(party === true ? 160 : party); }
    const s = document.createElement("div"); s.className = `nt-stamp ${cls}${ms > 2200 ? " long" : ""}`; s.setAttribute("aria-hidden", "true");
    s.innerHTML = `${esc(big)}${small ? `<small>${esc(small)}</small>` : ""}`;
    host.appendChild(s); requestAnimationFrame(() => s.classList.add("show"));
    setTimeout(() => s.remove(), ms);
  }
  // what has been watched, on this device: {guide:{qid:1}, lesson:{id:[chapter, ...]}}
  const KEY = "maestro_seen";
  const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } };
  const save = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} };
  const seen = {
    scene: id => !!(load().guide || {})[id],
    addScene(id){ const s = load(); (s.guide = s.guide || {})[id] = 1; save(s); },
    chapters: id => (load().lesson || {})[id] || [],
    addChapter(id, k){ const s = load(), L = (s.lesson = s.lesson || {}); const a = L[id] || []; if (!a.includes(k)){ a.push(k); a.sort((x, y) => x - y); } L[id] = a; save(s); return a; }
  };
  // a progress strip: label, bar, "n/total"
  const prog = (n, total, k = "WATCHED") => `<div class="nt-prog${total && n >= total ? " done" : ""}"><span class="k">${k}</span><span class="bar"><i style="width:${total ? Math.round(100*n/total) : 0}%"></i></span><span class="val">${n}/${total}</span></div>`;
  return {bug, stamp, confetti, seen, prog, esc};
})();
/* BCAST JS END */</script>
<script>
// id: a lesson in the board (LESSONS in tactics-board.html); without an id the card is still 準備中

"tm-th-onside", "tm-th-again"]}, {"id": "tm-s-fourth", "pos": "TEAM", "name": "4人の連携の動き出し", "en": "FOURTH MAN", "desc": "ボールの2つ先をよんで、1つめのパスで走りだす4人目", "min": "約15分・6章", "hidden": false, "from": ["tm-fo-basic", "tm-fo-switch", "tm-fo-read2", "tm-fo-decoy", "tm-fo-box", "tm-fo-cut"]}, {"id": "tm-s-outnum", "pos": "TEAM", "name": "数的不利の守り方", "en": "OUTNUMBERED", "desc": "人数が少なくても、飛びこまずにゴールをまもって奪う", "min": "約15分・6章", "hidden": false, "from": ["tm-1v2", "tm-2v3", "tm-3v4", "tm-counter", "tm-gk2", "tm-delay"]}, {"id": "tm-s-3v3", "pos": "TEAM", "name": "3対3の攻めと守り", "en": "3 v 3", "desc": "三角形・ワンツーと3人目・引きつけてパス、1人目2人目3人目・コースを切る・切りかえ", "min": "約15分・6章", "hidden": false, "from": ["tm-3v3-triangle", "tm-3v3-onetwo3", "tm-3v3-draw", "tm-3v3-roles", "tm-3v3-steer", "tm-3v3-switch"]}, {"id": "tm-s-break", "pos": "TEAM", "name": "相手を崩してゴールへ", "en": "BREAK THEM DOWN", "desc": "サイドチェンジ・ニアゾーン・引きつけ・間・数的優位・マイナスの6つの崩し", "min": "約15分・6章", "hidden": false, "from": ["tm-bk-switch", "tm-bk-nearzone", "tm-bk-draw2", "tm-bk-between", "tm-bk-overload", "tm-bk-cutback"]}]};
// ---- end of cards ----
const POS = [
  {k:"gk", name:"GK", ja:"キーパー", list:[]},
  {k:"df", name:"DF", ja:"ディフェンダー", list:[]},
  {k:"sb", name:"SB", ja:"サイドバック", list:[]},
  {k:"mf", name:"MF", ja:"ミッドフィルダー", list:[]},
  {k:"shadow", name:"SHADOW", ja:"シャドウ", list:[]},
  {k:"fw", name:"FW", ja:"フォワード", list:[]},
  {k:"team", name:"TEAM", ja:"連携・崩し", list:[]},
  {k:"situation", name:"SITUATION", ja:"場面別", list:[]}];
// the cards: every series (and lesson) from app/lessons-draft (merge.py writes DRAFT_CARDS above)
// (ch: how many chapters it has — a series has one per lesson it is made of)
if (typeof DRAFT_CARDS !== "undefined") POS.forEach(P => (DRAFT_CARDS[P.name] || []).forEach(d => P.list.push({id: d.id, en: d.en, name: d.name, desc: d.desc, min: d.min,
  ch: d.from ? d.from.length : +((/(\d+)章/.exec(d.min || "") || [])[1] || 1)})));
// what has been watched on this phone (the board writes it when a chapter plays to its end): the bug and the bar on top
const seenOf = c => typeof BCAST === "undefined" ? 0 : Math.min(c.ch, BCAST.seen.chapters(c.id).length);
function watched(){
  const all = POS.flatMap(P => P.list).filter(c => c.id), chs = all.reduce((s, c) => s + c.ch, 0), seen = all.reduce((s, c) => s + seenOf(c), 0), clear = all.filter(c => seenOf(c) >= c.ch).length;
  if (typeof BCAST === "undefined") return;
  BCAST.bug(document.getElementById("ntBug"), {app:"LESSONS", cells:[["num", `<small>LESSONS</small>${all.length}`], ["num", `<small>CLEAR</small>${clear}`]]});
  document.getElementById("watched").innerHTML = BCAST.prog(seen, chs) + `<p>${seen ? `さいごまで見た章：${seen}　全部見たレッスン：${clear}` : "レッスンを1章さいごまで見ると、ここがのびるよ"}</p>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(k){
  const P = POS.find(p => p.k === k) || POS.find(p => p.k === "fw");
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === P.k));
  const box = document.getElementById("cards");
  box.innerHTML = P.list.length ? P.list.map(c => c.id
    ? `<a class="card${seenOf(c) >= c.ch ? " cleared" : ""}" href="../board/?lesson=${c.id}"><span class="en">${esc(c.en)}</span><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p><span class="meta">▶ ${esc(c.min || "")}${seenOf(c) >= c.ch ? '<span class="nt-clear">✓ CLEAR</span>' : seenOf(c) ? `<span class="part">${seenOf(c)}/${c.ch}章 見た</span>` : ""}</span></a>`
    : `<div class="card soon" aria-disabled="true"><span class="en">${esc(c.en)}</span><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p><span class="meta">準備中</span></div>`).join("")
    : `<p class="empty">${esc(P.ja)}のレッスンは準備中です</p>`;
  if (location.hash !== "#" + P.k) history.replaceState(null, "", "#" + P.k);
}
document.getElementById("tabs").innerHTML = POS.map(p => `<button role="tab" data-k="${p.k}" aria-selected="false">${p.name}<small>${p.ja}</small></button>`).join("");
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.k); });
show(location.hash.slice(1) || "fw"); watched();
// back from a lesson (the page may come from the back/forward cache): count again
addEventListener("pageshow", e => { if (e.persisted){ watched(); show(location.hash.slice(1) || "fw"); } });
</script>
