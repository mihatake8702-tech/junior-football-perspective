<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAESTRO TACTICS GUIDE</title>
<meta name="description" content="MAESTRO TACTICS GUIDE — 8人制サッカーの戦術を3Dのお手本で見る。◎こうする・○それもあり・✕ダメな例を、字幕と声で解説。">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-title" content="GUIDE">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#05080a; --panel:#0b1411; --line:#1d3a2c; --fg:#eafff4; --muted:#8fb3a2; --accent:#4dffa6;
  --good:#4dffa6; --warn:#ffd23d; --bad:#ff4d6a; --mate:#ff7a3c; --opp:#3fa9ff;
  --en:"Chakra Petch","Noto Sans JP",sans-serif; --ja:"Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ja)}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font:700 1.15rem var(--en);letter-spacing:.08em}
.top h1 small{display:block;font:500 .72rem var(--ja);color:var(--muted);letter-spacing:0}
.top .sp{flex:1}
.top .back{color:var(--muted);font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 11px;font:600 .82rem var(--en);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:#04120a}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px;max-width:1400px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-height:240px;max-height:68vh;width:100%;touch-action:none;cursor:grab}
.stage canvas{display:block;width:100%;height:100%}
.views{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.views button{background:rgba(3,10,7,.75);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:600 .74rem var(--en);cursor:pointer;color:var(--muted)}
.views button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.tag{position:absolute;top:10px;left:10px;font:600 .72rem var(--en);color:var(--accent);background:rgba(3,10,7,.75);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:55%}
/* the caption sits on the 3D picture (one screen, like a TV caption); the picture moves up so the play stays above it */
.cap{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(3,10,7,.8);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:8px 13px;max-height:36%;overflow:auto;backdrop-filter:blur(3px);cursor:auto}
.cap:empty{display:none}
.cap .k{display:inline-block;font:700 .78rem var(--ja);padding:2px 9px;border-radius:999px;background:var(--accent);color:#04120a;margin-bottom:4px}
.cap h3{margin:2px 0 3px;font-size:1.02rem;line-height:1.45}
.cap p{margin:0;font-size:.95rem;line-height:1.6;color:#d7efe3}
.cap.r2{border-left-color:var(--good)} .cap.r2 .k{background:var(--good)}
.cap.r1{border-left-color:var(--warn)} .cap.r1 .k{background:var(--warn)}
.cap.r0{border-left-color:var(--bad)}  .cap.r0 .k{background:var(--bad);color:#fff}
.cap.pt{border-left-color:#fff} .cap.pt .k{background:#fff}
@media (max-width:600px){.stage{aspect-ratio:1/1;min-height:0;max-height:none}.tag{display:none}.views{left:8px;right:8px;justify-content:flex-start}.views button{padding:4px 7px;font-size:.66rem}.cap{left:6px;right:6px;bottom:6px;padding:6px 10px;max-height:42%}.cap h3{font-size:.86rem;margin:1px 0}.cap p{font-size:.8rem;line-height:1.5}.cap .k{font-size:.7rem;margin-bottom:2px}}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ctrl .b{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-width:44px}
.ctrl .b.main{background:var(--accent);color:#04120a;border-color:var(--accent);min-width:96px}
.dots{display:flex;gap:5px;flex:1;min-width:160px}
.dots button{flex:1;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:700 .72rem var(--ja);color:var(--muted);padding:0;position:relative;overflow:hidden}
.dots button .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(77,255,166,.22);width:0}
.dots button span{position:relative}
.dots button[aria-current=true]{border-color:var(--accent);color:var(--fg)}
.dots .r2{color:var(--good)} .dots .r1{color:var(--warn)} .dots .r0{color:var(--bad)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:900px){.side{max-height:none}}
.side h2{margin:0;font:700 .78rem var(--en);color:var(--muted);letter-spacing:.1em}
.phase{font:700 .76rem var(--ja);color:var(--muted);margin:6px 0 4px}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 4px;cursor:pointer;display:grid;gap:1px;text-align:center}
.pos button b{font:700 1rem var(--en);letter-spacing:.04em}
.pos button small{font-size:.7rem;color:var(--muted)}
.pos button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#04120a}
.pos button[aria-pressed=true] small{color:#04120a}
.pos button:disabled{opacity:.35;cursor:default}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.cats{display:flex;flex-direction:column;gap:6px}
.cats button{display:grid;grid-template-columns:1fr auto;gap:1px 10px;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.cats button b{font-size:.95rem}
.cats button small{grid-column:1;font-size:.74rem;color:var(--muted);line-height:1.45}
.cats button i{grid-column:2;grid-row:1/3;align-self:center;font:700 .85rem var(--en);font-style:normal;color:var(--muted)}
.cats button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#04120a}
.cats button[aria-pressed=true] small,.cats button[aria-pressed=true] i{color:#04120a}
.cats button:disabled{opacity:.35;cursor:default}
.themes button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:.84rem;cursor:pointer}
.themes button[aria-pressed=true]{background:var(--accent);color:#04120a;border-color:var(--accent);font-weight:700}
.themes button:disabled{opacity:.35;cursor:default}
.aim{font-size:.85rem;line-height:1.6;color:#cfe8dc;margin:0;padding:8px 10px;border-radius:10px;background:rgba(77,255,166,.07)}
.qs{display:flex;flex-direction:column;gap:6px}
#qsel{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font:500 .9rem var(--ja);appearance:auto}
.qpt{margin:0;padding:9px 11px;border-radius:10px;background:rgba(77,255,166,.07);font-size:.86rem;line-height:1.6;display:grid;gap:2px}
.qpt b{font-size:.74rem;color:var(--accent)}
.qpt small{color:var(--muted);font-size:.74rem}
.qs button{text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.86rem;line-height:1.5;display:flex;gap:8px}
.qs button b{font:700 .78rem var(--en);color:var(--muted);min-width:22px}
.qs button[aria-current=true]{border-color:var(--accent);background:rgba(77,255,166,.08)}
label.chk{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.nogl{padding:40px;text-align:center;color:var(--muted)}
</style>
</head><body>
<header class="top">
  <h1>MAESTRO TACTICS GUIDE<small>3D解説 ― 見て、まねしよう</small></h1>
  <span class="sp"></span>
  <a class="back" href="../">‹ メニュー</a>
  <div class="seg" id="grades" aria-label="学年"></div>
</header>
<main class="wrap">
  <section>
    <div class="stage" id="stage">
      <div class="tag" id="tag"></div>
      <div class="views" id="views"></div>
      <div class="cap" id="cap" aria-live="polite"></div>
    </div>
    <div class="ctrl">
      <button class="b" id="prev" aria-label="前の手順">◀</button>
      <button class="b main" id="play">▶ 再生</button>
      <button class="b" id="next" aria-label="次の手順">▶▶</button>
      <div class="dots" id="dots"></div>
      <div class="seg" id="speed" aria-label="速さ"></div>
    </div>
    <div class="legend"><span><i style="background:#fff"></i>きみ</span><span><i style="background:var(--mate)"></i>味方</span><span><i style="background:var(--opp)"></i>相手</span><span><i style="background:var(--good)"></i>◎ こうする</span><span><i style="background:var(--warn)"></i>○ それもあり</span><span><i style="background:var(--bad)"></i>✕ ダメな例</span></div>
  </section>
  <aside class="side">
    <h2>POSITION</h2>
    <div class="pos" id="pos" aria-label="ポジション"></div>
    <h2>CATEGORY</h2>
    <div id="themes"></div>
    <p class="aim" id="aim"></p>
    <label class="chk"><input type="checkbox" id="auto" checked> 終わったら次の場面・次のカテゴリーへ続けて見る</label>
    <h2>SCENES</h2>
    <div class="qs" id="qs"></div>
  </aside>
</main>
<script>
// ---------- Formations ----------
// Pitch: x 0 (left) – 50 (right), y 0 (opponents' goal) – 68 (our goal). We attack upward.
// key → [label, x, y]. Keys are unique; labels are what the players see on the pitch.
const FORM = {
  "3-3-1":  {GK:["GK",25,64], LB:["LB",10,52], CB:["CB",25,54], RB:["RB",40,52], LH:["LH",8,38],  CH:["CH",25,40], RH:["RH",42,38], CF:["CF",25,24]},
  "2-3-2":  {GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], LH:["LH",7,40], CH:["CH",25,44], RH:["RH",43,40], FW1:["FW",18,24], FW2:["FW",32,24]},
  "2-4-1":  {GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], LH:["LH",6,38], CM1:["CM",19,44], CM2:["CM",31,40], RH:["RH",44,38], CF:["CF",25,22]},
  "3-2-2":  {GK:["GK",25,64], LB:["LB",10,52], CB:["CB",25,54], RB:["RB",40,52], CM1:["CM",19,42], CM2:["CM",31,42], FW1:["FW",18,24], FW2:["FW",32,24]},
  "2-1-2-1":{GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], DM:["DM",25,46], LH:["LH",8,36], RH:["RH",42,36], OH:["OH",25,32], CF:["CF",25,22]}
};
const FORMS = ["3-3-1","2-3-2","2-4-1","3-2-2","2-1-2-1"];
// mates for a scene: M("3-3-1", {CB:null, LB:[8,44]}) — null removes (usually "me"), [x,y] moves
function M(f, o={}){
  return Object.entries(FORM[f]).filter(([k])=>o[k]!==null).map(([k,[l,x,y]])=>{ const v=o[k]; return [l, v?v[0]:x, v?v[1]:y]; });
}
const POS_GROUP = l => /^GK/.test(l) ? "GK" : /^(CB|LB|RB|SB|WB)/.test(l) ? "DF" : /^(CF|FW|ST|LW|RW)/.test(l) ? "FW" : "MF";
const POS_NAME = {GK:"ゴールキーパー", DF:"ディフェンダー", MF:"ミッドフィルダー", FW:"フォワード"};

// ---------- The four moments of the game and the principles we train ----------
const PHASES = {
  atk:  {name:"こうげき",       sub:"ボールを持っているとき"},
  def:  {name:"しゅび",         sub:"相手がボールを持っているとき"},
  lost: {name:"うばわれた直後", sub:"こうげき → しゅび"},
  won:  {name:"うばった直後",   sub:"しゅび → こうげき"},
  set:  {name:"セットプレー",   sub:"スローイン・コーナー・フリーキック・ゴールキック・キックオフ"}
};
// g = first grade (U-9 = 9) that sees the theme
const THEMES = [
  {id:"goal",  ph:"atk",  g:9,  name:"ゴールをめざす",     aim:"こうげきの目的は、ゴールをうばうこと。シュートできるならシュート。できないなら、相手の背中（うら）をねらう。"},
  {id:"pos123",ph:"atk",  g:9,  name:"1・2・3の位置",      aim:"ボールの近くの安全なもらい場所（1）、相手と相手のあいだ（2）、いちばん外（3）。この順番で場所をつくる。"},
  {id:"lane",  ph:"atk",  g:10, name:"レーンと相手のわき", aim:"味方と同じたての線（レーン）に立たない。相手と相手のあいだや、相手の横（わき）で受ける。"},
  {id:"body",  ph:"atk",  g:9 , name:"見る・ヘソの向き",   aim:"受ける前にまわりを見る。ヘソを相手ゴールの方に向けて受ければ、前が見える。"},
  {id:"break", ph:"atk",  g:9 , name:"3つの突破",          aim:"相手のうしろへ行く方法は、スルーパス・ドリブル・ワンツーの3つ。相手の動き（矢印）を見て選ぶ。"},
  {id:"carry", ph:"atk",  g:10, name:"運ぶ・ひきつける",   aim:"前があいていたら運ぶ。相手が寄ってきたら、その相手が見ていた味方があく。"},
  {id:"free",  ph:"atk",  g:10, name:"スペースをつくる・使う", aim:"マークされている人は、相手をつれて動いてスペースをつくる。フリーの人が、そのスペースで受ける。"},
  {id:"third", ph:"atk",  g:9,  name:"3人目・4人目の動き", aim:"ボールが次の味方に入る前に、その次をよんで動く。パスを受ける人だけでなく、その次に受ける人（3人目）、さらに次の人（4人目）が先に走りだすと、相手はついてこられない。"},
  {id:"unmark",ph:"atk",  g:9,  name:"はずす動き",          aim:"ボールを受ける前に、マークしている相手からはなれる。相手がボールを見たすきに背中がわへ、一度行くふりをしてもどる、急に止まる。自分で受けるスペースをつくる。"},
  {id:"order", ph:"def",  g:9,  name:"守りの順番",         aim:"①ゴールを守る ②前に進ませない ③ボールにせまる ④うばう。とびこまずに、この順番で考える。"},
  {id:"cover", ph:"def",  g:10, name:"チャレンジ＆カバー", aim:"1人がボールへ行き、ほかの人はその〔ディアゴナーレ|ななめうしろでカバー〕。2人で1つのボールを守る。"},
  {id:"slide", ph:"def",  g:11, name:"スライドと追いこみ", aim:"みんなでボールの方へずれる。まん中では外へ、サイドでは中へ追いこんで、うばう場所を決める。"},
  {id:"box",   ph:"def",  g:9 , name:"ゴール前の守り",     aim:"ゴール前では、〔同一視野|ボールと相手の両方を見る〕。シュートのコースに入り、フリーの相手をつくらない。"},
  {id:"press", ph:"def",  g:11, name:"前からうばう・もどる", aim:"チームで決めた合図で、前からうばいに行くか、もどって守る形をつくるかを決める。前から行くときは、〔カバーシャドウ|背中でパスコースを消しながら寄せる〕。"},
  {id:"lost",  ph:"lost", g:9,  name:"うばわれた直後",     aim:"近い人は〔カウンタープレス|すぐうばい返しに行く〕。間に合わない人は〔リトリート|全力でもどって〕、まず前に進ませない。"},
  {id:"won",   ph:"won",  g:9,  name:"うばった直後",       aim:"相手がととのう前に、まず前（うら）をねらう。むりなら近くの1の位置で、うばわれない。"},
  {id:"throw", ph:"set",  g:9,  name:"スローイン",         aim:"スローインもこうげきのスタート。フリーの味方へ、前を向けるボールを投げる。守るときは、相手よりゴールがわで、すぐ前に出られる場所に立つ。"},
  {id:"ck",    ph:"set",  g:9,  name:"コーナーキック",     aim:"せめるときは、ニア・ファー・こぼれ球の場所に人をわけて、うしろにも人をのこす。守るときは、ゴール前の大事な場所をうめて、先にボールにさわる。"},
  {id:"fk",    ph:"set",  g:9,  name:"フリーキック",       aim:"せめるときは、相手がそろう前か、そろったらねらいを決めて。守るときは、ボールから7m（8人制）はなれ、かべとマークで大事な場所をうめる。"},
  {id:"gkick", ph:"set",  g:9,  name:"ゴールキック",       aim:"ゴールキックもこうげきのスタート。相手の立ち位置を見て、つなぐか大きくけるかを決める。相手のゴールキックは、どこでうばうかをチームで決める。"},
  {id:"ko",    ph:"set",  g:9,  name:"キックオフ",         aim:"キックオフも作戦のひとつ。最初のパスで、どこから前へ進むかを決めておく。相手のキックオフは、みんなでまとまってせめさせない。"}
];
const TH = Object.fromEntries(THEMES.map(t=>[t.id,t]));

// ---------- Question bank ----------
// D({...}) adds one question.
//  type "pick": opts = [{t, at:[x,y]|null, go?, team?, r:2|1|0, why}]  (r: 2=◎ いちばん目的に合う / 1=○ それもあり / 0=✕)
//  type "tap":  zones = [{c:[x,y], rad, r:2|1, why}], miss = why for a tap outside every zone, target "me" (where to stand) or "ball" (where to pass)
//  look: seconds the scene is shown before the players disappear (look-then-answer questions)
//  pair: questions with the same pair id are played back to back (same scene, the opponent moves differently)
const Q = [];
const BASE_OPP_DEF = [[25,4]]; // their GK is always drawn
// No team-mate stands in an offside place in a scene where we have the ball (kids copy what they see):
//  - a little beyond (≤3 m) the second-last defender → the mate steps back level with that defender (+0.8 m)
//  - far beyond → the scene simply left out their back line: a defender is added just goal-side of the mate
//    (not on an answer spot or another player), or, when there is no room, the mate steps back
// Not for throw-ins, corners, goal kicks and kick-offs (no offside), not for きみ, and not for questions about offside.
const NO_OFFSIDE_THEMES = new Set(["throw","ck","gkick","ko"]);
function onsideFix(q){
  const sc = q.scene; if(!sc || NO_OFFSIDE_THEMES.has(q.th) || /オフサイド/.test(JSON.stringify([q.situ,q.q,q.opts,q.zones,q.miss]))) return;
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]), me = [sc.me[1], sc.me[2]], ours = [me].concat(sc.mates.map(m => [m[1], m[2]]));
  if(!ours.some(p => dist(p, sc.ball) < 1.3)) return;
  const spots = [].concat((q.opts||[]).map(o => o.at).filter(Boolean), (q.zones||[]).map(z => z.c));
  const secondLast = () => sc.opps.map(p => p[1]).concat([4]).sort((a,b) => a-b)[1];
  sc.mates.forEach(m => {
    if(dist([m[1],m[2]], sc.ball) < 1.3) return;
    const sl = secondLast(); if(!(m[2] < sl - .3 && m[2] < sc.ball[1] - .3)) return;
    if(sl - m[2] > 3 && sc.opps.length < 7){
      const all = ours.concat(sc.mates.map(x => [x[1],x[2]]), sc.opps);
      for(const [dx,dy] of [[1.5,-2.4],[-1.5,-2.4],[0,-2.6],[3,-2.4],[-3,-2.4]]){
        const c = [Math.max(1, Math.min(49, m[1]+dx)), Math.max(5.5, m[2]+dy)];
        if(c[1] >= m[2] - .3) continue;
        if(all.every(p => dist(p, c) >= 2.2) && spots.every(p => dist(p, c) >= 2.4)){ sc.opps.push(c); return; }
      }
    }
    // step back level with the defender, to a free place (not on top of anyone)
    const others = ours.concat(sc.mates.filter(x => x !== m).map(x => [x[1],x[2]]), sc.opps), y = Math.round((sl + .8)*10)/10;
    for(const dx of [0, 2.4, -2.4, 4, -4]){ const c = [Math.max(1, Math.min(49, m[1]+dx)), y]; if(others.every(p => dist(p, c) >= 2.2)){ m[1] = c[0]; m[2] = c[1]; return; } }

function termText(text, grade){

  });

//   voice:  VOICE (above CLIP3D) reads each step aloud; player.voice = false turns it off for one player
//   look:   pitchTexture, label, makePlayer (arms and legs that swing), arrow, disc, makeBall, addPitch
//   motion: run (move a player, face the way they go, swing arms and legs)
//   clips:  plan (a drill question → the steps じょうきょう → もんだい → ◎ → ○ → ✕ → ポイント), pose (where everyone is),
//           player (plays a clip in any three.js scene), fitBox / eyeCam (the cameras)
// ===== VOICE: reads the captions aloud (the browser's own Japanese voice; no files, no account) =====
// On by default; the 🔊 button turns it off and the choice is kept. A clip step waits until its words are read.

    .replace(/人\s*対\s*/g, "人、たい、").replace(/(^|[、。！\s])間/g, "$1すきま").replace(/(?<![時瞬仲])間/g, "あいだ")

  // the thrower of a throw-in: faces into the pitch (towards the throw), both hands hold the ball over the head, and

  // ---------- a clip player: put it in any scene, call update() every frame ----------

    // answersOnly: only ◎ → ○ → ✕ → ポイント (the drill, where じょうきょう and もんだい were just read)
    P.load = (q, answersOnly=false) => {

    P.sayStep = () => { const st = C.steps[C.i], plain = st.r === undefined && !st.cls; return [plain ? "" : st.k, st.title && kj(st.title), st.text && kj(st.text)].filter(Boolean).join("。"); };

  // ---------- camera ----------
  const VIEWS = {back:{yaw:0, pitch:.62, en:"BACK"}, diag:{yaw:.75, pitch:.6, en:"DIAGONAL"}, top:{yaw:0, pitch:1.5, en:"TOP"}, eye:{en:"PLAYER EYE"}};
  const cv = {view:"back", yaw:0, pitch:.62, zoom:1, dyaw:0, dpitch:0, drag:false, eyeYaw:0, sway:true};
  function camera(now){
    const C = clip.C, r = stage.getBoundingClientRect(), w = Math.max(1, renderer.domElement.clientWidth || r.width), h = Math.max(1, renderer.domElement.clientHeight || r.height);
    if (Math.abs(w - (camera.w||0)) > .5 || Math.abs(h - (camera.h||0)) > .5){ camera.w = w; camera.h = h; renderer.setSize(w, h, false); cam.aspect = w/h; }
    if (cv.view === "eye"){ C.meG.visible = false; cam.aspect = w/h; cam.clearViewOffset(); CLIP3D.eyeCam(cam, C, cv.eyeYaw); }
    else {
      C.meG.visible = true; cam.fov = 46;
      const V = VIEWS[cv.view], sway = cv.sway && playing && cv.view !== "top" ? Math.sin(now/3200)*.18 : 0;
      // the caption covers the bottom of the picture and the buttons the top: fit the play into the free band between them
      // (the camera frames a shorter picture, which is then drawn at the top of the free band)
      const top = Math.min(h*.15, 44), bot = Math.min(h*.45, ui.cap.offsetHeight + 14), free = Math.max(h*.4, h - top - bot);
      cam.aspect = w/free; cam.clearViewOffset();
      CLIP3D.fitBox(cam, C.box, V.yaw + cv.dyaw + sway, Math.max(.25, Math.min(1.52, V.pitch + cv.dpitch)), cv.zoom);
      cam.setViewOffset(w, free, 0, -top, w, h); cam.updateProjectionMatrix();
    }
    clip.labels(cv.view === "eye" ? .7 : 1);
    // the ball a little bigger than real so it is easy to follow (smaller through the eyes)
    clip.ballScale = cv.view === "eye" ? .6 : 1.1; clip.ringScale = cv.view === "eye" ? .4 : .6;
  }
  // drag = turn the camera (or the head in PLAYER EYE), wheel / pinch = come closer
  { let dr = null, pts = new Map(), pinch = 0;
    stage.addEventListener("pointerdown", e => { if (e.target.closest("button, .cap")) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      dr = {x:e.clientX, y:e.clientY, yaw:cv.dyaw, pitch:cv.dpitch, eyeYaw:cv.eyeYaw}; if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = {d:Math.hypot(a[0]-b[0], a[1]-b[1]), z:cv.zoom}; } stage.style.cursor = "grabbing"; });
    stage.addEventListener("pointermove", e => { if (!dr || !pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2 && pinch){ const [a, b] = [...pts.values()]; cv.zoom = Math.max(.4, Math.min(1.8, pinch.z*pinch.d/Math.max(20, Math.hypot(a[0]-b[0], a[1]-b[1])))); return; }
      const dx = e.clientX - dr.x, dy = e.clientY - dr.y;
      if (cv.view === "eye") cv.eyeYaw = dr.eyeYaw - dx*.006; else { cv.dyaw = dr.yaw - dx*.008; cv.dpitch = dr.pitch + dy*.006; cv.sway = false; } });
    const up = e => { pts.delete(e.pointerId); if (!pts.size){ dr = null; pinch = 0; stage.style.cursor = "grab"; } };
    stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
    stage.addEventListener("wheel", e => { if (cv.view === "eye") return; e.preventDefault(); cv.zoom = Math.max(.4, Math.min(1.8, cv.zoom*(1 + e.deltaY*.001))); }, {passive:false}); }
  function setView(v){ cv.view = v; cv.dyaw = 0; cv.dpitch = 0; cv.zoom = 1; cv.eyeYaw = 0; cv.sway = true;
    document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); }
  document.getElementById("views").innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button data-v="${k}" aria-pressed="${k === "back"}">${v.en}</button>`).join("");
  document.getElementById("views").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) setView(b.dataset.v); });

  ui.play.addEventListener("click", () => { if (!clip.C) return; if (!playing && clip.ended()) goStep(0); setPlaying(!playing); });
  document.getElementById("prev").addEventListener("click", () => goStep(clip.C.t > 1.2 ? clip.C.i : clip.C.i - 1));
  document.getElementById("next").addEventListener("click", () => goStep(clip.C.i + 1));
  ui.dots.addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b) goStep(+b.dataset.step); });
  document.getElementById("speed").after(VOICE.button("b"));
  const sp = document.getElementById("speed");
  sp.innerHTML = [.5, 1, 1.5].map(v => `<button data-sp="${v}" aria-pressed="${v === 1}">${v}×</button>`).join("");
  sp.addEventListener("click", e => { const b = e.target.closest("[data-sp]"); if (!b) return; speed = +b.dataset.sp; sp.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  document.addEventListener("keydown", e => { if (e.target.closest("input")) return; if (e.key === " "){ e.preventDefault(); ui.play.click(); } if (!clip.C) return; if (e.key === "ArrowRight") goStep(clip.C.i + 1); if (e.key === "ArrowLeft") goStep(clip.C.i - 1); });
  requestAnimationFrame(tick);


  return {
    load(q, tag, autoplay=true){ clip.load(q); ui.tag.textContent = tag; caption(); setPlaying(autoplay); },
    refresh(){ if (clip.C) caption(); },
    set onEnd(f){ onEnd = f; },
    _clip: () => clip.C, _goStep: goStep
  };
})();


// ---------- the page: grade, position, category and scene lists ----------
// Position first, then a few categories of what that position does (GUIDE_CATS / GUIDE_CAT_OF in guide-cats.js:
// every question sorted by what its ◎ answer teaches), then the scenes.
(() => {
  if (!X3) return;
  const $ = id => document.getElementById(id);
  // きみ's position in the scene, grouped the way a team talks about them
  const POS = GUIDE_POS;
  let pos = (() => { try{ return localStorage.getItem("x3_pos") || "FW"; }catch(e){ return "FW"; } })();
  if (!POS.some(p => p[0] === pos)) pos = "FW";
  let cat = null, list = [], qi = 0;
  const inPos = (q, p=pos) => POS.find(x => x[0] === p)[2].includes(q.scene.me[0]);
  const forGrade = q => q.g[0] <= S.grade && S.grade <= q.g[1];
  const qsFor = c => Q.filter(q => forGrade(q) && inPos(q) && GUIDE_CAT_OF[q.id] === c);
  const cats = () => GUIDE_CATS[pos], catOf = id => cats().find(c => c.id === id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function grades(){
    $("grades").innerHTML = [9, 10, 11, 12].map(g => `<button data-g="${g}" aria-pressed="${g === S.grade}">U-${g}</button>`).join("");
  }
  function positions(){
    $("pos").innerHTML = POS.map(([k, name]) => { const n = Q.filter(q => forGrade(q) && inPos(q, k)).length;
      return `<button data-pos="${k}" aria-pressed="${k === pos}" ${n ? "" : "disabled"}><b>${k}</b><small>${esc(name)} ${n}</small></button>`; }).join("");
  }
  function categories(){
    $("themes").innerHTML = `<div class="cats">${cats().map(c => { const n = qsFor(c.id).length;
      return `<button data-th="${c.id}" aria-pressed="${c.id === cat}" ${n ? "" : "disabled"}><b>${esc(K(c.name))}</b><small>${esc(K(c.sub))}</small><i>${n}</i></button>`; }).join("")}</div>`;
  }
  function scenes(){
    $("aim").hidden = true;   // (each category button already says what it is about)
    // each scene by what happens in it (the first sentence of situ; many questions just ask 「どうする？」) and its point
    const head = q => { const t = K(q.situ), i = t.indexOf("。"); const f = i > 0 ? t.slice(0, i + 1) : t; return f.length > 44 ? f.slice(0, 43) + "…" : f; };
    // a pull-down of the scenes, and the point of the one shown
    $("qs").innerHTML = `<select id="qsel" aria-label="場面をえらぶ">${list.map((q, i) => `<option value="${i}" ${i === qi ? "selected" : ""}>${String(i + 1).padStart(2, "0")}　${esc(head(q))}</option>`).join("")}</select>`
      + (list[qi] ? `<p class="qpt"><b>ポイント</b>${esc(K(list[qi].point))}<small>きみ：${esc(list[qi].scene.me[0])}　${list[qi].scene.f}</small></p>` : "");
  }
  function show(i, autoplay=true){
    qi = i; const q = list[qi];
    X3.load(q, `${pos} ・ ${K(catOf(cat).name)}  ${qi + 1}/${list.length}  ・ きみ：${q.scene.me[0]}  ・ ${q.scene.f}`, autoplay);
    scenes();
  }
  function pickCat(id, autoplay=true){
    if (!catOf(id)) id = cats()[0].id;
    cat = id; list = qsFor(id); positions(); categories();
    if (!list.length){ const first = cats().find(c => qsFor(c.id).length); if (first) return pickCat(first.id, autoplay);
      // nothing for this position at this grade: the first position that has scenes
      const p = POS.find(x => Q.some(q => forGrade(q) && inPos(q, x[0]))); if (p && p[0] !== pos){ pos = p[0]; return pickCat(null, autoplay); } return; }
    show(0, autoplay);
  }
  $("grades").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b) return; S.grade = +b.dataset.g; try{ localStorage.setItem("x3_grade", S.grade); }catch(err){} grades(); pickCat(cat); });
  $("pos").addEventListener("click", e => { const b = e.target.closest("[data-pos]"); if (!b || b.disabled) return; pos = b.dataset.pos; try{ localStorage.setItem("x3_pos", pos); }catch(err){} pickCat(null); });
  $("themes").addEventListener("click", e => { const b = e.target.closest("[data-th]"); if (b && !b.disabled) pickCat(b.dataset.th); });
  $("qs").addEventListener("change", e => { if (e.target.id === "qsel") show(+e.target.value); });
  // when a scene ends: the next scene; after the last one, the next category of this position that has scenes
  X3.onEnd = () => { if (!$("auto").checked) return;
    if (qi < list.length - 1) return show(qi + 1);
    const cs = cats(), k = cs.findIndex(c => c.id === cat), next = cs.slice(k + 1).find(c => qsFor(c.id).length);
    if (next){ pickCat(next.id, true); const b = document.querySelector(`#themes [data-th="${next.id}"]`); if (b && window.innerWidth > 900) b.scrollIntoView({block:"nearest"}); } };
  grades(); pickCat(null, false);
})();

</script>
