<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="戦術ドリル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="8人制サッカーの戦術ドリル。こうげき・しゅび・切りかえのテーマ別に、目的を考えて答える。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head><body>
<title>8人制 戦術ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Dark only: the night-stadium look is the same on every phone, whatever its light/dark setting.
   Layout: same night-stadium world as the 作戦ボード. Kid flow = one big card per step (name → position → 5 questions → result); coach tab = score grid */
:root{
  --bg:#0b1310; --surface:#121c18; --surface-2:#1a2620; --line:#26362e;
  --fg:#eef5f0; --muted:#8fa498;
  --accent:#ff6b2c; --accent-ink:#1b0a03;
  --opp:#4b8dff; --opp-ink:#06122a;
  --grass:#1f6a41; --grass-2:#1a5d39; --chalk:rgba(255,255,255,.85);
  --mate:#ffd23d; --mate-ink:#2a2000; --pick:#ff6b2c; --pick-ink:#1b0a03;
  --good:#3ddc8c; --bad:#ff5f5f; --warn:#ffc53d;
  --good-bg:rgba(61,220,140,.14); --bad-bg:rgba(255,95,95,.14); --warn-bg:rgba(255,197,61,.14);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --num:"Oswald","Dela Gothic One","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:14px 32px}
.app{max-width:1100px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:var(--fg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.tabs button{border:0;background:transparent;padding:10px 16px;min-height:44px;font-weight:700;font-size:.92rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px;min-width:0}
.muted{color:var(--muted)}
.step{font-size:.78rem;color:var(--muted);letter-spacing:.08em;font-weight:700}
.big{min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;padding:12px 22px}
.ghost{min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:10px 16px;font-weight:700;font-size:.92rem}
.teamline{margin:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.9rem;background:var(--good-bg);border-radius:10px;padding:8px 12px}
.teamline b{color:var(--good)}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* name + position pickers */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.chip{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.1rem;padding:8px 12px;overflow-wrap:anywhere}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.guest{font-weight:500;color:var(--muted);border-style:dashed}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 180px;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);min-height:46px}
.lvgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv{border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:10px;text-align:left;display:grid;gap:2px;min-height:96px;align-content:start}
.lv b{font-family:var(--num);font-size:1.35rem;line-height:1.1}
.lv span{font-weight:700;font-size:.86rem;line-height:1.35}
.lv small{font-size:.72rem;color:var(--muted);font-weight:700}
.lv i{font-style:normal;font-size:.72rem;color:var(--warn);letter-spacing:.02em}
.lv.rec{border-color:var(--accent)} .lv.rec small{color:var(--accent)}
.lv.done{border-color:var(--good);background:var(--good-bg)} .lv.done small{color:var(--good)}
select{font:inherit;font-weight:700;font-size:1rem;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);min-height:46px}
select.gsel{min-height:38px;font-size:.88rem;padding:4px 8px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pos{border-radius:16px;border:2px solid var(--line);background:var(--surface-2);padding:14px;text-align:left;display:grid;gap:4px;min-height:96px}
.pos b{font-family:var(--num);font-size:1.7rem;line-height:1;color:var(--accent);letter-spacing:.02em}
.pos span{font-weight:700}
.pos small{color:var(--muted);font-size:.8rem;line-height:1.4}
.pos .stars{font-size:.8rem;color:var(--warn)}
.pos.all b{color:var(--fg)}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.pitchwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
/* phone: keep a smaller pitch pinned on top so the move stays in view while tapping choices */
@media (max-width:820px){.pitchwrap{top:env(safe-area-inset-top,0px);z-index:2;padding:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--bg) 70%,transparent)} svg.pitch{max-height:40vh;width:auto;max-width:100%} .legend{font-size:.7rem;padding-top:2px}}
svg.pitch{width:100%;max-width:440px;margin:0 auto;display:block;aspect-ratio:56/74;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.78rem;color:var(--muted);padding-top:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.04em}
.tag.me{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.progress{display:flex;gap:6px;margin-left:auto}
.progress i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.ng{background:var(--bad)} .progress i.now{background:var(--fg)}
.qtext{font-size:1.25rem;font-weight:700;line-height:1.55;margin:0;text-wrap:pretty}
.situ{margin:0;color:var(--muted);font-size:.95rem}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:12px;min-height:64px;font-size:1.02rem;font-weight:500;line-height:1.45}
.choice .L{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.3rem;background:var(--pick);color:var(--pick-ink)}
.choice:hover:not([disabled]){border-color:var(--pick)}
.choice[disabled]{cursor:default}
.choice.preview{border-color:var(--pick);background:color-mix(in srgb,var(--pick) 14%,var(--surface-2))}
.choice .confirm{grid-column:2;font-size:.85rem;font-weight:700;color:var(--warn)}
.taphint{margin:0;font-size:.85rem;color:var(--muted)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.right .L{background:var(--good);color:var(--bg)}
.choice.wrong .L{background:var(--bad);color:var(--bg)}
.choice .why{grid-column:2;font-size:.9rem;color:var(--fg);opacity:.85}
.verdict{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px}
.verdict.ok{background:var(--good-bg)} .verdict.ng{background:var(--bad-bg)}
.verdict .mark{font-family:var(--display);font-size:2.4rem;line-height:1}
.verdict.ok .mark{color:var(--good)} .verdict.ng .mark{color:var(--bad)}
.verdict p{margin:0;font-weight:700}
.point{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:4px 12px 12px 4px;font-weight:700}
.point small{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--warn)}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.mover{transition:transform 1s cubic-bezier(.3,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.mover{transition:none}}
.me-ring{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pop,.me-ring{animation:none}}

/* result */
.score{font-family:var(--num);font-size:4rem;line-height:1;font-weight:700}
.score small{font-size:1.6rem;color:var(--muted)}
.starsbig{font-size:2rem;letter-spacing:.1em;color:var(--warn)}
.review{display:grid;gap:8px}
.review div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;font-size:.92rem}
.review b{font-family:var(--display);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* coach */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
td .pct{display:inline-block;min-width:54px;padding:3px 8px;border-radius:8px;font-family:var(--num);font-weight:600}
.p-hi{background:var(--good-bg);color:var(--good)} .p-mid{background:var(--warn-bg);color:var(--warn)} .p-lo{background:var(--bad-bg);color:var(--bad)} .p-na{color:var(--muted)}
td button.link{border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.missed{display:grid;gap:8px}
.missed div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.missed .n{font-family:var(--num);font-weight:600;color:var(--bad)}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}

/* ---------- matchday look: floodlit pitch, kit-number type, player cards, scoreboard results ---------- */
:root{ --gold:#ffcf4a; --gold-ink:#2b1d00; --stripe:rgba(255,255,255,.018); --glow:color-mix(in srgb,var(--accent) 40%,transparent); }
body{background:
  radial-gradient(900px 380px at 15% -8%, color-mix(in srgb,var(--good) 10%,transparent), transparent 65%),
  radial-gradient(700px 320px at 100% 0%, color-mix(in srgb,var(--opp) 9%,transparent), transparent 60%),
  repeating-linear-gradient(90deg, transparent 0 64px, var(--stripe) 64px 128px), var(--bg);
  background-attachment:fixed;min-height:100vh}
html{background:var(--bg)}
header{padding:10px 14px;border-radius:18px;background:linear-gradient(100deg,var(--surface),var(--surface-2));border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:0 0 auto}
h1{font-size:1.45rem;letter-spacing:.04em}
h1 small{letter-spacing:.12em}
.tabs{border-radius:999px;padding:3px;gap:3px}
.tabs button{border-radius:999px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--glow)}
.card{border-radius:20px;box-shadow:0 14px 34px color-mix(in srgb,#000 22%,transparent)}
h2{font-size:1.45rem;letter-spacing:.02em}

/* stepper: where the kid is in name → choose → play */
.stepper{display:flex;align-items:center;gap:8px;font-family:"Oswald","Zen Kaku Gothic New",sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.14em;color:var(--muted)}
.stepper i{display:block;width:34px;height:6px;border-radius:3px;background:var(--line)}
.stepper i.on{background:var(--accent);box-shadow:0 0 10px var(--glow)}
.stepper b{color:var(--fg);font-weight:700}
.sect{font-family:"Oswald","Zen Kaku Gothic New",sans-serif;font-weight:600;letter-spacing:.16em;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* name chips as kit badges */
.chips{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chip{display:flex;align-items:center;gap:10px;text-align:left;min-height:66px;border-radius:16px;transition:transform .12s,border-color .12s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip .av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.chip.guest .av{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.chip .nm{display:grid;line-height:1.25;min-width:0}
.chip .nm small{font-weight:500}

/* level medals */
.lvgrid{gap:10px}
.lv{position:relative;overflow:hidden;min-height:112px;border-radius:16px;padding:12px;gap:4px;transition:transform .12s,border-color .12s}
.lv:hover{transform:translateY(-2px);border-color:var(--fg)}
.lv b{font-size:1.7rem;letter-spacing:.02em}
.lv b em{font-style:normal;font-size:.55em;color:var(--muted);margin-right:2px;letter-spacing:.1em}
.lv .bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.lv .bar i{display:block;height:100%;background:var(--good)}
.lv.rec{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.lv.rec small{color:var(--accent)}
.lv.done{border-color:var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 16%,var(--surface-2)),var(--surface-2) 70%)}
.lv.done small{color:var(--gold)}
.lv .medal{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--gold);color:var(--gold-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--gold) 50%,transparent)}

/* position player cards with a mini 3-3-1 pitch */
.posgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pos{position:relative;overflow:hidden;border-radius:18px;padding:12px 12px 12px 14px;grid-template-columns:minmax(0,1fr) 46px;column-gap:10px;align-content:start;min-height:118px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 13%,var(--surface-2)) 0%,var(--surface-2) 55%);transition:transform .12s,border-color .12s}
.pos:hover{transform:translateY(-3px);border-color:var(--accent)}
.pos > *{grid-column:1 / -1}
.pos b{grid-column:1;grid-row:1;align-self:center}
.pos .mini{grid-column:2;grid-row:1;width:46px;height:60px;align-self:start}
.pos .stars{font-size:.78rem;letter-spacing:0;overflow-wrap:anywhere;line-height:1.3}
.pos b{font-size:2rem}
.pos.all{background:var(--surface-2)}
.pos.ex{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 20%,var(--surface-2)) 0%,color-mix(in srgb,var(--bad) 12%,var(--surface-2)) 100%)}
.pos.ex b{color:var(--gold);letter-spacing:.06em}
.pos.all b{color:var(--gold)}

/* quiz */
.progress i{width:30px;height:9px;border-radius:5px}
.progress i.now{background:var(--accent);box-shadow:0 0 8px var(--glow)}
.qtext{font-size:1.35rem}
.choice{border-radius:16px;transition:transform .1s,border-color .12s}
.choice:hover:not([disabled]){transform:translateX(3px)}
.choice .L{border-radius:12px;font-size:1.25rem}
.verdict{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px}
.verdict .mark{font-size:2.6rem}
.verdict .stamp{font-family:var(--display);font-size:1.9rem;letter-spacing:.04em;line-height:1}
.verdict.ok .stamp{color:var(--good)} .verdict.ng .stamp{color:var(--bad)}
.verdict p{font-size:.98rem}
.verdict.ok.pop{animation:goal .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes goal{0%{transform:scale(.7) rotate(-3deg);opacity:0}60%{transform:scale(1.04) rotate(1deg);opacity:1}100%{transform:none}}
.verdict.ok::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,color-mix(in srgb,var(--good) 10%,transparent) 22px 30px);pointer-events:none}

/* result scoreboard */
.board{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:16px 18px;border-radius:18px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.board .sc{display:flex;align-items:baseline;gap:8px;font-family:var(--num);font-weight:700;line-height:.9}
.board .sc .n{font-size:4.6rem;color:var(--fg)}
.board .sc .of{font-size:1.8rem;color:var(--muted)}
.board .lbl{font-family:var(--num);letter-spacing:.18em;font-size:.75rem;color:var(--muted)}
.board .starsbig{font-size:1.8rem;letter-spacing:.08em;color:var(--gold)}
.clear{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 22%,var(--surface-2)),var(--surface-2));border:1px solid var(--gold)}
.clear b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--gold);letter-spacing:.04em}
.clear.pop{animation:goal .6s cubic-bezier(.2,1.4,.4,1)}
@media (max-width:520px){.board{grid-template-columns:1fr}.board .sc .n{font-size:3.8rem}}

/* coach: summary strip before the table */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface-2);display:grid;gap:2px;min-width:0}
.kpi span{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.kpi b{font-family:var(--num);font-weight:700;font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{font-size:.8rem;color:var(--muted)}
.kpi.hi b{color:var(--good)} .kpi.lo b{color:var(--bad)}
table th{position:sticky;top:0;background:var(--surface)}
table td:first-child,table th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
tbody tr:hover td{background:var(--surface-2)}
td .pct{min-width:58px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.verdict.ok.pop,.clear.pop{animation:none}.chip,.lv,.pos,.choice{transition:none}}

/* ---------- tactics drill v2: themes by moment of the game, ◎○✕ rating, tap and look questions ---------- */
.formrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;min-height:38px;font-family:var(--num);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mix{display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;border:2px solid var(--accent);padding:12px 16px;min-height:62px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 18%,var(--surface-2)),var(--surface-2) 70%);transition:transform .12s}
.mix:hover{transform:translateY(-2px)}
.mix b{font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--accent)}
.mix span{font-weight:700;font-size:.92rem}
.mix.ex{border-color:var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 20%,var(--surface-2)),color-mix(in srgb,var(--bad) 10%,var(--surface-2)))}
.mix.ex b{color:var(--gold);font-family:var(--num);font-weight:700;letter-spacing:.08em}
.phase{display:grid;gap:8px}
.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phead b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.phead span{font-size:.78rem;color:var(--muted);font-weight:700}
.ph-atk .phead b{color:var(--accent)} .ph-def .phead b{color:var(--opp)} .ph-lost .phead b{color:var(--bad)} .ph-won .phead b{color:var(--good)}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.th{position:relative;overflow:hidden;display:grid;gap:4px;align-content:start;text-align:left;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);padding:12px;min-height:96px;transition:transform .12s,border-color .12s}
.th:hover:not([disabled]){transform:translateY(-2px);border-color:var(--fg)}
.th[disabled]{opacity:.45;cursor:default}
.th b{font-size:1.02rem;line-height:1.35;grid-column:1}
.th small{font-size:.75rem;color:var(--muted);font-weight:700}
.th .bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.th .bar i{display:block;height:100%;background:var(--good)}
.th i.stars{font-style:normal;font-size:.72rem;color:var(--warn);font-weight:700}
.th.done{border-color:var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 16%,var(--surface-2)),var(--surface-2) 70%)}
.th .medal{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--gold);color:var(--gold-ink)}
.prow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.prow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pchip{display:grid;gap:2px;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:10px 12px}
.pchip b{font-family:var(--num);font-weight:700;font-size:1.4rem;color:var(--accent);line-height:1}
.pchip span{font-size:.78rem;font-weight:700;color:var(--muted)}
.pchip[disabled]{opacity:.45}

/* rating marks */
.rm{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;font-weight:700;font-size:.95rem;margin-right:6px;flex:0 0 auto}
.rm.r2{background:var(--good-bg);color:var(--good)} .rm.r1{background:var(--warn-bg);color:var(--warn)} .rm.r0{background:var(--bad-bg);color:var(--bad)}
.choice.okish{border-color:var(--warn);background:var(--warn-bg)}
.choice.okish .L{background:var(--warn);color:var(--bg)}
.choice .why{display:flex;align-items:flex-start}
.verdict.mid{background:var(--warn-bg)} .verdict.mid .mark,.verdict.mid .stamp{color:var(--warn)}
.progress i.mid{background:var(--warn)}
.aim{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));padding:10px 14px;border-radius:4px 12px 12px 4px;font-weight:700}
.aim small{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--accent)}
.marks{display:flex;gap:4px;flex-wrap:wrap}
.marks .rm{font-size:1.2rem;width:1.8em;height:1.8em;margin:0}

/* tap questions */
svg.pitch.tappable{cursor:crosshair}
.tapask{margin:0;font-weight:700;font-size:1.02rem;padding:12px 14px;border-radius:12px;border:2px dashed var(--pick);background:color-mix(in srgb,var(--pick) 10%,var(--surface-2))}
.zlist{display:grid;gap:8px}
.zlist div{display:flex;align-items:flex-start;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.92rem;border:2px solid transparent}
.zlist div.hit{border-color:var(--fg)}

/* look questions: the players fade away after the countdown */
svg.pitch .actors{transition:opacity .6s ease}
svg.pitch.hideplayers .actors{opacity:0}
.pitchwrap.veiled svg.pitch{filter:blur(6px) saturate(.6)}
.lookbox{display:grid;gap:10px;justify-items:start;padding:14px 16px;border-radius:14px;border:2px solid var(--opp);background:color-mix(in srgb,var(--opp) 12%,var(--surface-2))}
.lookbox p{margin:0;font-weight:700}
.lookbox.counting{grid-template-columns:auto 1fr;align-items:center}
.lookbox .count{font-family:var(--num);font-weight:700;font-size:3rem;line-height:1;color:var(--opp);min-width:1.2em;text-align:center}
.lookbox.gone{border-style:dashed}
.pairnote{margin:0;font-weight:700;color:var(--opp)}

/* coach: theme breakdown for one player */
.thstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.thstats div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:.85rem;font-weight:700}
@media (prefers-reduced-motion:reduce){svg.pitch .actors{transition:none}.mix,.th{transition:none}}

/* theme cards: a little pitch drawing of the idea, tinted by the moment of the game */
.thgrid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.th{grid-template-columns:minmax(0,1fr) 44px;column-gap:10px;min-height:118px;padding:12px 12px 12px 14px;--ph:var(--accent);
  background:linear-gradient(155deg,color-mix(in srgb,var(--ph) 16%,var(--surface-2)) 0%,var(--surface-2) 60%)}
.th > *{grid-column:1 / -1}
.th b{grid-column:1;grid-row:1;align-self:center}
.th .ticon{grid-column:2;grid-row:1 / span 2;width:44px;height:60px;align-self:start;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.th small{grid-column:1;grid-row:2}
.th.ph-def{--ph:var(--opp)} .th.ph-lost{--ph:var(--bad)} .th.ph-won{--ph:var(--good)}
.th:hover:not([disabled]){border-color:var(--ph)}
.th .medal{top:auto;bottom:8px;right:10px}
.th.done{border-color:var(--gold)}
</style>

<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 44 44" aria-hidden="true"><rect x="1" y="1" width="42" height="42" rx="11" fill="var(--grass)"/><rect x="8" y="6" width="28" height="32" rx="1.5" fill="none" stroke="var(--chalk)" stroke-width="1.4"/><line x1="8" y1="22" x2="36" y2="22" stroke="var(--chalk)" stroke-width="1.4"/><circle cx="22" cy="22" r="4.5" fill="none" stroke="var(--chalk)" stroke-width="1.4"/><circle cx="16" cy="30" r="2.6" fill="var(--accent)"/><circle cx="28" cy="30" r="2.6" fill="var(--accent)"/><circle cx="22" cy="14" r="2.6" fill="var(--accent)"/></svg>
    <h1>戦術ドリル<small>8人制・目的を考えてえらぼう</small></h1></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-drill" aria-selected="true">ドリル</button>
      <button role="tab" id="tab-coach" aria-selected="false">せいせき（コーチ）</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
// ---------- Formations ----------
// Pitch: x 0 (left) – 50 (right), y 0 (opponents' goal) – 68 (our goal). We attack upward.
// key → [label, x, y]. Keys are unique; labels are what the players see on the pitch.
const FORM = {
  "3-3-1":  {GK:["GK",25,64], LB:["LB",10,52], CB:["CB",25,54], RB:["RB",40,52], LH:["LH",8,38],  CH:["CH",25,40], RH:["RH",42,38], CF:["CF",25,24]},
  "2-3-2":  {GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], LH:["LH",7,40], CH:["CH",25,44], RH:["RH",43,40], FW1:["FW",18,24], FW2:["FW",32,24]},
  "2-4-1":  {GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], LH:["LH",6,38], CM1:["CM",19,44], CM2:["CM",31,40], RH:["RH",44,38], CF:["CF",25,22]},
  "3-2-2":  {GK:["GK",25,64], LB:["LB",10,52], CB:["CB",25,54], RB:["RB",40,52], CM1:["CM",19,42], CM2:["CM",31,42], FW1:["FW",18,24], FW2:["FW",32,24]},
  "2-1-2-1":{GK:["GK",25,64], CB1:["CB",17,54], CB2:["CB",33,54], DM:["DM",25,46], LH:["LH",8,36], RH:["RH",42,36], OH:["OH",25,32], CF:["CF",25,22]}
};
const FORMS = ["3-3-1","2-3-2","2-4-1","3-2-2","2-1-2-1"];
// mates for a scene: M("3-3-1", {CB:null, LB:[8,44]}) — null removes (usually "me"), [x,y] moves
function M(f, o={}){
  return Object.entries(FORM[f]).filter(([k])=>o[k]!==null).map(([k,[l,x,y]])=>{ const v=o[k]; return [l, v?v[0]:x, v?v[1]:y]; });
}
const POS_GROUP = l => /^GK/.test(l) ? "GK" : /^(CB|LB|RB|SB|WB)/.test(l) ? "DF" : /^(CF|FW|ST|LW|RW)/.test(l) ? "FW" : "MF";
const POS_NAME = {GK:"ゴールキーパー", DF:"ディフェンダー", MF:"ミッドフィルダー", FW:"フォワード"};

// ---------- The four moments of the game and the principles we train ----------
const PHASES = {
  atk:  {name:"こうげき",       sub:"ボールを持っているとき"},
  def:  {name:"しゅび",         sub:"相手がボールを持っているとき"},
  lost: {name:"うばわれた直後", sub:"こうげき → しゅび"},
  won:  {name:"うばった直後",   sub:"しゅび → こうげき"}
};
// g = first grade (U-9 = 9) that sees the theme
const THEMES = [
  {id:"goal",  ph:"atk",  g:9,  name:"ゴールをめざす",     aim:"こうげきの目的は、ゴールをうばうこと。シュートできるならシュート。できないなら、相手の背中（うら）をねらう。"},
  {id:"pos123",ph:"atk",  g:9,  name:"1・2・3の位置",      aim:"ボールの近くの安全なもらい場所（1）、相手と相手のあいだ（2）、いちばん外（3）。この順番で場所をつくる。"},
  {id:"lane",  ph:"atk",  g:10, name:"レーンと相手のわき", aim:"味方と同じたての線（レーン）に立たない。相手と相手のあいだや、相手の横（わき）で受ける。"},
  {id:"body",  ph:"atk",  g:9 , name:"見る・ヘソの向き",   aim:"受ける前にまわりを見る。ヘソを相手ゴールの方に向けて受ければ、前が見える。"},
  {id:"break", ph:"atk",  g:9 , name:"3つの突破",          aim:"相手のうしろへ行く方法は、スルーパス・ドリブル・ワンツーの3つ。相手の動き（矢印）を見て選ぶ。"},
  {id:"carry", ph:"atk",  g:10, name:"運ぶ・ひきつける",   aim:"前があいていたら運ぶ。相手が寄ってきたら、その相手が見ていた味方があく。"},
  {id:"order", ph:"def",  g:9,  name:"守りの順番",         aim:"①ゴールを守る ②前に進ませない ③ボールにせまる ④うばう。とびこまずに、この順番で考える。"},
  {id:"cover", ph:"def",  g:10, name:"チャレンジ＆カバー", aim:"1人がボールへ行き、ほかの人はそのななめうしろでカバー。2人で1つのボールを守る。"},
  {id:"slide", ph:"def",  g:11, name:"スライドと追いこみ", aim:"みんなでボールの方へずれる。まん中では外へ、サイドでは中へ追いこんで、うばう場所を決める。"},
  {id:"box",   ph:"def",  g:9 , name:"ゴール前の守り",     aim:"ゴール前では、ボールと相手の両方を見る。シュートのコースに入り、フリーの相手をつくらない。"},
  {id:"lost",  ph:"lost", g:9,  name:"うばわれた直後",     aim:"近い人はすぐうばい返す。間に合わない人は全力でもどって、まず前に進ませない。"},
  {id:"won",   ph:"won",  g:9,  name:"うばった直後",       aim:"相手がととのう前に、まず前（うら）をねらう。むりなら近くの1の位置で、うばわれない。"}
];
const TH = Object.fromEntries(THEMES.map(t=>[t.id,t]));

// ---------- Question bank ----------
// D({...}) adds one question.
//  type "pick": opts = [{t, at:[x,y]|null, go?, team?, r:2|1|0, why}]  (r: 2=◎ いちばん目的に合う / 1=○ それもあり / 0=✕)
//  type "tap":  zones = [{c:[x,y], rad, r:2|1, why}], miss = why for a tap outside every zone, target "me" (where to stand) or "ball" (where to pass)
//  look: seconds the scene is shown before the players disappear (look-then-answer questions)
//  pair: questions with the same pair id are played back to back (same scene, the opponent moves differently)
const Q = [];
const BASE_OPP_DEF = [[25,4]]; // their GK is always drawn
function D(q){
  q.type = q.type || "pick";
  q.g = q.g || [TH[q.th].g, 12];
  q.ph = TH[q.th].ph;
  q.pos = q.scene.me[0];
  if(q.type==="pick") q.opts.forEach(o=>{ if(o.r===undefined) o.r=0; });
  Q.push(q);
}

// ===== Batch 1: one question of each kind (pick / tap / look / pair), several formations =====

// --- ゴールをめざす ---
D({id:"g01", th:"goal", g:[9,12],
 situ:"ペナルティエリアの少し前でボールを持った。前の相手は少しはなれている。",
 q:"どうする？",
 scene:{f:"3-3-1", me:["CF",25,17], ball:[25,17], mates:M("3-3-1",{CF:null,LH:[10,22],RH:[40,22],CH:[24,30]}), opps:[[21,10],[30,10],[37,16]]},
 opts:[
  {t:"シュートをうつ", at:[24,0], r:2, why:"前があいていて、ゴールが見えている。こうげきのいちばんの目的はゴール。"},
  {t:"もう少しドリブルで近づいてからうつ", go:[25,13], r:1, why:"近づけば入りやすくなる。でも、そのあいだに相手がよってくる。うてるときはうとう。"},
  {t:"うしろのCHにもどす", at:[24,30], r:0, why:"ゴールが見えているのに、いちばんのチャンスをすててしまう。"}],
 point:"ゴールが見えたら、まずシュート。"});

// --- 1・2・3の位置（タップ） ---
D({id:"p01", th:"pos123", type:"tap", g:[9,12],
 situ:"CBがボールを持っている。相手のFWがCBに近づいてきた。CHのきみは相手のMFの前にいる。",
 q:"CBがこまらないように、どこでパスを受ける？",
 scene:{f:"3-3-1", me:["CH",25,38], ball:[25,54], mates:M("3-3-1",{CH:null}), opps:[[25,48],[25,34],[14,30],[36,30],[25,20]],
  arrows:[{f:[25,48],t:[25,51],k:"opp"}]},
 zones:[
  {c:[31,47], rad:4, r:2, why:"相手FWのよこで、CBのななめ前。相手にじゃまされずに、すぐパスをもらえる「1の位置」。"},
  {c:[37,42], rad:4, r:1, why:"パスは通る。でも少し遠くて、パスが長くなるぶん相手がよってくる。"}],
 miss:"そこは相手のかげ（うしろ）か、遠すぎる。CBのななめ前で、相手にじゃまされない場所をさがそう。",
 point:"こまっている味方の近く、ななめの場所が1の位置。"});

// --- レーンと相手のわき（タップ、2-3-2） ---
D({id:"l01", th:"lane", type:"tap", g:[10,12],
 situ:"右サイドのRHがタッチラインぞいでボールを持った。前の相手はRHにむかっている。",
 q:"FWのきみは、どこでパスを受ける？",
 scene:{f:"2-3-2", me:["FW",32,22], ball:[44,30], mates:M("2-3-2",{FW2:null,RH:[44,30],FW1:[20,18],CH:[25,38]}),
  opps:[[42,24],[34,14],[24,12],[16,14],[30,26],[20,26]]},
 zones:[
  {c:[38,19], rad:3.5, r:2, why:"相手と相手のあいだで、RHとちがうレーン。前を向いて受けられて、ゴールにも近い。"},
  {c:[32,26], rad:3.5, r:1, why:"受けられる。でも相手MFのすぐ近くなので、受けたらすぐせまられる。"}],
 miss:"RHと同じたての線（レーン）か、相手のまうしろ。相手と相手のあいだをさがそう。",
 point:"味方と同じレーンに立たない。相手と相手のあいだで受ける。"});

// --- 見る・ヘソの向き ---
D({id:"b01", th:"body", g:[10,12],
 situ:"GKがボールを持っている。CBのきみにパスが来る。前には味方のCHとCFがいる。",
 q:"どんな体の向きで受ける？",
 scene:{f:"3-3-1", me:["CB",25,56], ball:[25,64], mates:M("3-3-1",{CB:null}), opps:[[18,44],[32,44],[25,34],[25,19]]},
 opts:[
  {t:"ヘソを前（相手ゴール）に向けて、横向きで受ける", r:2, why:"前の味方と相手が見える。受けたらすぐ前にパスや運ぶドリブルができる。"},
  {t:"GKの方を向いて、まっすぐ受ける", r:0, why:"見えるのはGKとうしろだけ。前に行くには、止めてからふりむかないといけない。"},
  {t:"受けるときだけ前を見て、また GKの方を向く", r:1, why:"見ることはできている。でも体が前を向いていないので、プレーがおそくなる。"}],
 point:"受ける前に、ヘソを前に。うしろではなく、前とサッカーをする。"});

// --- 3つの突破（ペア：相手の矢印で答えが変わる） ---
D({id:"k01a", th:"break", pair:"k01", g:[10,12],
 situ:"ドリブルしていたら、前の相手DFがいきおいよくボールをとりにとびこんできた。となりにLHがいる。",
 q:"どうする？",
 scene:{f:"3-3-1", me:["CH",25,30], ball:[25,30], mates:M("3-3-1",{CH:null,LH:[16,28],CF:[27,14]}), opps:[[25,24],[34,18],[18,16]],
  arrows:[{f:[25,24],t:[25,28],k:"opp"}]},
 opts:[
  {t:"LHにパスして、相手のうしろへ走ってリターンをもらう（ワンツー）", at:[16,28], team:[["me",26,22]], r:2, why:"相手が前にとびこんできた（大きな矢印）。そのうしろはがらあき。ワンツーでかんたんにぬける。"},
  {t:"そのままドリブルでぬきにいく", go:[27,24], r:1, why:"ぬけることもある。でも相手はもう近くて、ぶつかりやすい。"},
  {t:"止まって、ボールをうしろへもどす", at:[25,42], r:0, why:"せっかく相手が前に出てきてくれたのに、チャンスをのがす。"}],
 point:"相手がとびこんできたら、そのうしろがチャンス。"});
D({id:"k01b", th:"break", pair:"k01", g:[10,12],
 situ:"ドリブルしていたら、前の相手DFは下がりながら守っている。とびこんでこない。となりにLHがいる。",
 q:"どうする？",
 scene:{f:"3-3-1", me:["CH",25,30], ball:[25,30], mates:M("3-3-1",{CH:null,LH:[16,28],CF:[27,14]}), opps:[[25,22],[34,18],[18,16]],
  arrows:[{f:[25,22],t:[25,19],k:"opp"}]},
 opts:[
  {t:"そのまま前へ運び、相手が止まったらCFへスルーパス", go:[25,24], r:2, why:"相手は下がっていて、前があいている。運べばゴールに近づける。相手がとまったら、そのうしろへパス。"},
  {t:"LHにパスしてワンツー", at:[16,28], r:1, why:"できなくはない。でも相手はとびこんでいないので、うしろにスペースがない。"},
  {t:"止まって、相手が来るのを待つ", r:0, why:"相手は守りをととのえる時間ができる。"}],
 point:"相手が下がるなら、運んでゴールに近づく。相手の動きで答えはかわる。"});

// --- 守りの順番 ---
D({id:"o01", th:"order", g:[9,12],
 situ:"相手がドリブルで、まっすぐ自分のゴールにむかってくる。まわりに味方はいない。",
 q:"きみはどうまもる？",
 scene:{f:"3-3-1", me:["CB",25,48], ball:[25,36], mates:M("3-3-1",{CB:null,LB:[10,40],RB:[40,40],LH:[8,26],CH:[25,26],RH:[42,26],CF:[25,14]}), opps:[[25,36]],
  arrows:[{f:[25,36],t:[25,41],k:"opp"}]},

const TEAM = (()=>{
  const get=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
  const put=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  let team=get("pd8_team"), coach=get("pd8_coach");
  // ?team=… (players' link) / ?coach=… (coach's link: also shows the team results in せいせき)
  const decode=t=>{
    const b=atob(t.replace(/-/g,"+").replace(/_/g,"/")); const v=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,ch=>ch.charCodeAt(0))));
    return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v.u) && v.c ? {u:v.u,c:String(v.c),n:String(v.n||"チーム").slice(0,30)} : null;
  };
  try{
    const ps=new URLSearchParams(location.search), t=ps.get("team"), c=ps.get("coach");
    if(t){ const v=decode(t); if(v){ team=v; put("pd8_team",team); } }
    if(c){ const v=decode(c); if(v){ coach=v; put("pd8_coach",coach); S.tab="coach"; } }
    if(t||c) history.replaceState(null,"",location.pathname);
  }catch(e){}
  let busy=false;
  async function flush(){
    if(!team || busy) return; busy=true;
    let box=get("pd8_outbox")||[];
    while(box.length){
      try{ const r=await fetch(team.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({c:team.c},box[0]))}); if(!r.ok) break; }
      catch(e){ break; }
      box.shift(); put("pd8_outbox",box);
    }
    busy=false;
  }
  addEventListener("online",flush); setTimeout(flush,1500);
  return {
    get team(){ return team; },
    get coach(){ return coach; },
    leaveCoach(){ coach=null; put("pd8_coach",null); },
    send(rec){ if(!team) return; const box=get("pd8_outbox")||[]; box.push(rec); put("pd8_outbox",box.slice(-500)); flush(); },
    leave(){ team=null; put("pd8_team",null); }
  };
})();

// Inside claude.ai the shared artifact database is used. Opened as a web app (or signed out), records stay on this device.
function LocalDB(){
  const KEY="pd8_db", subs=[];
  localStorage.setItem(KEY+"_probe","1"); localStorage.removeItem(KEY+"_probe"); // throws if storage is blocked
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const save=d=>{ localStorage.setItem(KEY, JSON.stringify(d)); subs.forEach(f=>f()); };
  const snap=(name,ord,lim)=>{ let rows=Object.entries(load()[name]||{}).map(([id,v])=>({id,data:()=>v}));
    if(ord) rows.sort((a,b)=>(a.data()[ord[0]]>b.data()[ord[0]]?1:-1)*(ord[1]==="desc"?-1:1)); if(lim) rows=rows.slice(0,lim); return {docs:rows}; };
  const col=(name,ord,lim)=>({
    orderBy:(f,d)=>col(name,[f,d],lim), limit:n=>col(name,ord,n),
    onSnapshot(cb){ const f=()=>cb(snap(name,ord,lim)); subs.push(f); setTimeout(f,0); return ()=>subs.splice(subs.indexOf(f),1); },
    async add(v){ const d=load(); const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); (d[name]=d[name]||{})[id]=v; save(d); return {id}; },
    doc:id=>({ async update(v){ const d=load(); if(d[name]&&d[name][id]){ Object.assign(d[name][id],v); save(d); } },
               async delete(){ const d=load(); if(d[name]){ delete d[name][id]; save(d); } } })
  });
  return {collection:name=>col(name)};
}
(async()=>{

// soccer ball: white ball, black centre pentagon with seams, edge patches clipped to the circle
function soccerBall(cx,cy,r){
  const pt=(x,y,rad,deg)=>[x+rad*Math.cos(deg*Math.PI/180), y+rad*Math.sin(deg*Math.PI/180)];
  const pent=(x,y,rad,rot)=>[0,1,2,3,4].map(k=>pt(x,y,rad,rot+72*k).map(v=>v.toFixed(3)).join(",")).join(" ");
  const seams=[0,1,2,3,4].map(k=>{ const a=-90+72*k, [x1,y1]=pt(cx,cy,r*.36,a), [x2,y2]=pt(cx,cy,r*.8,a); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }).join("");
  const patches=[0,1,2,3,4].map(k=>{ const a=-54+72*k, [x,y]=pt(cx,cy,r*1.08,a); return `<polygon points="${pent(x,y,r*.3,a+180)}"/>`; }).join("");
  const id="bc"+(soccerBall.n=(soccerBall.n||0)+1);
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><g clip-path="url(#${id})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/><g fill="#141414" stroke="#141414" stroke-width="${r*.06}" stroke-linejoin="round">${patches}<polygon points="${pent(cx,cy,r*.36,-90)}"/>${seams}</g></g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#141414" stroke-width="${r*.12}"/>`;
}

// random draw; up to 2 questions this player has not got ◎ yet come first; paired questions stay together
function draw(list,n){
  const last = S.player && !S.player.guest ? latestBy(S.player.id) : {};
  const units = [], seen = new Set();
  for(const q of shuffle(list)){
    if(seen.has(q.id)) continue;
    const grp = q.pair ? list.filter(x=>x.pair===q.pair) : [q];
    grp.forEach(x=>seen.add(x.id)); units.push(grp);
  }
  const weak = units.filter(u=>u.some(q=>last[q.id] && last[q.id].r<2)).slice(0,2);
  const rest = units.filter(u=>!weak.includes(u));
  const out=[]; for(const u of shuffle(weak).concat(rest)){ if(out.length>=n) break; out.push(...u); }
  return out;
}
function startSet(mode){
  const g=S.grade;
  let pool;
  if(mode==="EX") pool = visible(g, true);
  else if(mode==="MIX") pool = visible(g);
  else if(mode.startsWith("P:")) pool = visible(g).filter(q=>POS_GROUP(q.pos)===mode.slice(2));
  else pool = visible(g).filter(q=>q.th===mode);
  S.mode=mode; S.set=draw(pool, PER_ROUND); S.i=0; S.results=[]; S.step="quiz"; newQuestion();
}
const themeCleared = (pid,th,src=store) => pid==="guest" ? S.guestClears.has(th) : src.clears.some(c=>c.pid===pid && c.th===th);
function recordClear(){
  if(!TH[S.mode]) return;
  const got=pts(S.results), max=2*S.results.length;
  if(got < Math.ceil(max*.8)) return;
  if(S.player.guest){ S.guestClears.add(S.mode); return; }
  if(store.db) store.db.collection("clears").add({pid:S.player.id, name:S.player.name, th:S.mode, score:got, of:max, at:Date.now()}).catch(()=>{});
  TEAM.send({type:"clear", name:S.player.name, grade:S.grade, level:TH[S.mode].name, score:got, of:max, at:Date.now()});
}
let lookTimer=null;
function newQuestion(){
  const q=S.set[S.i];
  S.picked=null; S.preview=null; S.tap=null; S.cur={me:[0,0],ball:[0,0],mates:{}}; S.tgt=null;
  S.order = q.type==="pick" ? shuffle(q.opts.map((_,i)=>i)) : [];

}
function startLook(){
  S.lookLeft = S.set[S.i].look; S.looking=true; render();
  lookTimer = setInterval(()=>{ S.lookLeft--; if(S.lookLeft<=0){ clearInterval(lookTimer); S.looking=false; S.hide=true; } render(); }, 1000);
}
function answer(r){
  const q=S.set[S.i];
  S.results.push({qid:q.id, r}); saveAnswer(q, r); render();
}
// where a tap landed on the pitch → rating (best zone that contains it)
function rateTap(q, p){
  let best=null;
  for(const z of q.zones){ if(Math.hypot(p[0]-z.c[0], p[1]-z.c[1]) <= z.rad && (!best || z.r>best.r)) best=z; }
  return best;
}

  const kpis = teamLast.length ? `<div class="kpis">
      <div class="kpi"><span>選手</span><b>${players.length}<small> 人</small></b><small>回答 ${players.reduce((t,p)=>t+answersOf(p.id,src).length,0)} 問</small></div>
      <div class="kpi"><span>チームの達成率</span><b>${pctOf(teamLast)}%</b><small>◎=2点・○=1点</small></div>
      ${byTh.length?`<div class="kpi hi"><span>とくいなテーマ</span><b style="font-size:1.1rem">${esc(byTh[0].t.name)}</b><small>${byTh[0].p}%</small></div>`:""}
      ${byTh.length>1?`<div class="kpi lo"><span>練習したいテーマ</span><b style="font-size:1.1rem">${esc(byTh.at(-1).t.name)}</b><small>${byTh.at(-1).p}%</small></div>`:""}
    </div>` : "";
  // most-missed questions (team, latest per player, not ◎)
  const miss={}, seen={};
  for(const a of teamLast){ seen[a.qid]=(seen[a.qid]||0)+1; if(a.r<2) miss[a.qid]=(miss[a.qid]||0)+1; }
  const missed = Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const chosen = a => { const q=QBY[a.qid]; return a.choiceText ?? (q.type==="tap" ? "ピッチをタップ" : K(q.opts[a.choice]?.t||"",12)); };
  let detail="";
  const p = S.coachPlayer && players.find(x=>x.id===S.coachPlayer);
  if(p){
    const last=latestBy(p.id, src), mine=Object.values(last);
    const notTop = mine.filter(a=>a.r<2).sort((a,b)=>a.r-b.r);
    detail = `<section class="card"><div class="row"><h2>${esc(p.name)} のテーマ別</h2>${remote?"":`<button class="del" id="delp" data-pid="${esc(p.id)}" style="margin-left:auto">選手を一覧からはずす</button>`}</div>
      <div class="thstats">${THEMES.map(t=>`<div><span>${esc(t.name)}</span>${pctCell(mine.filter(a=>a.th===t.id))}</div>`).join("")}</div>
      <h3 style="margin:0">◎ではなかった問題</h3>
      ${notTop.length?`<div class="missed">${notTop.map(a=>{const q=QBY[a.qid];return `<div><b class="rm r${a.r}">${RATE[a.r].mark}</b><span>${esc(K(q.situ+" "+q.q,12))}<br><small class="muted">えらんだ：${esc(chosen(a))}</small></span><span class="muted" style="font-size:.8rem">${esc(TH[q.th].name)}</span></div>`;}).join("")}</div>`:`<p class="muted" style="margin:0">いま、◎でない問題はありません。</p>`}
      <div id="delconfirm"></div></section>`;
  }
  return `<section class="card">
    <h2>${remote?esc(TEAM.coach.n)+" の":""}局面ごとの達成率</h2>
    ${remote?`<div class="row"><span class="muted" style="font-size:.85rem">スプレッドシートの成績（${new Date(REMOTE.at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})} に読みこみ）</span><button class="ghost" id="reload" style="margin-left:auto">${REMOTE.loading?"読みこみ中…":"↻ 最新にする"}</button></div>`:""}
    ${!remote&&store.local?`<p class="note">この端末で答えた分の成績です。ほかのスマホやタブレットの成績は、ここには出ません。</p>`:""}
    <p class="muted" style="margin:0;font-size:.88rem">それぞれの問題の「さいごの答え」で計算しています（◎=2点、○=1点、✕=0点）。名前を押すと、テーマ別の達成率と、◎ではなかった問題が見られます。</p>
    ${kpis}
    ${players.length?`<div class="tablewrap"><table><thead><tr><th>選手</th><th>学年</th>${phKeys.map(k=>`<th>${PHASES[k].name}</th>`).join("")}<th>ぜんたい</th><th>クリア</th><th>回答数</th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<p class="note">${remote?"まだ成績がとどいていません。選手がチームのリンクでドリルを解くと、ここに並びます。":"まだ選手がいません。「ドリル」タブで名前を追加すると、ここに成績が並びます。"}</p>`}
  </section>
  ${detail}
  <section class="card">
    <h2>チームで◎がとれていない問題</h2>
    ${missed.length?`<div class="missed">${missed.map(([id,n])=>{const q=QBY[id];return `<div><span class="tag">${esc(TH[q.th].name)}</span><span>${esc(K(q.situ+" "+q.q,12))}<br><small class="muted">${esc(K(q.point,12))}</small></span><span class="n">${n}/${seen[id]}人</span></div>`;}).join("")}</div>`
      :`<p class="muted" style="margin:0">まだデータがありません。</p>`}
  </section>
  ${remote?`<p class="muted" style="font-size:.8rem;margin:0">この端末はコーチ用リンクで開かれています。<button class="del" id="leavecoach">この端末からコーチ用をはずす</button></p>`:""}`;
}

// ---------- Render + events ----------
function render(){
  // with a team link the coach reads results in the team spreadsheet, so the on-device coach tab is hidden
  const coachOk = !TEAM.team || !!TEAM.coach;
  document.getElementById("tab-coach").hidden = !coachOk; if(!coachOk && S.tab==="coach") S.tab="drill";
  document.getElementById("tab-drill").setAttribute("aria-selected", S.tab==="drill");
  document.getElementById("tab-coach").setAttribute("aria-selected", S.tab==="coach");
  if(S.tab==="coach"){ view.innerHTML=renderCoach(); return; }
  const active = document.activeElement && document.activeElement.id==="newname" ? document.getElementById("newname").value : null;
  view.innerHTML = S.step==="name"?renderName():S.step==="pick"?renderPick():S.step==="quiz"?renderQuiz():renderResult();
  if(S.step==="quiz" && S.tgt){
    const t=S.tgt; S.cur={me:t.me, ball:t.ride?[0,0]:t.ball, mates:t.mates};
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const m=document.getElementById("mvMe"), bl=document.getElementById("mvBall");
      if(m){ m.style.transition=""; m.style.transform=`translate(${t.me[0]}px,${t.me[1]}px)`; }
      if(bl){ bl.style.transition=""; bl.style.transform=`translate(${t.ball[0]}px,${t.ball[1]}px)`; }
      document.querySelectorAll('[id^="mvT"]').forEach(g=>{ const v=t.mates[g.id.slice(3)]||[0,0]; g.style.transition=""; g.style.transform=`translate(${v[0]}px,${v[1]}px)`; });
    }));
  }
  if(active!==null){ const el=document.getElementById("newname"); if(el){ el.value=active; el.focus(); } }
}
document.getElementById("tab-drill").onclick=()=>{S.tab="drill";render();};
document.getElementById("tab-coach").onclick=()=>{S.tab="coach";render();};
view.addEventListener("submit", e=>{
  if(e.target.id!=="addform") return; e.preventDefault();
  const el=document.getElementById("newname"); const name=el.value.trim(); if(!name||!store.db) return;
  if(store.players.some(p=>p.name===name)){ el.value=""; return; }
  const grade = +document.getElementById("newgrade").value || 10;
  store.db.collection("players").add({name, grade, at:Date.now()}).then(()=>{ el.value=""; }).catch(()=>{});
});
view.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="pickgrade"){ S.grade=+t.value; render(); return; }
  if(t.dataset.gp && store.db){
    const v=+t.value; store.db.collection("players").doc(t.dataset.gp).update({grade: v || null}).catch(()=>{});
  }
});
// tap questions: the tapped point in pitch coordinates
view.addEventListener("click", e=>{
  const svg=e.target.closest("svg.tappable"); if(!svg) return;
  const q=S.set[S.i]; if(S.results.length>S.i) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  S.tap=[Math.max(0,Math.min(50,p.x)), Math.max(0,Math.min(68,p.y))]; render();
});
view.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.pid && t.classList.contains("chip")){
    S.player = t.dataset.pid==="__guest" ? {id:"guest",name:"ゲスト",guest:true} : store.players.find(p=>p.id===t.dataset.pid);
    if(S.player){ S.grade = S.player.grade || S.grade || 10; S.step="pick"; render(); } return;
  }
  if(t.id==="leaveteam"){ TEAM.leave(); render(); return; }
  if(t.id==="reload"){ REMOTE.err=""; loadRemote(); return; }
  if(t.id==="leavecoach"){ TEAM.leaveCoach(); Object.assign(REMOTE,{loaded:false,err:""}); S.tab="drill"; render(); return; }
  if(t.id==="back-name"){ S.step="name"; render(); return; }
  if(t.dataset.form){ S.form=t.dataset.form; try{ localStorage.setItem("pd8_form",S.form); }catch(e){} render(); return; }
  if(t.dataset.mode){ startSet(t.dataset.mode); return; }
  if(t.id==="lookstart"){ startLook(); return; }
  if(t.dataset.ci!==undefined && S.results.length<=S.i){
    // 1st tap = show the move, same choice again = answer
    if(S.preview!==+t.dataset.ci){ S.preview=+t.dataset.ci; render(); return; }
    const q=S.set[S.i]; S.picked=+t.dataset.ci; answer(q.opts[S.picked].r); return;
  }
  if(t.id==="tapok" && S.tap){ const q=S.set[S.i]; const z=rateTap(q,S.tap); answer(z?z.r:0); return; }
  if(t.id==="next"){ if(S.i+1<S.set.length){ S.i++; newQuestion(); } else { recordClear(); S.step="result"; render(); window.scrollTo({top:0,behavior:"smooth"}); } return; }
  if(t.id==="again"){ startSet(S.mode); return; }
  if(t.id==="other"){ S.step="pick"; render(); return; }
  if(t.id==="done"){ S.player=null; S.step="name"; render(); return; }
  if(t.dataset.cp){ S.coachPlayer=t.dataset.cp; render(); return; }
  if(t.id==="delp"){ document.getElementById("delconfirm").innerHTML=`<div class="row"><span>一覧からはずしますか？（成績のきろくは残ります）</span><button class="del" id="delyes" data-pid="${esc(t.dataset.pid)}">はずす</button><button class="del" id="delno">やめる</button></div>`; return; }
  if(t.id==="delno"){ document.getElementById("delconfirm").innerHTML=""; return; }
  if(t.id==="delyes" && store.db){ store.db.collection("players").doc(t.dataset.pid).delete().catch(()=>{}); S.coachPlayer=null; return; }
});
render();

</script>
