<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="戦術ドリル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head><body>
<title>8人制 ポジションドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: same night-stadium world as the 作戦ボード. Kid flow = one big card per step (name → position → 5 questions → result); coach tab = score grid */
:root{
  --bg:#0b1310; --surface:#121c18; --surface-2:#1a2620; --line:#26362e;
  --fg:#eef5f0; --muted:#8fa498;
  --accent:#ff6b2c; --accent-ink:#1b0a03;
  --opp:#4b8dff; --opp-ink:#06122a;
  --grass:#1f6a41; --grass-2:#1a5d39; --chalk:rgba(255,255,255,.85);
  --pick:#ffd23d; --pick-ink:#2a2000;
  --good:#3ddc8c; --bad:#ff5f5f; --warn:#ffc53d;
  --good-bg:rgba(61,220,140,.14); --bad-bg:rgba(255,95,95,.14); --warn-bg:rgba(255,197,61,.14);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --num:"Oswald","Dela Gothic One","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --pick:#f2b600; --pick-ink:#2a2000;
  --good:#178a4e; --bad:#cc2f2f; --warn:#b97a00;
  --good-bg:#e1f4e9; --bad-bg:#fde3e1; --warn-bg:#fbf0d4;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --pick:#f2b600; --pick-ink:#2a2000;
  --good:#178a4e; --bad:#cc2f2f; --warn:#b97a00;
  --good-bg:#e1f4e9; --bad-bg:#fde3e1; --warn-bg:#fbf0d4;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:14px 32px}
.app{max-width:1100px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:var(--fg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.tabs button{border:0;background:transparent;padding:10px 16px;min-height:44px;font-weight:700;font-size:.92rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px;min-width:0}
.muted{color:var(--muted)}
.step{font-size:.78rem;color:var(--muted);letter-spacing:.08em;font-weight:700}
.big{min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;padding:12px 22px}
.ghost{min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:10px 16px;font-weight:700;font-size:.92rem}
.teamline{margin:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.9rem;background:var(--good-bg);border-radius:10px;padding:8px 12px}
.teamline b{color:var(--good)}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* name + position pickers */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.chip{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.1rem;padding:8px 12px;overflow-wrap:anywhere}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.guest{font-weight:500;color:var(--muted);border-style:dashed}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 180px;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);min-height:46px}
.lvgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv{border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:10px;text-align:left;display:grid;gap:2px;min-height:96px;align-content:start}
.lv b{font-family:var(--num);font-size:1.35rem;line-height:1.1}
.lv span{font-weight:700;font-size:.86rem;line-height:1.35}
.lv small{font-size:.72rem;color:var(--muted);font-weight:700}
.lv i{font-style:normal;font-size:.72rem;color:var(--warn);letter-spacing:.02em}
.lv.rec{border-color:var(--accent)} .lv.rec small{color:var(--accent)}
.lv.done{border-color:var(--good);background:var(--good-bg)} .lv.done small{color:var(--good)}
select{font:inherit;font-weight:700;font-size:1rem;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);min-height:46px}
select.gsel{min-height:38px;font-size:.88rem;padding:4px 8px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pos{border-radius:16px;border:2px solid var(--line);background:var(--surface-2);padding:14px;text-align:left;display:grid;gap:4px;min-height:96px}
.pos b{font-family:var(--num);font-size:1.7rem;line-height:1;color:var(--accent);letter-spacing:.02em}
.pos span{font-weight:700}
.pos small{color:var(--muted);font-size:.8rem;line-height:1.4}
.pos .stars{font-size:.8rem;color:var(--warn)}
.pos.all b{color:var(--fg)}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.pitchwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
/* phone: keep a smaller pitch pinned on top so the move stays in view while tapping choices */
@media (max-width:820px){.pitchwrap{top:env(safe-area-inset-top,0px);z-index:2;padding:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--bg) 70%,transparent)} svg.pitch{max-height:40vh;width:auto;max-width:100%} .legend{font-size:.7rem;padding-top:2px}}
svg.pitch{width:100%;max-width:440px;margin:0 auto;display:block;aspect-ratio:56/74;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.78rem;color:var(--muted);padding-top:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.04em}
.tag.me{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.progress{display:flex;gap:6px;margin-left:auto}
.progress i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.ng{background:var(--bad)} .progress i.now{background:var(--fg)}
.qtext{font-size:1.25rem;font-weight:700;line-height:1.55;margin:0;text-wrap:pretty}
.situ{margin:0;color:var(--muted);font-size:.95rem}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);padding:12px;min-height:64px;font-size:1.02rem;font-weight:500;line-height:1.45}
.choice .L{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.3rem;background:var(--pick);color:var(--pick-ink)}
.choice:hover:not([disabled]){border-color:var(--pick)}
.choice[disabled]{cursor:default}
.choice.preview{border-color:var(--pick);background:color-mix(in srgb,var(--pick) 14%,var(--surface-2))}
.choice .confirm{grid-column:2;font-size:.85rem;font-weight:700;color:var(--warn)}
.taphint{margin:0;font-size:.85rem;color:var(--muted)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.right .L{background:var(--good);color:var(--bg)}
.choice.wrong .L{background:var(--bad);color:var(--bg)}
.choice .why{grid-column:2;font-size:.9rem;color:var(--fg);opacity:.85}
.verdict{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px}
.verdict.ok{background:var(--good-bg)} .verdict.ng{background:var(--bad-bg)}
.verdict .mark{font-family:var(--display);font-size:2.4rem;line-height:1}
.verdict.ok .mark{color:var(--good)} .verdict.ng .mark{color:var(--bad)}
.verdict p{margin:0;font-weight:700}
.point{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:4px 12px 12px 4px;font-weight:700}
.point small{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--warn)}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.mover{transition:transform 1s cubic-bezier(.3,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.mover{transition:none}}
.me-ring{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pop,.me-ring{animation:none}}

/* result */
.score{font-family:var(--num);font-size:4rem;line-height:1;font-weight:700}
.score small{font-size:1.6rem;color:var(--muted)}
.starsbig{font-size:2rem;letter-spacing:.1em;color:var(--warn)}
.review{display:grid;gap:8px}
.review div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;font-size:.92rem}
.review b{font-family:var(--display);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* coach */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
td .pct{display:inline-block;min-width:54px;padding:3px 8px;border-radius:8px;font-family:var(--num);font-weight:600}
.p-hi{background:var(--good-bg);color:var(--good)} .p-mid{background:var(--warn-bg);color:var(--warn)} .p-lo{background:var(--bad-bg);color:var(--bad)} .p-na{color:var(--muted)}
td button.link{border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.missed{display:grid;gap:8px}
.missed div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.missed .n{font-family:var(--num);font-weight:600;color:var(--bad)}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
</style>

<div class="app">
  <header>
    <h1>ポジションドリル<small>8人制・3-3-1でかんがえよう</small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-drill" aria-selected="true">ドリル</button>
      <button role="tab" id="tab-coach" aria-selected="false">せいせき（コーチ）</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
// ---------- Question bank ----------
// Pitch coords: x 0(left)–50(right), y 0(あいてのゴール)–68(じぶんのゴール). Orange attacks upward.
// scene: me [pos,x,y], mates [[pos,x,y]], opps [[x,y]], ball [x,y], arrows [{f,t,k:'pass'|'run'|'opp'}]
// choices: first one is the correct answer (shuffled at display). at = marker on the pitch.
const POS = {
  GK:{name:"ゴールキーパー",desc:"さいごのまもり。うしろからのこうげきのスタート"},
  CB:{name:"センターバック",desc:"DFのまん中。ラインのリーダー"},
  SB:{name:"サイドバック",desc:"右と左のDF。上がるか、のこるか"},
  CH:{name:"センターハーフ",desc:"まん中のMF。つなぐ・うばう・とびだす"},
  SH:{name:"サイドハーフ",desc:"右と左のMF。いちばん走るポジション"},
  CF:{name:"センターフォワード",desc:"いちばん前。点をとる・前から守る"}
};
const BASE_OPP_DEF = [[25,4]]; // their GK always drawn
const Q = [
// ===== GK =====
{id:"gk1",pos:"GK",phase:"しゅび",
 situ:"あいてがきみたちの左サイドからせめてきた。",
 q:"GKのきみは、どこに立つ？",
 scene:{me:["GK",25,66],ball:[12,49],
  mates:[["LB",14,52],["CB",23,55],["RB",34,54],["LH",16,43],["CH",26,45],["RH",36,43],["CF",28,32]],
  opps:[[12,49],[21,44],[31,47],[25,30],[18,24],[34,24],[25,16]]},
 choices:[
  {t:"ボールとゴールのまん中をむすぶ線の上に立ち、すこし前に出る",at:[21,62],why:"ボールとゴールをむすぶ線の上にいると、シュートのコースをせまくできる。"},
  {t:"ゴールのまん中で、ゴールラインの上に立つ",at:[25,67.6],why:"近いほう（ニア）があいてしまう。うしろすぎると、シュートコースも広い。"},
  {t:"ボールをとりに、前へ走って出る",at:[15,54],why:"まだボールは遠い。とどく前にけられたら、ゴールががらあきになる。"}],
 point:"ボールが動いたら、GKも少しずつ動く。"},
{id:"gk2",pos:"GK",phase:"こうげき",
 situ:"キャッチしたボールを、手に持っている。あいてのFWはCBの前にいる。",
 q:"つぎのプレーはどれ？",
 scene:{me:["GK",25,63],ball:[25,63],
  mates:[["LB",6,50],["CB",25,56],["RB",44,50],["LH",8,36],["CH",25,42],["RH",42,36],["CF",25,24]],
  opps:[[24,51],[26,39],[42,47],[10,34],[38,32],[25,20],[16,22]]},
 choices:[
  {t:"近くにあいてがいないLBへ、ころがすか、なげる",at:[8,50],why:"前にあいてがいない「フリー」の味方。落ちついて前を向ける。"},
  {t:"前のCHへ、強いパスを出す",at:[24,43],why:"CHのすぐうしろにあいてがいる。とられたら、ゴール前で大ピンチ。"},
  {t:"思いきり前へける",at:[25,26],why:"ける判断もある。でもいまはLBがフリー。まずはつなげる味方をさがそう。"}],
 point:"前にあいてがいない味方が、いちばんのパスのあいて。"},
{id:"gk3",pos:"GK",phase:"しゅび",
 situ:"あいてがDFのうしろへ、長いボールをけった。あいてのFWが走りこんでくる。",
 q:"GKのきみは、どうする？",
 scene:{me:["GK",25,63],ball:[26,40],
  mates:[["LB",12,47],["CB",24,46],["RB",38,47],["LH",12,32],["CH",25,32],["RH",38,32],["CF",25,18]],
  opps:[[26,40],[31,45],[14,36],[36,36],[25,24],[16,14],[34,14]],
  arrows:[{f:[26,40],t:[27,54],k:"pass"},{f:[31,45],t:[29,54],k:"opp"}]},
 choices:[
  {t:"前にとびだして、あいてより先にボールをとる（エリアの外なら足でクリア）",at:[27,55],why:"DFのうしろのスペースはGKのしごと。先にさわれば、ピンチにならない。"},
  {t:"ゴールラインまで下がって待つ",at:[25,67.6],why:"あいてがボールを持ってから1対1になる。GKにいちばん不利な形。"},
  {t:"その場で止まって、ようすを見る",at:[22,60],why:"まようと、あいてが先にさわる。行くか行かないか、早く決めよう。"}],
 point:"DFのうしろのスペースは、GKのしゅびはんい。"},
{id:"gk4",pos:"GK",phase:"きりかえ",
 situ:"あいてのシュートをキャッチ！ あいては前に人がたくさん来ている。右のRHがフリーで前にいる。",
 q:"つぎのプレーはどれ？",
 scene:{me:["GK",25,63],ball:[25,63],
  mates:[["LB",10,54],["CB",24,57],["RB",38,54],["LH",12,44],["CH",24,46],["RH",44,30],["CF",27,26]],
  opps:[[16,50],[25,51],[34,48],[20,42],[30,40],[18,24],[33,26]]},
 choices:[
  {t:"すぐに、前にいるRHへ遠くまでなげる（ける）",at:[44,30],why:"あいてはまだ前にいる。うしろはガラガラ。いまがカウンターのチャンス！"},
  {t:"ゆっくりボールを持って、みんながもどるのを待つ",at:null,why:"待つと、あいてももどってしまう。チャンスが消える。"},
  {t:"となりのCBにころがす",at:[24,57],why:"CBのすぐ前にあいてがいる。とられたら、またピンチ。"}],
 point:"とったしゅんかん、あいてのうしろはガラガラ。前を見よう！"},
{id:"gk5",pos:"GK",phase:"こうげき",
 situ:"味方があいてのゴールの近くでせめている。DFラインはハーフラインまで上がった。",
 q:"GKのきみは、どこに立つ？",
 scene:{me:["GK",25,64],ball:[34,12],
  mates:[["LB",10,32],["CB",25,36],["RB",40,32],["LH",10,14],["CH",24,20],["RH",34,12],["CF",24,8]],
  opps:[[26,42],[20,10],[30,9],[38,14],[25,18],[12,18]]},
 choices:[
  {t:"ペナルティエリアの前のほうまで上がって、DFのうしろをまもる",at:[25,53],why:"DFラインといっしょに上がる。長いボールが来ても、先にとれる。"},
  {t:"ゴールラインの上に立つ",at:[25,67.6],why:"DFのうしろに広いスペースがある。長いボール1本で大ピンチ。"},
  {t:"ハーフラインの近くまで上がる",at:[25,40],why:"上がりすぎ。ロングシュートをけられたら、ゴールががらあき。"}],
 point:"味方がせめているとき、GKもDFラインといっしょに上がる。"},

// ===== CB =====
{id:"cb1",pos:"CB",phase:"しゅび",
 situ:"左サイドで、LBがボールを持ったあいてにむかっていった。",
 q:"CBのきみは、どこに立つ？",
 scene:{me:["CB",25,52],ball:[10,46],
  mates:[["GK",25,64],["LB",12,49],["RB",38,52],["LH",14,38],["CH",25,40],["RH",38,38],["CF",26,26]],
  opps:[[10,46],[27,47],[20,36],[34,36],[25,26],[16,18],[34,18]]},

// ---------- Team link (web app): results also go to the team coach's Google Sheet ----------
// Link format: ?team=<base64url JSON {u: Apps Script web app URL, c: team code, n: team name}>
const TEAM = (()=>{
  const get=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
  const put=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  let team=get("pd8_team");
  try{
    const t=new URLSearchParams(location.search).get("team");
    if(t){
      const b=atob(t.replace(/-/g,"+").replace(/_/g,"/")); const json=new TextDecoder().decode(Uint8Array.from(b,ch=>ch.charCodeAt(0)));
      const v=JSON.parse(json);
      if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v.u) && v.c){ team={u:v.u,c:String(v.c),n:String(v.n||"チーム").slice(0,30)}; put("pd8_team",team); }
      history.replaceState(null,"",location.pathname);
    }
  }catch(e){}
  let busy=false;
  async function flush(){
    if(!team || busy) return; busy=true;
    let box=get("pd8_outbox")||[];
    while(box.length){
      try{ const r=await fetch(team.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({c:team.c},box[0]))}); if(!r.ok) break; }
      catch(e){ break; }
      box.shift(); put("pd8_outbox",box);
    }
    busy=false;
  }
  addEventListener("online",flush); setTimeout(flush,1500);
  return {
    get team(){ return team; },
    send(rec){ if(!team) return; const box=get("pd8_outbox")||[]; box.push(rec); put("pd8_outbox",box.slice(-500)); flush(); },
    leave(){ team=null; put("pd8_team",null); }
  };
})();

  const save=d=>{ localStorage.setItem(KEY, JSON.stringify(d)); subs.forEach(f=>f()); };
  const snap=(name,ord,lim)=>{ let rows=Object.entries(load()[name]||{}).map(([id,v])=>({id,data:()=>v}));
    if(ord) rows.sort((a,b)=>(a.data()[ord[0]]>b.data()[ord[0]]?1:-1)*(ord[1]==="desc"?-1:1)); if(lim) rows=rows.slice(0,lim); return {docs:rows}; };
  const col=(name,ord,lim)=>({
    orderBy:(f,d)=>col(name,[f,d],lim), limit:n=>col(name,ord,n),
    onSnapshot(cb){ const f=()=>cb(snap(name,ord,lim)); subs.push(f); setTimeout(f,0); return ()=>subs.splice(subs.indexOf(f),1); },
    async add(v){ const d=load(); const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); (d[name]=d[name]||{})[id]=v; save(d); return {id}; },
    doc:id=>({ async update(v){ const d=load(); if(d[name]&&d[name][id]){ Object.assign(d[name][id],v); save(d); } },
               async delete(){ const d=load(); if(d[name]){ delete d[name][id]; save(d); } } })
  });
  return {collection:name=>col(name)};
}
(async()=>{
  try{
    let db = window.claude && await window.claude.use("db");
    if(!db){ try{ db=LocalDB(); store.local=true; }catch(e){ db=null; } }
    if(!db){ store.err="nodb"; render(); return; }
    store.db = db;
    db.collection("players").onSnapshot(snap=>{
      store.players = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"));
      store.ready=true; render();
    }, ()=>{ store.err="nodb"; render(); });
    db.collection("answers").orderBy("at","desc").limit(3000).onSnapshot(snap=>{
      store.answers = snap.docs.map(d=>d.data());
      if(S.tab==="coach" || S.step==="name" || S.step==="pos") render();
    }, ()=>{});
    db.collection("clears").onSnapshot(snap=>{ store.clears = snap.docs.map(d=>d.data()); if(S.tab==="coach" || S.step==="pos") render(); }, ()=>{});
  }catch(e){ store.err="nodb"; render(); }
})();

function saveAnswer(q, ok, choiceIdx){
  if(!S.player || S.player.guest) return;
  TEAM.send({type:"answer", name:S.player.name, grade:S.grade, mode:S.pos.startsWith("LV")?"Lv"+S.level:S.pos==="ALL"?"MIX":S.pos==="MIN"?"みんな":S.pos,
    qid:q.id, q:K(q.situ+" "+q.q,12), ok, choice:K(q.choices[choiceIdx].t,12), at:Date.now()});

}
function answersOf(pid){ return store.answers.filter(a=>a.pid===pid); }
// latest answer per question for one player
function latestBy(pid){ const m={}; for(const a of answersOf(pid)){ if(!(a.qid in m)) m[a.qid]=a; } return m; }

// ---------- Pitch ----------
function pitchSVG(q, reveal){
  const sc=q.scene, me=sc.me;
  const arrowsDef = `
    <marker id="ah-pass" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0L6,3L0,6z" style="fill:var(--chalk)"/></marker>
    <marker id="ah-run" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0L6,3L0,6z" style="fill:var(--accent)"/></marker>
    <marker id="ah-opp" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0L6,3L0,6z" style="fill:var(--opp)"/></marker>`;
  const L = (x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const field = `
    <rect x="-3" y="-3" width="56" height="74" rx="1.5" style="fill:var(--grass-2)"/>
    ${[0,1,2,3,4,5,6,7].map(i=>i%2?`<rect x="0" y="${i*8.5}" width="50" height="8.5" style="fill:var(--grass)"/>`:"").join("")}
    <g style="stroke:var(--chalk);fill:none" stroke-width=".3">
      <rect x="0" y="0" width="50" height="68"/>
      ${L(0,34,50,34)}<circle cx="25" cy="34" r="7"/>
      <rect x="10.5" y="0" width="29" height="12"/><rect x="10.5" y="56" width="29" height="12"/>
      <rect x="22.5" y="-1.4" width="5" height="1.4"/><rect x="22.5" y="68" width="5" height="1.4"/>
    </g>
    <circle cx="25" cy="34" r=".4" style="fill:var(--chalk)"/>
    <text x="1" y="-.8" text-anchor="start" font-size="1.5" style="fill:var(--chalk);opacity:.7" font-weight="700">あいてのゴール ▲</text>`;
  const arrows = (sc.arrows||[]).map(a=>{
    const col = a.k==="opp"?"var(--opp)":a.k==="run"?"var(--accent)":"var(--chalk)";
    return `<line x1="${a.f[0]}" y1="${a.f[1]}" x2="${a.t[0]}" y2="${a.t[1]}" stroke-width=".45" ${a.k==="pass"?'stroke-dasharray="1 .8"':'stroke-dasharray="1.6 .7"'} style="stroke:${col}" marker-end="url(#ah-${a.k})"/>`;
  }).join("");
  const opps = [...BASE_OPP_DEF, ...sc.opps].filter((p,i,arr)=>arr.findIndex(o=>o[0]===p[0]&&o[1]===p[1])===i)
    .map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.7" style="fill:var(--opp);stroke:var(--opp-ink)" stroke-width=".25"/>`).join("");
  const mate = (p,x,y)=>`<g><circle cx="${x}" cy="${y}" r="1.9" style="fill:var(--accent);stroke:var(--accent-ink)" stroke-width=".25"/><text x="${x}" y="${y+.55}" text-anchor="middle" font-size="1.45" font-weight="700" style="fill:var(--accent-ink);font-family:var(--num)">${p}</text></g>`;
  // movement: the tapped choice (preview) or the confirmed one. With the ball, the ball travels; without, the player runs.
  const hasBall = sc.ball[0]===me[1] && sc.ball[1]===me[2];
  const run = (sc.arrows||[]).find(a=>a.k==="run" && a.f[0]===me[1] && a.f[1]===me[2]);
  const b = sc.ball, bp=[b[0]+1.3,b[1]-1.3];
  const tgt = {me:[0,0], ball:[0,0], ride:false, mates:{}};
  const ci = reveal ? S.picked : S.preview;
  if(ci!==null && ci!==undefined){
    const {at, go} = q.choices[ci];
    if(at){ if(hasBall) tgt.ball=[at[0]-bp[0],at[1]-bp[1]]; else tgt.me=[at[0]-me[1],at[1]-me[2]]; }
    else if(go){ tgt.me=[go[0]-me[1],go[1]-me[2]]; tgt.ride=hasBall; }
    // team questions: several players move at once
    for(const [who,x,y] of (q.choices[ci].team||[])){
      if(who==="me") tgt.me=[x-me[1],y-me[2]];
      else { const i=sc.mates.findIndex(m=>m[0]===who); if(i>=0) tgt.mates[i]=[x-sc.mates[i][1],y-sc.mates[i][2]]; }
    }
  }
  S.tgt=tgt;
  const cur=S.cur||{me:[0,0],ball:[0,0],mates:{}};
  const mates = sc.mates.map((m,i)=>{ const v=(cur.mates||{})[i]||[0,0]; return `<g class="mover" id="mvT${i}" style="transform:translate(${v[0]}px,${v[1]}px);transition:none">${mate(m[0],m[1],m[2])}</g>`; }).join("");
  const st = v => `style="transform:translate(${v[0]}px,${v[1]}px);transition:none"`;
  const ballC = `<circle cx="${bp[0]}" cy="${bp[1]}" r=".95" style="fill:#fff;stroke:#111" stroke-width=".2"/>`;
  const meAll = `<g class="mover" id="mvMe" ${st(cur.me)}><circle class="me-ring" cx="${me[1]}" cy="${me[2]}" r="3" style="fill:none;stroke:var(--fg)" stroke-width=".35"/>${mate(me[0],me[1],me[2])}
     <rect x="${me[1]-2.6}" y="${me[2]-5.6}" width="5.2" height="2.4" rx="1.2" style="fill:var(--fg)"/>
     <text x="${me[1]}" y="${me[2]-3.85}" text-anchor="middle" font-size="1.55" font-weight="700" style="fill:var(--bg)">きみ</text>${tgt.ride?ballC:""}</g>`;
  // dribble: the ball rides inside the player's group
  const ball = tgt.ride ? "" : `<g class="mover" id="mvBall" ${st(cur.ball)}>${ballC}</g>`;
  // choice markers
  const marks = S.order.map((ci,k)=>{
    const c=q.choices[ci]; if(!c.at) return "";
    const L2="ABC"[k]; const right = ci===0;
    let fill="var(--pick)", ink="var(--pick-ink)", op=1;
    if(reveal){ if(right){fill="var(--good)";ink="var(--bg)";} else if(S.picked===ci){fill="var(--bad)";ink="var(--bg)";} else op=.35; }
    else if(S.preview!==null && S.preview!==ci) op=.45;
    const line = (c.at[0]===me[1]&&c.at[1]===me[2])?"":`<line x1="${me[1]}" y1="${me[2]}" x2="${c.at[0]}" y2="${c.at[1]}" stroke-width=".3" stroke-dasharray=".7 .6" style="stroke:${fill};opacity:${op}"/>`;
    return `${line}<g style="opacity:${op}"><circle cx="${c.at[0]}" cy="${c.at[1]}" r="1.75" style="fill:${fill};stroke:var(--bg)" stroke-width=".3"/><text x="${c.at[0]}" y="${c.at[1]+.6}" text-anchor="middle" font-size="1.7" font-weight="700" style="fill:${ink};font-family:var(--num)">${L2}</text></g>`;
  }).join("");
  return `<svg class="pitch" viewBox="-3 -3 56 74" role="img" aria-label="ピッチの図：オレンジが味方、青があいて、白い丸がボール">
    <defs>${arrowsDef}</defs>${field}${arrows}${opps}${mates}${marks}${meAll}${ball}</svg>`;
}

// ---------- Drill flow ----------
// random draw; up to 2 questions this player got wrong last time are mixed in
function draw(list,n){
  const last = S.player && !S.player.guest ? latestBy(S.player.id) : {};
  const missed = shuffle(list.filter(q=>last[q.id] && !last[q.id].ok)).slice(0,2);
  const rest = shuffle(list.filter(q=>!missed.includes(q)));
  return shuffle(missed.concat(rest).slice(0,n));
}
function startSet(pos){
  const g=S.grade;
  const graded = Q.filter(q=>inGrade(q,g));
  let set = draw(pos==="ALL" ? graded : graded.filter(q=>q.pos===pos), 5);
  // U-10: top up a short position set with みんなのやくそく
  if(set.length<5 && pos!=="MIN") set = set.concat(draw(graded.filter(q=>q.pos==="MIN"), 5-set.length));
  S.pos=pos; S.set=set; S.i=0; S.results=[]; S.step="quiz"; newQuestion();
}
const PER_ROUND = 6;
function startLevel(n){
  S.pos="LV"+n; S.level=n; S.set=draw(LEVELS[n-1].ids.map(id=>QBY[id]), PER_ROUND); S.i=0; S.results=[]; S.step="quiz"; newQuestion();
}
function levelOk(pid,n){ const last=latestBy(pid); return LEVELS[n-1].ids.filter(id=>last[id]?.ok).length; }
const levelCleared = (pid,n) => pid==="guest" ? S.guestClears.has(n) : store.clears.some(c=>c.pid===pid && c.level===n);
function bestLevel(pid){ let b=0; for(const L of LEVELS) if(levelCleared(pid,L.n)) b=L.n; return b; }
function recordClear(){
  const n=S.results.filter(r=>r.ok).length;
  if(!S.pos.startsWith("LV") || n < S.results.length-1) return;
  if(S.player.guest){ S.guestClears.add(S.level); return; }
  if(store.db) store.db.collection("clears").add({pid:S.player.id, name:S.player.name, level:S.level, score:n, of:S.results.length, at:Date.now()}).catch(()=>{});
  TEAM.send({type:"clear", name:S.player.name, grade:S.grade, level:S.level, score:n, of:S.results.length, at:Date.now()});
}
function newQuestion(){ S.picked=null; S.preview=null; S.cur={me:[0,0],ball:[0,0],mates:{}}; S.tgt=null; S.order=shuffle(S.set[S.i].choices.map((_,i)=>i)); render(); window.scrollTo({top:0,behavior:"smooth"}); }

    const tries = answersOf(p.id).length;
    return `<tr><td><button class="link" data-cp="${esc(p.id)}">${esc(p.name)}</button></td>
      <td><select class="gsel" data-gp="${esc(p.id)}" aria-label="${esc(p.name)}の学年"><option value="">—</option>${[9,10,11,12].map(g=>`<option value="${g}" ${g===p.grade?"selected":""}>${GLABEL(g)}</option>`).join("")}</select></td>
      ${posKeys.map(k=>`<td>${pctCell(all.filter(a=>a.pos===k))}</td>`).join("")}
      <td>${pctCell(all)}</td><td><b style="font-family:var(--num)">${bestLevel(p.id)?"Lv"+bestLevel(p.id):"—"}</b></td><td>${tries}</td></tr>`;
  }).join("");
  // most-missed questions (team, latest per player)
  const miss={}, seen={};
  for(const p of players){ for(const a of Object.values(latestBy(p.id))){ seen[a.qid]=(seen[a.qid]||0)+1; if(!a.ok) miss[a.qid]=(miss[a.qid]||0)+1; } }
  const missed = Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let detail="";
  if(S.coachPlayer){
    const p = players.find(x=>x.id===S.coachPlayer);
    if(p){
      const last=latestBy(p.id);
      const wrong = Q.filter(q=>last[q.id] && !last[q.id].ok);
      const untried = Q.filter(q=>!last[q.id]).length;
      detail = `<section class="card"><div class="row"><h2>${esc(p.name)} のまちがえた問題</h2><button class="del" id="delp" data-pid="${esc(p.id)}" style="margin-left:auto">選手を一覧からはずす</button></div>
        ${wrong.length?`<div class="missed">${wrong.map(q=>`<div><span class="tag">${q.pos==="MIN"?"みんな":q.pos}</span><span>${esc(K(q.situ+" "+q.q,12))}<br><small class="muted">えらんだ：${esc(K(q.choices[last[q.id].choice]?.t||"",12))}</small></span><span class="muted" style="font-size:.8rem">${q.phase}</span></div>`).join("")}</div>`:`<p class="muted" style="margin:0">いま、まちがえたままの問題はありません。</p>`}
        <p class="muted" style="margin:0;font-size:.85rem">まだといていない問題：${untried} / ${Q.length}</p>
        <div id="delconfirm"></div></section>`;
    }
  }
  return `<section class="card">
    <h2>ポジション別の理解度</h2>
    ${store.local?`<p class="note">この端末で答えた分の成績です。ほかのスマホやタブレットの成績は、ここには出ません。</p>`:""}
    <p class="muted" style="margin:0;font-size:.88rem">それぞれの問題の「さいごの答え」で計算しています。くり返して正かいすれば上がります。名前を押すと、まちがえた問題が見られます。学年はここで変えられます（その学年の問題が出ます）。</p>
    ${players.length?`<div class="tablewrap"><table><thead><tr><th>選手</th><th>学年</th>${posKeys.map(k=>`<th>${k==="MIN"?"みんな":k}</th>`).join("")}<th>ぜんたい</th><th>クリア</th><th>回答数</th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<p class="note">まだ選手がいません。「ドリル」タブで名前を追加すると、ここに成績が並びます。</p>`}
  </section>
  ${detail}
  <section class="card">
    <h2>チームでよくまちがえる問題</h2>
    ${missed.length?`<div class="missed">${missed.map(([id,n])=>{const q=QBY[id];return `<div><span class="tag">${q.pos==="MIN"?"みんな":q.pos}</span><span>${esc(K(q.situ+" "+q.q,12))}<br><small class="muted">${esc(K(q.point,12))}</small></span><span class="n">${n}/${seen[id]}人</span></div>`;}).join("")}</div>`
      :`<p class="muted" style="margin:0">まだデータがありません。</p>`}
  </section>`;
}

// ---------- Render + events ----------
function render(){
  // with a team link the coach reads results in the team spreadsheet, so the on-device coach tab is hidden
  document.getElementById("tab-coach").hidden = !!TEAM.team; if(TEAM.team && S.tab==="coach") S.tab="drill";
  document.getElementById("tab-drill").setAttribute("aria-selected", S.tab==="drill");
  document.getElementById("tab-coach").setAttribute("aria-selected", S.tab==="coach");
  if(S.tab==="coach"){ view.innerHTML=renderCoach(); return; }
  const active = document.activeElement && document.activeElement.id==="newname" ? document.getElementById("newname").value : null;
  view.innerHTML = S.step==="name"?renderName():S.step==="pos"?renderPos():S.step==="quiz"?renderQuiz():renderResult();
  if(S.step==="quiz" && S.tgt){
    const t=S.tgt; S.cur={me:t.me, ball:t.ride?[0,0]:t.ball, mates:t.mates};
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const m=document.getElementById("mvMe"), bl=document.getElementById("mvBall");
      if(m){ m.style.transition=""; m.style.transform=`translate(${t.me[0]}px,${t.me[1]}px)`; }
      if(bl){ bl.style.transition=""; bl.style.transform=`translate(${t.ball[0]}px,${t.ball[1]}px)`; }
      document.querySelectorAll('[id^="mvT"]').forEach(g=>{ const v=t.mates[g.id.slice(3)]||[0,0]; g.style.transition=""; g.style.transform=`translate(${v[0]}px,${v[1]}px)`; });
    }));
  }
  if(active!==null){ const el=document.getElementById("newname"); if(el){ el.value=active; el.focus(); } }
}
document.getElementById("tab-drill").onclick=()=>{S.tab="drill";render();};
document.getElementById("tab-coach").onclick=()=>{S.tab="coach";render();};
view.addEventListener("submit", e=>{
  if(e.target.id!=="addform") return; e.preventDefault();
  const el=document.getElementById("newname"); const name=el.value.trim(); if(!name||!store.db) return;
  if(store.players.some(p=>p.name===name)){ el.value=""; return; }
  const grade = +document.getElementById("newgrade").value || 10;
  store.db.collection("players").add({name, grade, at:Date.now()}).then(()=>{ el.value=""; }).catch(()=>{});
});
view.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="pickgrade"){ S.grade=+t.value; render(); return; }
  if(t.dataset.gp && store.db){
    const v=+t.value; store.db.collection("players").doc(t.dataset.gp).update({grade: v || null}).catch(()=>{});
  }
});
view.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.pid && t.classList.contains("chip")){
    S.player = t.dataset.pid==="__guest" ? {id:"guest",name:"ゲスト",guest:true} : store.players.find(p=>p.id===t.dataset.pid);
    if(S.player){ S.grade = S.player.grade || S.grade || 10; S.step="pos"; render(); } return;
  }
  if(t.id==="leaveteam"){ TEAM.leave(); render(); return; }
  if(t.id==="back-name"){ S.step="name"; render(); return; }
  if(t.dataset.pos){ startSet(t.dataset.pos); return; }
  if(t.dataset.ci!==undefined && S.picked===null){
    // 1st tap = show the move, same choice again = answer
    if(S.preview!==+t.dataset.ci){ S.preview=+t.dataset.ci; render(); return; }
    const q=S.set[S.i]; S.picked=+t.dataset.ci; const ok=S.picked===0;
    S.results.push({qid:q.id, ok}); saveAnswer(q, ok, S.picked); render(); return;
  }
  if(t.id==="next"){ if(S.i+1<S.set.length){ S.i++; newQuestion(); } else { recordClear(); S.step="result"; render(); window.scrollTo({top:0,behavior:"smooth"}); } return; }
  if(t.dataset.lv){ startLevel(+t.dataset.lv); return; }
  if(t.id==="again"){ S.pos.startsWith("LV") ? startLevel(S.level) : startSet(S.pos); return; }
  if(t.id==="other"){ S.step="pos"; render(); return; }
  if(t.id==="done"){ S.player=null; S.step="name"; render(); return; }
  if(t.dataset.cp){ S.coachPlayer=t.dataset.cp; render(); return; }
  if(t.id==="delp"){ document.getElementById("delconfirm").innerHTML=`<div class="row"><span>一覧からはずしますか？（成績のきろくは残ります）</span><button class="del" id="delyes" data-pid="${esc(t.dataset.pid)}">はずす</button><button class="del" id="delno">やめる</button></div>`; return; }
  if(t.id==="delno"){ document.getElementById("delconfirm").innerHTML=""; return; }
  if(t.id==="delyes" && store.db){ store.db.collection("players").doc(t.dataset.pid).delete().catch(()=>{}); S.coachPlayer=null; return; }
});
render();
</script>
