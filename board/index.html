<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作戦ボード">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="8人制サッカーの作戦ボード。フォーメーションの相性、ボールに合わせた自動スライド、練習メニュー。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head><body>
<title>8人制 作戦ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: night-match tactics board. Floodlit pitch on the left, broadcast-style coaching panel on the right; stacks on narrow screens */
:root{
  --bg:#0b1310; --surface:#121c18; --surface-2:#1a2620; --line:#26362e;
  --fg:#eef5f0; --muted:#8fa498;
  --accent:#ff6b2c; --accent-ink:#1b0a03;
  --opp:#4b8dff; --opp-ink:#06122a;
  --grass:#1f6a41; --grass-2:#1a5d39; --chalk:rgba(255,255,255,.88);
  --good:#3ddc8c; --warn:#ffc53d; --bad:#ff5f5f;
  --good-bg:rgba(61,220,140,.14); --warn-bg:rgba(255,197,61,.14); --bad-bg:rgba(255,95,95,.14);
  --glow:rgba(255,107,44,.35); --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --num:"Oswald","Dela Gothic One","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --good:#178a4e; --warn:#b97a00; --bad:#cc2f2f;
  --good-bg:#e1f4e9; --warn-bg:#fbf0d4; --bad-bg:#fde3e1;
  --glow:rgba(232,85,27,.25); --shadow:0 8px 24px rgba(16,26,21,.10);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --good:#178a4e; --warn:#b97a00; --bad:#cc2f2f;
  --good-bg:#e1f4e9; --warn-bg:#fbf0d4; --bad-bg:#fde3e1;
  --glow:rgba(232,85,27,.25); --shadow:0 8px 24px rgba(16,26,21,.10);
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:14px 28px}
.app{max-width:1280px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--display);font-weight:400;font-size:1.55rem;letter-spacing:.02em;margin:0}
header p{margin:0;color:var(--muted);font-size:.85rem}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:860px){.board{position:static}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
svg.pitch{width:100%;max-width:520px;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;aspect-ratio:56/74;height:auto}
.player{cursor:grab;transition:transform 1.2s cubic-bezier(.25,.6,.3,1)}
.player.dragging{transition:none;cursor:grabbing}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.player text{font-family:var(--body);font-weight:700;font-size:1.2px;pointer-events:none}
.panel{display:grid;gap:14px;min-width:0}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;flex:1 1 150px;min-width:0}
.field label,.label{font-size:.75rem;color:var(--muted);letter-spacing:.06em;font-weight:500}
select{font:inherit;font-weight:700;font-size:1.05rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;min-height:46px}
select#mine{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
select#opp{border-color:var(--opp);box-shadow:inset 4px 0 0 var(--opp)}
button{font:inherit;cursor:pointer;color:var(--fg)}
.iconbtn{min-height:46px;min-width:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:1.1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:10px 16px;min-height:44px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;min-height:44px;font-size:.88rem}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.88rem;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--opp)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:1.3rem}
.vs .m{color:var(--accent)} .vs .o{color:var(--opp)} .vs small{font-family:var(--body);font-size:.8rem;color:var(--muted)}
.meters{display:grid;gap:8px}
.meter{display:grid;grid-template-columns:5.6em 4.2em 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.meter .zone{font-weight:700;font-size:.92rem}
.meter .zone small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.3}
.num{font-family:var(--display);font-size:1.35rem;text-align:center;border-radius:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.good .num{background:var(--good-bg);color:var(--good)}
.warn .num{background:var(--warn-bg);color:var(--warn)}
.bad .num{background:var(--bad-bg);color:var(--bad)}
.meter .desc{font-size:.86rem;min-width:0}
.meter .desc b{display:block}
h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:8px}
h3 .chip{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.chip.atk{background:var(--accent);color:var(--accent-ink)}
.chip.def{background:var(--opp);color:var(--opp-ink)}
.chip.note{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
li{font-size:.92rem}
.kid{border-left:3px solid var(--warn);padding:8px 12px;background:var(--warn-bg);border-radius:0 8px 8px 0;font-size:.9rem}
.foot{font-size:.75rem;color:var(--muted)}
.tag{font-size:.95rem;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grade{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-right:4px}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.player .pname{font-size:1.3px;font-weight:700;fill:#fff;stroke:rgba(0,0,0,.65);stroke-width:.35px;paint-order:stroke}
.ball{cursor:grab}
.ball.dragging{cursor:grabbing}
.board-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.addrow .field{flex:1 1 140px}
.addrow .field.numf{flex:0 0 88px}
input[type=text],input[type=number]{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;min-height:46px}
.primary{border:0;border-radius:10px;padding:10px 18px;min-height:46px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);min-width:0}
.pl .no{font-family:var(--display);min-width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:.85rem}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl button{border:0;background:none;color:var(--muted);font-size:1.1rem;min-width:36px;min-height:36px;border-radius:8px}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.slot{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:center}
.slot b{font-size:.85rem;text-align:center;padding:4px 0;border-radius:8px;background:var(--surface-2)}
.slot select{font-size:.95rem;min-height:42px;padding:8px}
.status{font-size:.75rem;color:var(--muted)}
.pentools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pentools .seg button{padding:10px 12px;font-size:.88rem}
.swatches{display:flex;gap:6px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--c);box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--fg)}
svg.pitch.penmode{cursor:crosshair}
.saverow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.saverow .field{flex:1 1 180px}
.boards{display:grid;gap:8px}
.bd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.bd .info{flex:1 1 160px;min-width:0}
.bd .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .info small{color:var(--muted);font-size:.75rem}
.bd button{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:700}
.bd button.open{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bd button.danger{color:var(--bad)}
.autochk{font-weight:700}
.autochk input{accent-color:var(--accent)}
#autoHint{min-height:1.2em;font-weight:700;color:var(--fg)}
.chip.es{background:#c8352b;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.chip.en{background:#1f3b73;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.styletips{display:grid;gap:8px;font-size:.9rem}
.styletips .chip{margin:0 8px 0 0}
.principle{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.chip.both{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.drills{display:grid;gap:8px}
details.drill{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.drill summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.drill summary::-webkit-details-marker{display:none}
details.drill[open] summary{border-bottom:1px solid var(--line)}
.dhead{flex:1;min-width:0;display:grid;gap:4px}
.dmeta{font-size:.78rem;color:var(--muted)}
.dtags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ttag{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.why{font-size:.8rem;font-weight:700;color:var(--accent)}
button.add{border:0;border-radius:10px;padding:8px 12px;min-height:42px;font-weight:700;background:var(--fg);color:var(--bg);white-space:nowrap}
.dbody{padding:12px;display:grid;gap:12px}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.themes button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;font-weight:700}
.themes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ol.session{margin:0;padding-left:1.4em;display:grid;gap:6px}
ol.session li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
ol.session .sname{flex:1 1 160px;min-width:0;font-weight:700;font-size:.92rem}
ol.session input{width:4.2em;min-height:38px;padding:6px 8px}
ol.session button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
ol.session button:disabled{opacity:.35}
.total{margin:0;font-size:.95rem}
textarea{font:inherit;font-size:.95rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;resize:vertical}
.cform{display:grid;gap:10px}
.dplayer{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.dplayer text{font-family:var(--body);font-weight:700;font-size:1.2px;pointer-events:none}
.dball{transition:transform .7s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.dplayer,.dball{transition:none}}
.trail{stroke:#fff;stroke-width:.3;stroke-dasharray:.8 .6;opacity:.9;animation:fade 2.6s forwards}
@keyframes fade{to{opacity:0}}
.demobar{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--accent)}
.dtitle{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dcap{margin:0;font-size:1.05rem;font-weight:700;min-height:2.6em}
.dctl{display:flex;flex-wrap:wrap;gap:8px}
.dbtns{display:flex;flex-direction:column;gap:6px}
button.play{border:1px solid var(--accent);border-radius:10px;padding:8px 12px;min-height:42px;font-weight:700;background:transparent;color:var(--accent);white-space:nowrap}
.recbar{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:2px dashed var(--bad)}
.reclist{margin:0;padding-left:1.4em;font-size:.85rem;color:var(--muted);display:grid;gap:2px}
.notice{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:10px;align-items:center;max-width:720px;margin:0 auto;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);font-weight:700;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.notice span{flex:1;min-width:0}
.notice button{border:0;background:none;color:var(--bad);font-size:1.1rem;min-width:40px;min-height:40px}
/* full-screen board: pitch as large as the screen allows, tools beside it (landscape) or below (portrait) */
.fsbtn{margin-left:auto;min-height:40px;padding:6px 12px;font-weight:700}
body.fs{overflow:hidden}
body.fs .board{position:fixed;inset:0;z-index:30;border-radius:0;border:0;overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface)}
body.fs svg.pitch{max-width:100%;width:auto;height:min(calc(100dvh - 260px), calc((100vw - 32px) * 74 / 56))}
@media (min-aspect-ratio: 1/1){
  body.fs .board{display:grid;grid-template-columns:auto minmax(260px,360px);grid-auto-rows:min-content;column-gap:20px;align-content:start}
  body.fs .board > svg.pitch{grid-column:1;grid-row:1 / span 30;width:auto;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px)}
  body.fs .board > *:not(svg){grid-column:2}
}
.poslist{display:grid;gap:12px}
.poscard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px;scroll-margin-top:12px}
.poscard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.poshead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rolechip{font-family:var(--display);font-size:.85rem;min-width:2.6em;text-align:center;padding:3px 8px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.extra{font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.chip.warnchip{background:var(--bad-bg);color:var(--bad)}
.toast{font-size:.85rem;font-weight:700;color:var(--good)}

/* ---------- look & feel: broadcast / floodlit pitch ---------- */
body{background:
  radial-gradient(1200px 500px at 20% -10%, rgba(61,220,140,.08), transparent 60%),
  radial-gradient(900px 400px at 100% 0%, rgba(75,141,255,.07), transparent 60%), var(--bg)}
header.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(100deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);box-shadow:var(--shadow)}
.logo{width:42px;height:42px;flex:0 0 auto}
.brandtext{display:grid;gap:0;min-width:0}
h1{font-size:1.6rem;line-height:1.1;letter-spacing:.03em}
h1 .num8{font-family:var(--num);font-weight:700;color:var(--accent);font-size:1.15em;margin-right:2px}
header.brand p{font-size:.78rem;letter-spacing:.08em}
.scorebar{margin-left:auto;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-family:var(--num);min-width:0}
.scorebar .t{display:flex;align-items:center;gap:8px;padding:6px 12px;font-weight:700;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.scorebar .t small{font-family:var(--body);font-size:.68rem;font-weight:700;opacity:.85;letter-spacing:.06em}
.scorebar .m{background:var(--accent);color:var(--accent-ink)}
.scorebar .o{background:var(--opp);color:var(--opp-ink)}
.scorebar .vs{display:grid;place-items:center;padding:0 10px;background:var(--surface-2);color:var(--muted);font-size:.8rem;font-weight:700}
.scorebar .meta{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface-2);font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--fg);white-space:nowrap}
.scorebar .meta .live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
@media (max-width:620px){.scorebar{margin-left:0;width:100%}.scorebar .t{flex:1;justify-content:center}}
.board{background:linear-gradient(180deg,var(--surface),var(--surface-2));border-radius:18px;box-shadow:var(--shadow);padding:14px}
svg.pitch{filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));border-radius:10px}
.controls,.card{border-radius:16px;box-shadow:var(--shadow)}
.card{background:linear-gradient(180deg,var(--surface),var(--surface) 70%,var(--surface-2))}
select{background:var(--surface-2);border-radius:12px}
select#mine{box-shadow:inset 5px 0 0 var(--accent)} select#opp{box-shadow:inset 5px 0 0 var(--opp)}
.seg{border-radius:12px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{border-radius:9px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--glow)}
.primary{box-shadow:0 6px 18px var(--glow);letter-spacing:.03em}
.ghost{background:var(--surface-2)}

<div class="notice" id="notice" role="alert" hidden><span></span><button id="noticeClose" aria-label="閉じる">✕</button></div>
<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 42 42" aria-hidden="true"><rect x="1" y="1" width="40" height="40" rx="10" fill="var(--grass)"/><rect x="7" y="5" width="28" height="32" rx="1.5" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.4"/><line x1="7" y1="21" x2="35" y2="21" stroke="rgba(255,255,255,.85)" stroke-width="1.4"/><circle cx="21" cy="21" r="5" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.4"/><circle cx="15" cy="29" r="2.6" fill="var(--accent)"/><circle cx="27" cy="13" r="2.6" fill="var(--opp)"/></svg>

    <div class="scorebar" id="scorebar" aria-live="polite"></div>
  </header>

  <div class="main">
    <section class="board" aria-label="作戦ボード">
      <div class="legend">
        <span><span class="dot" style="background:var(--accent)"></span>自チーム（下から上へ攻める）</span>
        <span><span class="dot" style="background:var(--opp)"></span>相手</span>
        <span>帯の色＝そのエリアの人数の有利・不利</span>
        <button class="ghost fsbtn" id="fsBtn" aria-pressed="false">⛶ 全画面</button>
      </div>
      <svg class="pitch" id="pitch" viewBox="-3 -3 56 74" role="img" aria-label="ピッチ図"></svg>
      <div class="pentools" aria-label="ペン">
        <div class="seg" role="group" aria-label="モード">
          <button data-mode="move" aria-pressed="true">✋ 動かす</button>
          <button data-mode="pen" aria-pressed="false">✏️ 矢印を書く</button>
        </div>
        <div class="swatches" role="group" aria-label="ペンの色">
          <button class="sw" data-color="#ffffff" aria-label="白" aria-pressed="true" style="--c:#ffffff"></button>
          <button class="sw" data-color="#ffd23f" aria-label="黄" aria-pressed="false" style="--c:#ffd23f"></button>
          <button class="sw" data-color="#ff4d4d" aria-label="赤" aria-pressed="false" style="--c:#ff4d4d"></button>
          <button class="sw" data-color="#5ec8ff" aria-label="水色" aria-pressed="false" style="--c:#5ec8ff"></button>

        <div class="seg" role="group" aria-label="線の種類">

          <button data-dash="1" aria-pressed="false" title="選手の動き">┄ 点線</button>
        </div>
        <button class="ghost" id="undo">1つ戻す</button>
        <button class="ghost" id="clearDraw">全部消す</button>
      </div>
      <p class="hint" id="modeHint">選手とボールはドラッグで動かせます</p>
      <div class="board-tools">
        <button class="primary" id="quickSave">この配置を保存</button>

          <button data-poss="auto" aria-pressed="false">近い方</button>

      <p class="hint" id="autoHint" aria-live="polite"></p>

      </div>
      <div class="demobar" id="demoBar" hidden>

    </section>

        </div>
      </div>

        <button role="tab" data-tab="boards" aria-selected="false">保存した配置</button>
      </div>
      <div id="tabbody"></div>
    </section>
  </div>
</div>

 "2-4-1|3-3-1":["中盤の余り（トップ下）へボランチから斜めのパス","相手サイドCBが前に出てきたら、その背中をFWが狙う","失ったらCMが1枚下りて3バック化（相手のサイド攻撃に備える）"],
 "3-3-1|3-3-1":["ミラー。後ろの余り（+2）を先に前へ出した方が勝つ","CBがドリブルで中盤に入ると相手の中盤が釣り出され、フリーが生まれる","SHがFWの横まで上がると3-2-2のようになり、前線の不利が縮まる"],
 "2-3-2|3-3-1":["2トップは相手CBとサイドCBの間（ハーフスペース）に立つ。サイドCBが絞ればサイドが、絞らなければ中が空く","弱点は相手SH＋SBのコンビにDF2人の外を突かれること → ボールサイドのFWが戻る"],
 "3-3-1|2-3-2":["ビルドアップは3対2でCBが1人余る → その選手が運んで前進","サイドCBのオーバーラップで相手SHに2対1","相手2トップがハーフスペースに立つ → 誰が出るかを事前に決めておく"],
 "3-1-3|3-3-1":["中盤は1対3。中盤は飛ばして縦に速く、前線3対3の1対1を作る","WGが相手サイドCBと1対1になった瞬間が最大のチャンス","守備時はWGが下がって3-3-1"],
 "3-3-1|3-1-3":["後ろが3対3で余りなし（危険）。DFは1人カバーに残し、無理に前に出ない","SHを高い位置に置くと相手WGは下がるしかなくなり、3トップの迫力が消える","中盤の+2を使ってボールを持ち続ける"],
 "2-4-1|3-2-2":["後ろが2対2の同数（カウンター危険）。保持中から低い方のCMをDFの間に下げておく","中盤の+2でボールを持つ"],
 "3-2-2|2-4-1":["中盤で劣勢。奪ったらすぐ2トップへ、相手2バックと2対2","余ったサイドCBが1人中盤に出て3-3-2気味に"],
 "3-2-2|3-3-1":["中盤−1・前線−2。2トップがサイドに流れて相手サイドCBを外へ引き出す","攻撃はシンプルに縦へ。セカンドボールをCM2人で回収"]
};
const groupOf = id => id==="2-1-2-1" ? "2-4-1" : id==="3-1-2-1" ? "3-3-1" : id;

// ---------- State ----------
const S = {mine:"3-3-1", opp:"2-4-1", phase:"base", showOpp:true, showBall:true, ball:[25,34], tab:"match", pos:{mine:null, opp:null},
  selPos:null, auto:false, poss:"mine", trans:false, gk:false, grade:"U-11", possession:"mine", mode:"move", pen:{color:"#ffffff", dash:false}, draw:[]};
const oppPhase = p => p==="atk" ? "def" : p==="def" ? "atk" : "base";
function freshPositions(){
  S.pos.mine = F[S.mine][S.phase].map(p=>[...p]);
  S.pos.opp  = F[S.opp][oppPhase(S.phase)].map(([x,y])=>[50-x,68-y]);
  if(S.auto) computeAuto();
}

// ---------- Auto slide v2: role-based rules (11人制の原則を8人制の大きさに縮尺) ----------
// Team frame: X = width 0..50, D = distance from own goal line 0..68 (attacking toward D=68). Screen Y = 68 - D.
// Sources and derivations: youth-soccer/research-11v11-attack.md, research-11v11-defense.md
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// U-9/U-10: safety first, shorter distances, kick it long from deep. U-11/U-12: build up, use the full width.
const lowAge=()=>S.grade==="U-9"||S.grade==="U-10";
// width / distances by grade: U-9 narrow, U-10 in between, U-11/U-12 full width
const kickSafe=()=>S.grade==="U-9";                              // deep in own third / GK ball: U-9 kicks it long, U-10+ builds up
const byAge=(u9,u10,u11)=>S.grade==="U-9"?u9:S.grade==="U-10"?u10:u11;
function roleClass(fid,role){
  const f=F[fid];
  if(role==="GK") return "GK";
  if(role==="CB") return "CD";
  if(role==="LB"||role==="RB") return f.df===4?"FB":"SD";
  if(role==="LH"||role==="RH") return "WM";
  if(role==="LW"||role==="RW") return "WF";
  if(role==="DM"||role==="CH") return "PV";
  if(role==="OH") return "AM";
  if(role==="CM") return "CM";
  return "ST"; // CF, FW
}
function teamSetup(fid,bx){
  const roles=F[fid].roles, shape=F[fid].base, side=bx>=25?1:-1;
  const cls=roles.map(r=>roleClass(fid,r));
  const off=shape.map(p=>p[0]-25);                       // lateral slot from the formation
  const cms=cls.map((c,i)=>c==="CM"?i:-1).filter(i=>i>=0);
  if(cms.length===2){ const [a,b]=cms; const aHigh=off[a]*side>=off[b]*side; cls[aHigh?a:b]="IM"; cls[aHigh?b:a]="PV"; }
  const ballSide=i=>Math.abs(off[i])<5 || Math.sign(off[i])===side;
  return {roles,cls,off,side,ballSide};
}
const toScreen=P=>P.map(([X,D])=>[clamp(X,1.5,48.5),clamp(68-D,1,67)]);

// push team-mates apart until they are at least `gap` metres from each other (fixed players don't move)
function spread(T,fixed,gap){
  for(let it=0;it<6;it++) for(let a=0;a<T.length;a++) for(let b=a+1;b<T.length;b++){
    let dx=T[b][0]-T[a][0], dy=T[b][1]-T[a][1]; if(Math.hypot(dx,dy)<.01){ dx=(b%2?1:-1)*.01; dy=.005; }   // identical spots: split sideways
    const dist=Math.hypot(dx,dy);
    if(dist<gap){ const push=(gap-dist)/2, nx=dx/dist, ny=dy/dist;
      const fa=fixed.includes(a), fb=fixed.includes(b), ka=fa?0:fb?2:1, kb=fb?0:fa?2:1;
      T[a][0]-=nx*push*ka;T[a][1]-=ny*push*ka; T[b][0]+=nx*push*kb;T[b][1]+=ny*push*kb; }
  }
}
// ----- Out of possession -----
function defendTeam(fid,bx,by,trans,gk){
  if(trans && 68-by<25) trans=false;                              // lost it near our own goal: defend normally, no swarm
  const {roles,cls,off,side,ballSide}=teamSetup(fid,bx);
  const d=68-by, wide=Math.abs(bx-25)>12;
  // England: press high when the ball is in the opponents' third. Spain: compact zonal block elsewhere.
  // Just lost the ball (trans): don't drop, the nearest three swarm the ball (即時奪回).
  const high=(lowAge()?d>50:d>45)||trans;                        // younger: press high only deep in their half
  const lineX=high?clamp(d-14,8,32):clamp(d-12,8,28);
  // pressing high: the back line stops around halfway (offside), but midfield and forwards keep pushing
  // so the whole block stays within ~14m of the ball and the short passes are covered
  const midX=high?Math.max(lineX+9,d-14):lineX+10, fwX=high?Math.max(lineX+18,d-5):lineX+20;
  const cy=25+0.5*(bx-25);                                      // block centre follows the ball
  const T=[];
  roles.forEach((r,i)=>{
    const c=cls[i];
    if(c==="GK"){
      let D=d<23?3:d<45?7:11; D=clamp(D,Math.max(1,lineX-13),Math.max(1.5,lineX-3));
      if(d<16) D=Math.min(D,2);
      let X=25+(bx-25)*clamp(D/Math.max(d,1),0,.5);
      if(d<14&&wide){ D=1.5; X=25+side*1.5; }                   // near post, not glued to it
      T[i]=[X,D]; return;
    }
    const isDF=c==="CD"||c==="SD"||c==="FB";
    let D = isDF ? lineX-(!ballSide(i)&&Math.abs(off[i])>5?2:0)    // far-side defender a step deeper
          : c==="ST" ? fwX : c==="AM" ? midX+3 : midX;              // wingers drop to the midfield line (守備時3-3-1)
    const wcap=byAge(22,24,26); let X = clamp(cy+off[i]*byAge(.85,.93,1), bx-wcap, bx+wcap);                    // team width <= ~28m around the ball
    if(Math.abs(bx-25)>8) X = side>0 ? Math.min(X,bx+1) : Math.max(X,bx-1);  // nobody outside the ball
    T[i]=[X,D];
  });
  const crossD = d<16 && wide;                                    // defending a cross / cut-back
  if(crossD){
    // defenders stay in the box: ball-side back tucks in to the near post, CB centre, far-side back far post
    const dfs=roles.map((_,i)=>i).filter(i=>["CD","SD","FB"].includes(cls[i])).sort((a,b)=>(T[b][0]-T[a][0])*side);
    const spots=[25+side*4,25,25-side*4.5,25-side*8];            // near post -> far post
    dfs.forEach((i,k)=>{ T[i]=[spots[Math.min(k,spots.length-1)],4+k*1.2]; });
    roles.forEach((_,i)=>{
      if(cls[i]==="PV") T[i]=[25+side*1.5,13.5];                   // steps up to the edge of the box: wins the clearance, blocks the shot
      if((cls[i]==="WM"||cls[i]==="WF")&&!ballSide(i)) T[i]=[25-side*7,13];   // far side: edge of the box for the second ball
    });
  }
  // first defender: goal side of the ball, showing it outside
  let first=-1,bd=1e9;
  roles.forEach((r,i)=>{ if(r==="GK")return;
    // near our box the wide midfielder goes out to the crosser so the defenders can stay in the box
    const keepIn = crossD && (["CD","SD","FB","PV"].includes(cls[i]));
    const dd=Math.hypot(T[i][0]-bx,T[i][1]-d)+(keepIn?10:0); if(dd<bd){bd=dd;first=i;} });
  const ux=25-bx, uy=0-d, ul=Math.hypot(ux,uy)||1;
  T[first]=[bx+ux/ul*1.5-(wide?side*.5:0), d+uy/ul*1.5];
  // second defender: covers 3-5m behind at an angle, inside
  let second=-1; bd=1e9;
  roles.forEach((r,i)=>{ if(r==="GK"||i===first)return; const dd=Math.hypot(T[i][0]-bx,T[i][1]-d); if(dd<bd){bd=dd;second=i;} });
  if(second>=0 && !crossD){
    const cd=d<23?4:d>45?6:5, inward=Math.sign(25-bx)||0;
    if(d<12){ const lat=T[second][0]>=T[first][0]?1:-1; T[second]=[T[first][0]+lat*4.5, Math.max(1.5,T[first][1]-1)]; }   // no room behind near our goal: cover from the side
    else T[second]=[T[first][0]+ux/ul*cd*.8+inward*cd*.6, T[first][1]+uy/ul*cd*.8];
  }
  // ball-side lane stays connected: full-back no more than 11m behind the wide midfielder (also when the WM presses)
  if(!crossD){
    const bsDF=roles.map((_,i)=>i).filter(i=>(cls[i]==="SD"||cls[i]==="FB")&&ballSide(i)&&Math.abs(off[i])>5&&i!==first&&i!==second);
    const bsWM=roles.map((_,i)=>i).filter(i=>(cls[i]==="WM"||cls[i]==="WF")&&ballSide(i));
    bsDF.forEach(a=>bsWM.forEach(b=>{ if(T[b][1]-T[a][1]>11) T[a][1]=T[b][1]-11; }));
  }
  // counter-press: a third player closes the ball from the other side
  if(trans){
    let third=-1; bd=1e9;
    roles.forEach((r,i)=>{ if(r==="GK"||i===first||i===second||["CD","SD","FB"].includes(cls[i])||off[i]*side<-6)return; const dd=Math.hypot(T[i][0]-bx,T[i][1]-d); if(dd<bd){bd=dd;third=i;} });
    if(third>=0){ const lat=Math.abs(bx-25)>8?-side:(T[third][0]>=bx?1:-1); T[third]=[bx+lat*3.5, d+1.5]; }
    spread(T,[0,first],4);
    return {P:toScreen(T),near:first};
  }
  if(gk){
    // GK in possession: wide players take an in-between spot (between the full-back at the box corner and the winger),
    // so a long ball from the GK to the winger can be intercepted; the two/three backs widen to cover the flanks
    roles.forEach((r,i)=>{
      const c=cls[i];
      if(c==="WM"||c==="WF") T[i]=[off[i]<0?9:41, d-21];
      if(c==="CD"||c==="SD"||c==="FB") T[i][0]=25+(T[i][0]-25)*1.35;
    });
    const out=()=>T.forEach((p,i)=>{ if(i>0) p[1]=Math.min(p[1],68-13); }); for(let k=0;k<3;k++){ out(); spread(T,[0],6); } out(); }   // stay outside the box (goal kick / GK in hands)
  else spread(T,[0,first],crossD?4:6);
  return {P:toScreen(T),near:first};
}

// ----- In possession -----
// offL: distance (from this team's own goal) of the opponents' second-last defender = offside line
function attackTeam(fid,bx,by,offL,trans,gk){
  if(trans && 68-by<14) trans=false;                              // won it deep in our box: secure it first
  const {roles,cls,off,side,ballSide}=teamSetup(fid,bx);
  const d=68-by, Tt=side>0?50:0, zone=d<22.7?0:d<=45.3?1:2, wide=Math.abs(bx-25)>12;
  const lim=Math.max(offL-1,d);
  const hasWideWM=roles.some((r,i)=>(cls[i]==="WM"||cls[i]==="WF")&&ballSide(i)&&Math.abs(off[i])>10);
  const nCD=cls.filter(c=>c==="CD").length;
  const nST=cls.filter(c=>c==="ST").length;
  const hasIM=cls.includes("IM")||cls.includes("AM");
  const T=[];
  roles.forEach((r,i)=>{
    const c=cls[i], bs=ballSide(i); let X,D;
    switch(c){
      case "GK": if(zone===0){D=nCD===2?clamp(d-12,2,10):clamp(d-14,2,4);X=25+(bx-25)*.3;} else {D=clamp(d-30,4,22);X=25+(bx-25)*.2;} break;
      case "CD":
        if(nCD===1){X=25+(bx-25)*.25;D=clamp(d-16,9,36);}
        else if(nCD===2){X=25+Math.sign(off[i])*(zone===0?10:8)+(bx-25)*.2;D=zone===0?clamp(d-4,4,14):clamp(d-18,10,36);}
        else {X=25+Math.sign(off[i])*7+(bx-25)*.2;D=clamp(d-18,8,34);}
        break;
      case "SD": case "FB":
        if(zone===0){X=off[i]<0?8:42;D=clamp(d-2,6,40);}
        else if(bs&&!hasWideWM&&!wide){X=Tt-side*5;D=d-3;}                              // no wide midfielders (3-2-2): the back gives the width
        else if(bs&&zone===1){ if(wide){X=bx-side*3;D=d-8;} else {X=Tt-side*6;D=d-6;} }   // middle third: behind the ball (wide ball) / keep width (central ball)
        else if(bs){                                                                     // final third
          const wingWide=Math.abs(bx-25)>=15;                                            // ball near the touchline = winger is wide
          if(!wide){X=side>0?37:13;D=d-6;}                                               //   central ball: support from the half-space, behind it
          else if(d>52){X=side>0?36:14;D=d-5;}                                           //   ball at the byline: cut-back support, never past the ball
          else if(hasWideWM&&wingWide){X=side>0?37:13;D=d-3;}                            //   winger wide   -> full-back goes inside (underlap) 中村憲剛氏の5レーンの原則
          else {X=Tt-side*4;D=Math.min(d+5,58);} }                                       //   winger inside -> full-back goes outside (overlap)
        else {X=25-side*12;D=null;}                                                     // far side: tuck in, rest defence
        break;
      case "PV":
        if(zone===0){D=d+8;X=25+(bx-25)*.4;}
        else if(zone===1&&wide&&!hasIM){X=side>0?36:14;D=d-2;}                         // middle third: CH comes beside the ball in the half-space
        else if(zone===2&&wide){D=Math.min(55,lim);X=25+side;}                         // edge of the box
        else {D=d-11;X=25+(bx-25)*.4;}
        break;
      case "IM": case "AM":
        if(zone===2&&wide){D=59;X=25+side*3;}                                          // cut-back zone
        else if(zone===2){X=side>0?14:36;D=lim-3;}                                     // far half-space between the lines
        else {X=side>0?36:14;D=d+8;}                                                    // ball-side half-space, ahead of the ball
        break;
      case "WM": case "WF":
        if(bs&&Math.abs(off[i])>=5){X=Tt-side*byAge(6,5,4);D=clamp(d+byAge(6,7,7),15,lim);}                   // ball side: width, ~7m ahead of the ball
        else if(zone===2&&d>48){D=63;X=25-side*4;}                                      // far side: attack the far post
        else {X=side>0?byAge(10,6,4):50-byAge(10,6,4);D=d+2;}                          // U-11/12: full width for a switch, U-9/10: within a kid's pass                                                     // far side: width for a switch, but within a kid's pass (7m inside)
        break;
      case "ST": {
        const primary = nST===1 || bs;
        if(zone===2&&wide){ D=primary?63:60; X=primary?25+side*3:25-side*2; }          // near post / penalty spot
        else { D=lim; X=25+(bx-25)*.3+(nST===2?(primary?side*4:-side*5):0); }
        break; }
    }
    T[i]=[X,D];
  });
  // just won the ball: counter-attack. Forwards and wide players sprint forward, one runs in behind
  if(trans){
    roles.forEach((r,i)=>{
      const c=cls[i];
      if(c==="ST"){ T[i]=[25+(bx-25)*.2+(nST===2?(ballSide(i)?side*5:-side*6):0), lim]; }
      else if(c==="WM"||c==="WF"){ T[i]=[off[i]<0?7:43, Math.min(lim,Math.max(T[i][1],d+14))]; }
      else if(c==="IM"||c==="AM"){ T[i]=[25+side*4, Math.min(lim-2,d+10)]; }
      else if(c==="PV"){ T[i]=[25+(bx-25)*.4, d-5]; }
    });
  }
  // ball deep in our own third (near our goal line): safety first. CH steps up to the edge for the second ball,
  // ball-side SH comes forward as the outlet, backs stay inside the box, far side does not drift to the corner
  if(zone===0 && d<14 && !trans){
    roles.forEach((r,i)=>{
      const c=cls[i], bs=ballSide(i);
      if(c==="GK") T[i]=[25+side*1.5,2];
      else if(c==="CD") T[i]=[25+side*3+(nCD>1?Math.sign(off[i])*4:0),6];
      else if(c==="SD"||c==="FB") T[i]= bs?[25+side*9,7]:[25-side*7,7];
      else if(c==="PV") T[i]=[25+side*5,15];
      else if(c==="IM"||c==="AM") T[i]=[25-side*3,17];
      else if(c==="WM"||c==="WF") T[i]= bs?[Tt-side*4,Math.max(15,d+9)]:[25-side*15,20];
      else if(c==="ST") T[i]=[25+side*3+(nST===2?(bs?side*3:-side*6):0),Math.max(30,d+20)];
    });
  }
  // GK has the ball (goal kick / catch): backs split to the corners of the box, the holding mid drops to receive,
  // wide players high and wide, forwards on the last line (スペイン流のビルドアップ。苦しければCFへ長いボール＝イングランド流)
  if(gk){
    const lineSt=Math.max(34,offL-1);
    roles.forEach((r,i)=>{
      const c=cls[i], sg=Math.sign(off[i])||1;
      if(c==="GK") T[i]=[25,3];
      else if(c==="CD") T[i]= nCD===1?[25,14]: nCD===2?[25+sg*byAge(10,12,13),7]: [25+sg*8,7];
      else if(c==="SD") T[i]=[25+sg*byAge(12,14,15),9];
      else if(c==="FB") T[i]=[25+sg*20,16];
      else if(c==="PV") T[i]=[25,nCD===1?21:15];
      else if(c==="IM"||c==="AM") T[i]=[25+sg*9,26];
      else if(c==="WM"||c==="WF") T[i]=[sg<0?byAge(8,6,4):50-byAge(8,6,4),28];
      else if(c==="ST") T[i]=[25+(nST===2?sg*6:0),lineSt];
    });
    T.forEach(p=>{ p[1]=Math.min(p[1],Math.max(offL-.4,34)); });
    spread(T,[0],6);
    return {P:toScreen(T),near:0};
  }
  if(zone===1&&wide&&!hasIM&&!trans){
    roles.forEach((r,i)=>{
      if(cls[i]==="CD"&&nCD===1&&T[i][1]!=null) T[i][1]+=4;                             // centre back steps up to cover the middle
      if((cls[i]==="WM"||cls[i]==="WF")&&!ballSide(i)) T[i][0]+=side*3;                  // far-side midfielder tucks in
    });
  }
  // far-side back players hold the same height as the centre backs (rest defence)
  const cdD=T.filter((p,i)=>cls[i]==="CD").map(p=>p[1]); const restD=cdD.length?Math.min(...cdD):d-16;
  T.forEach((p,i)=>{ if(p[1]===null) p[1]=restD+4; });             // far-side back: a little ahead of the CB, still insurance
  // ball carrier: the player whose spot is closest to the ball
  let near=-1,bd=1e9;
  roles.forEach((r,i)=>{ if(r==="GK")return; const isDF=["CD","SD","FB"].includes(cls[i]);
    const deep=zone===0&&d<14;                                     // deep in our third the ball-side back has it, SH goes forward
    const dd=Math.hypot(T[i][0]-bx,T[i][1]-d)+(isDF&&zone>0?4:0)+(deep&&!isDF?8:0); if(dd<bd){bd=dd;near=i;} });
  T[near]=[bx,d-1.8];
  // at least two options within 10m of the ball
  const within=()=>T.filter((p,i)=>i!==near&&i!==0&&Math.hypot(p[0]-bx,p[1]-d)<byAge(10,11,12)).length;
  let guard=0;
  while(within()<(trans?1:2) && guard++<3){
    let best=-1,bd2=1e9;
    T.forEach((p,i)=>{ if(i===near||i===0||(cls[i]==="CD"&&zone>0))return; const dd=Math.hypot(p[0]-bx,p[1]-d); if(dd>=byAge(10,11,12)&&dd<bd2){bd2=dd;best=i;} });
    if(best<0) break;
    const p=T[best], k=byAge(8,9,10)/bd2; T[best]=[bx+(p[0]-bx)*k, d+(p[1]-d)*k];
  }
  // stay onside (unless behind the ball or in own half)
  const maxD=Math.max(offL-.4,d,34);
  T.forEach((p,i)=>{ if(i!==near&&i!==0) p[1]=Math.min(p[1],maxD); });
  spread(T,[0,near],byAge(6,6.5,7));
  return {P:toScreen(T),near};
}
// near our box (cross / cut-back): every attacker in or around the box gets a defender on his goal side
function markBox(fid,D,A,bx,by,presser){
  const d=68-by; if(!(d<16 && Math.abs(bx-25)>12)) return D;
  const cls=teamSetup(fid,bx).cls;
  const threats=A.map((p,i)=>({i,p,dist:Math.hypot(p[0]-25,68-p[1])}))
    .filter(t=>t.i!==0 && (68-t.p[1])<18 && Math.hypot(t.p[0]-bx,t.p[1]-by)>2.5)
    .sort((a,b)=>a.dist-b.dist);                                   // most dangerous (closest to goal) first
  const free=D.map((_,i)=>i).filter(i=>i!==0 && i!==presser && cls[i]!=="ST");   // CF stays up for the counter
  threats.forEach(t=>{
    if(!free.length) return;
    let best=-1,bd=1e9; free.forEach(i=>{ const dd=Math.hypot(D[i][0]-t.p[0],D[i][1]-t.p[1]); if(dd<bd){bd=dd;best=i;} });
    free.splice(free.indexOf(best),1);
    const vx=25-t.p[0], vy=68-t.p[1], l=Math.hypot(vx,vy)||1;
    D[best]=[t.p[0]+vx/l*1.6, t.p[1]+vy/l*1.6];
  });
  return D;
}
function markOwnBox(fid,P,Opp,bx,by,holder){
  const d=68-by; if(d>=14) return P;
  const cls=teamSetup(fid,bx).cls;
  let presser=-1,bd=1e9; Opp.forEach((p,i)=>{ if(i===0)return; const dd=Math.hypot(p[0]-bx,p[1]-by); if(dd<bd){bd=dd;presser=i;} });
  const threats=Opp.map((p,i)=>({i,p,dist:Math.hypot(p[0]-25,68-p[1])})).filter(t=>t.i!==0&&t.i!==presser&&(68-t.p[1])<13).sort((a,b)=>a.dist-b.dist);   // only players in/at our box
  const free=P.map((_,i)=>i).filter(i=>i!==holder&&["CD","SD","FB"].includes(cls[i]));
  threats.forEach(t=>{ if(!free.length) return;
    let best=-1,b2=1e9; free.forEach(i=>{ const dd=Math.hypot(P[i][0]-t.p[0],P[i][1]-t.p[1]); if(dd<b2){b2=dd;best=i;} });
    free.splice(free.indexOf(best),1);
    const vx=25-t.p[0], vy=68-t.p[1], l=Math.hypot(vx,vy)||1; P[best]=[t.p[0]+vx/l*1.6, t.p[1]+vy/l*1.6]; });
  return P;
}
function computeAuto(){
  const bx=clamp(S.ball[0],.5,49.5), by=clamp(S.ball[1],.5,67.5), mir=([x,y])=>[50-x,68-y];   // a ball dragged off the pitch counts as on the line
  let mineAtt;
  if(S.poss==="mine") mineAtt=true;
  else if(S.poss==="opp") mineAtt=false;
  else { // whoever is closer to the ball has it
    const dm=Math.min(...S.pos.mine.slice(1).map(p=>Math.hypot(p[0]-bx,p[1]-by)));
    const dop=Math.min(...S.pos.opp.slice(1).map(p=>Math.hypot(p[0]-bx,p[1]-by)));
    mineAtt = dm<=dop;
  }
  // offside line for the attackers = second-last defender (GK counts), measured from the attackers' own goal
  const offLine=P=>{ const ys=P.map(p=>p[1]).sort((a,b)=>b-a); return ys[1]; };
  const gk=!!S.gk;
  if(mineAtt && gk){
    const o=defendTeam(S.opp,50-bx,68-by,false,true);
    const m=attackTeam(S.mine,bx,by,offLine(o.P),false,true);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir); S.possession="mine"; return;
  }
  if(!mineAtt && gk){
    const m=defendTeam(S.mine,bx,by,false,true);
    const o=attackTeam(S.opp,50-bx,68-by,offLine(m.P),false,true);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir); S.possession="opp"; return;
  }
  if(mineAtt){
    const o=defendTeam(S.opp,50-bx,68-by,S.trans);
    const m=attackTeam(S.mine,bx,by,offLine(o.P),S.trans);
    o.P=markBox(S.opp,o.P,m.P.map(mir),50-bx,68-by,o.near);
    m.P=markOwnBox(S.mine,m.P,o.P.map(mir),bx,by,m.near);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir);
  } else {
    const m=defendTeam(S.mine,bx,by,S.trans);
    const o=attackTeam(S.opp,50-bx,68-by,offLine(m.P),S.trans);
    m.P=markBox(S.mine,m.P,o.P.map(mir),bx,by,m.near);
    o.P=markOwnBox(S.opp,o.P,m.P.map(mir),50-bx,68-by,o.near);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir);
  }
  S.possession=mineAtt?"mine":"opp";
}

// ---------- Matchup math ----------
function matchup(a,b){
  const A=F[a], B=F[b];
  return {back:A.df-B.fw, mid:A.mf-B.mf, front:A.fw-B.df};
}
function rateBack(n){ return n<=0?["bad","危険：余りなし","MFを1人下げて後ろを+1に"] : n===1?["good","理想（+1）","1人はカバーに残す"] : ["warn","余りすぎ","1人を中盤に出せる"]; }
function rateMid(n){ return n>0?["good","有利","中盤でボールを持てる"] : n===0?["warn","互角","1対1で負けない・サポート次第"] : ["bad","不利","相手のフリーマンに注意"]; }
function rateFront(n){ return n>=0?["good","同数以上","相手DFにカバーがいない"] : n===-1?["warn","標準（−1）","FWはCBの間に立つ"] : ["bad","孤立","2列目の押し上げが必要"]; }
const sgn = n => n>0?"+"+n:n===0?"±0":String(n);

function advice(a,b){
  const m=matchup(a,b), A=F[a], B=F[b], atk=[], def=[];
  if(m.back>=2){ atk.push("後ろで"+m.back+"人余る → 余ったCBがドリブルで1列運ぶ。相手が寄ってきたらパス（ここに+1が生まれる）"); def.push("余ったDFを1人中盤に出し、相手の中盤のあまりを捕まえる"); }
  if(m.back===1) def.push("後ろは理想の+1。1人は必ずカバーに残す");
  if(m.back<=0) def.push("後ろが同数以下で危険 → 守備時はMFを1人下げて+1にする（例：3-3-1に変形）");
  if(m.mid>0) atk.push("中盤で"+m.mid+"人多い → 「あまりの人」にボールを集めて保持する");
  if(m.mid<0){ atk.push("中盤は不利 → 中盤を飛ばして縦に速く、またはサイドから"); def.push("相手の中盤のあまりは誰か？ 名前でマーク担当を決める（WG/FWが下がる、またはSBを押し上げる）"); }
  if(m.mid===0) def.push("中盤は同数でマンツーマンになりやすい → 1対1で負けない、抜かれたら隣がカバー");
  if(m.front>=0) atk.push("前線は相手DFと同数以上 → 縦に速いボールで1対1を仕掛ける");
  if(m.front===-1) atk.push("前線は標準の−1 → FWは相手CBの間に立ち、2人を同時に止める");
  if(m.front<=-2) atk.push("FWが孤立しやすい（"+sgn(m.front)+"）→ SHや2列目がFWを追い越す、SHがFWの横まで上がる");
  if(B.df===2) atk.push("相手は2バックで幅を守れない → SHを大外高く＋SBのオーバーラップでサイド2対1。2バックの背中が一番の狙い目");
  if(B.df>=4) atk.push("相手は4バックで引いて守る → ミドルシュート、サイドで数的優位を作る");
  if(B.fw===2) def.push("相手2トップはCBとサイドCBの間（ハーフスペース）に立ちやすい → 誰が出るかを試合前に決める");
  if(B.fw>=3) def.push("相手は3トップ → SBは同時に上がらない。WGへの縦パスを中盤が限定");
  if(A.df===2) def.push("自分は2バック → ボールを失った瞬間にプレス。DF2人の前を必ず誰かが埋める");
  if(A.fw===2) def.push("2トップは左右に分かれてパスコースを限定（同じ側に寄らない）");
  return {m,atk,def,notes:NOTES[groupOf(a)+"|"+groupOf(b)]||null};
}

  if(role==="LB"||role==="RB") return f.df===4?"SB4":"SB3";
  if(role==="LH"||role==="RH") return "SH";

  if(role==="FW") return "FW2";
  return role; // CH, CM, DM, OH, CF

// ---------- Pen (freehand arrows) ----------
function pathD(p){
  if(p.length<3) return "M"+p.map(q=>q[0].toFixed(2)+","+q[1].toFixed(2)).join(" L");
  let d=`M${p[0][0].toFixed(2)},${p[0][1].toFixed(2)}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=` Q${p[i][0].toFixed(2)},${p[i][1].toFixed(2)} ${mx.toFixed(2)},${my.toFixed(2)}`;}
  const l=p[p.length-1]; return d+` L${l[0].toFixed(2)},${l[1].toFixed(2)}`;
}
function arrowHead(p){
  const e=p[p.length-1]; let k=p.length-2;
  while(k>0 && Math.hypot(e[0]-p[k][0],e[1]-p[k][1])<1.8) k--;
  const a=Math.atan2(e[1]-p[k][1],e[0]-p[k][0]), s=1.5, w=.5;
  const pt=t=>[e[0]+Math.cos(a+t)*s*(t?1:0),e[1]+Math.sin(a+t)*s*(t?1:0)];
  const L=[e[0]-Math.cos(a-w)*s,e[1]-Math.sin(a-w)*s], R=[e[0]-Math.cos(a+w)*s,e[1]-Math.sin(a+w)*s];
  const tip=[e[0]+Math.cos(a)*.35,e[1]+Math.sin(a)*.35];
  return `M${tip[0].toFixed(2)},${tip[1].toFixed(2)} L${L[0].toFixed(2)},${L[1].toFixed(2)} L${R[0].toFixed(2)},${R[1].toFixed(2)} Z`;
}
function strokeEl(st,parent,withHead){
  const g=el("g",{},parent);
  el("path",{d:pathD(st.pts),fill:"none",stroke:"rgba(0,0,0,.35)","stroke-width":.85,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":st.dash?"1.1 1.1":"none"},g);
  const main=el("path",{d:pathD(st.pts),fill:"none",stroke:st.color,"stroke-width":.5,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":st.dash?"1.1 1.1":"none"},g);
  if(withHead) el("path",{d:arrowHead(st.pts),fill:st.color,stroke:"rgba(0,0,0,.35)","stroke-width":.15},g);
  return g;
}
function drawStrokes(){
  const layer=document.getElementById("drawLayer"); layer.innerHTML="";
  S.draw.forEach(st=>strokeEl(st,layer,true));
}
let cur=null, curEl=null;
function penDown(e){
  if(S.mode!=="pen") return;
  e.preventDefault(); try{svg.setPointerCapture(e.pointerId);}catch(_){}
  const p=svgPoint(e); cur={pts:[[p.x,p.y]],color:S.pen.color,dash:S.pen.dash};
}
function penMove(e){
  if(!cur) return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const p=svgPoint(ev), l=cur.pts[cur.pts.length-1];
    if(Math.hypot(p.x-l[0],p.y-l[1])>.35) cur.pts.push([p.x,p.y]);
  }
  if(curEl) curEl.remove();
  curEl=strokeEl(cur,document.getElementById("drawLayer"),cur.pts.length>3);
}
function penUp(){
  if(!cur) return;
  let len=0; for(let i=1;i<cur.pts.length;i++) len+=Math.hypot(cur.pts[i][0]-cur.pts[i-1][0],cur.pts[i][1]-cur.pts[i-1][1]);
  if(len>1.5) S.draw.push({...cur,pts:cur.pts.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2)])});
  cur=null; if(curEl){curEl.remove();curEl=null;} drawStrokes();
}
svg.addEventListener("pointerdown",penDown);
svg.addEventListener("pointermove",penMove);
svg.addEventListener("pointerup",penUp);
svg.addEventListener("pointercancel",penUp);

// drill suggestions from the current matchup
function recommendDrills(){
  const m=matchup(S.mine,S.opp), B=F[S.opp], out=[];
  const add=(id,why)=>{ if(!out.some(o=>o.id===id)) out.push({id,why}); };
  if(m.back<=0) add("cover22","後ろが同数（"+sgn(m.back)+"）→ カバーの約束が大事");
  if(m.mid<0){ add("rondo52","中盤で数的不利（"+sgn(m.mid)+"）→ 狭い所でも取られない"); add("counter","中盤を飛ばして縦に速く"); }
  if(m.mid>0) add("pos3lane","中盤で数的有利（"+sgn(m.mid)+"）→ ボールを持って崩す");
  if(m.front<=-2) add("run32","FWが孤立しやすい（"+sgn(m.front)+"）→ 2列目の飛び出し");
  if(B.df===2) add("side21","相手は2バック → サイドの2対1が狙い目");
  if(B.fw>=2) add("cover22","相手は"+B.fw+"トップ → 2対2で負けない");
  if(m.back>=2) add("build32","後ろで余る（"+sgn(m.back)+"）→ 余った人が運ぶビルドアップ");
  if(m.front<=-2) add("shot-onetwo","前線が少ない → 2列目がワンツーで飛び出してシュート");
  if(m.mid<0) add("pass-turn","中盤で不利 → 首を振って前を向く技術");
  if(B.df===2) add("switch64","相手は2バック → 寄せてから逆サイドへ");
  if(B.fw>=2) add("def32","相手の前線が多い → 数的不利でも時間をかせぐ守備");
  add("regain5","奪われた瞬間の即時奪回（スペイン流）");
  return out;
}

function autoSession(total){
  const g=Dx.grade, low=g==="U-9"||g==="U-10", ok=id=>T_(id)&&T_(id).grade.includes(g);
  const rec=recommendDrills().map(r=>r.id).filter(id=>ok(id)&&id!=="regain5");
  const mids=[...new Set(rec)].slice(0,total>=90?3:2);
  if(low && !mids.includes("v1goal")) mids.unshift("v1goal");     // 1対1 is the core at U-9/U-10
  if(ok("regain5")) mids.push("regain5");                         // transition every session
  if(!mids.length) mids.push("v1goal");
  if(total>=90){ const sh=ok("shot-onetwo")?"shot-onetwo":"shot-dribble"; if(!mids.includes(sh)) mids.push(sh); }
  const wu=10, cool=total>=90?10:0, game=total>=90?20:15, rest=total-wu-game-cool;
  const per=clamp(Math.floor(rest/mids.length/5)*5,10,20);
  const items=[{id:low?"wu-tag":"wu-rondo41",min:wu}, ...mids.map(id=>({id,min:per}))];
  items.push({id:low?"ssg4v4":"game8",min:Math.max(10,total-cool-items.reduce((a,b)=>a+b.min,0))});
  if(cool) items.push({id:"cooldown",min:cool});
  Dx.items=items; const d=new Date(); Dx.name=Dx.name||`${d.getMonth()+1}/${d.getDate()}の練習`;
  Dx.msg=`${nameOf(S.mine)} vs ${nameOf(S.opp)} の相性と ${g} に合わせて ${items.reduce((a,b)=>a+b.min,0)}分のメニューを組みました`;
}

}

async function saveSession(){
  const name=(Dx.name||"").trim()||"練習メニュー";
  const body={name, grade:Dx.grade, items:Dx.items.map(it=>({id:it.id,min:+it.min||0})), savedAt:Date.now()};
  if(Dx.scol){ try{ await Dx.scol.doc().set(body); Dx.msg=`「${name}」を保存しました`; }catch(e){ Dx.msg="保存できませんでした。通信を確認してもう一度押してください"; } }
  else { Dx.sessions.unshift({...body,id:"s"+Date.now().toString(36)}); saveLocalDx(); Dx.msg=`「${name}」を保存しました`; }
  renderPanel();
}
async function addCustomDrill(d){
  if(Dx.ccol){ try{ await Dx.ccol.doc(d.id).set(d); }catch(e){ Dx.cmsg="登録できませんでした"; renderPanel(); return; } }
  else { Dx.custom.push(d); saveLocalDx(); }
  Dx.cmsg=`「${d.name}」を登録しました`; renderPanel();
}
function wireDrills(){
  const body=document.getElementById("tabbody");
  const gsel=document.getElementById("dGrade"); if(gsel) gsel.addEventListener("change",()=>{Dx.grade=gsel.value; S.grade=gsel.value; document.getElementById("gradeSel").value=gsel.value; if(S.auto) scheduleAuto(); renderPanel();});
  const nm=document.getElementById("dName"); if(nm) nm.addEventListener("input",()=>{Dx.name=nm.value;});
  body.querySelectorAll("[data-imin]").forEach(inp=>inp.addEventListener("change",()=>{Dx.items[+inp.dataset.imin].min=clamp(+inp.value||1,1,60);renderPanel();}));
  body.querySelectorAll("details.drill").forEach(dt=>dt.addEventListener("toggle",()=>{
    const b=dt.querySelector("[data-demo]"); if(dt.open&&b&&DM.id!==b.dataset.demo) startDemo(b.dataset.demo);
  }));
  const f=document.getElementById("cForm");
  if(f) f.addEventListener("submit",e=>{
    e.preventDefault();
    const name=document.getElementById("cName").value.trim(); if(!name) return;
    const lines=id=>document.getElementById(id).value.split("\n").map(x=>x.trim()).filter(Boolean);
    addCustomDrill({id:"c"+Date.now().toString(36), custom:true, name, min:clamp(+document.getElementById("cMin").value||15,1,60),
      theme:[document.getElementById("cTheme").value], grade:[...GRADES], style:"both", players:"", area:"", how:lines("cHow"), points:lines("cPts"), kid:""});
  });
}
document.getElementById("tabbody").addEventListener("click",e=>{
  if(S.tab!=="drill") return;
  const b=e.target.closest("button"); if(!b) return;
  const ds=b.dataset;
  if(ds.demo){ e.preventDefault(); startDemo(ds.demo); return; }
  if(ds.dadd){ e.preventDefault(); const dr=T_(ds.dadd); if(dr){ Dx.items.push({id:dr.id,min:dr.min}); Dx.msg=`「${dr.name}」をメニューに追加しました`; renderPanel(); } return; }
  if(ds.auto){ autoSession(+ds.auto); renderPanel(); return; }
  if(ds.up){ const k=+ds.up; [Dx.items[k-1],Dx.items[k]]=[Dx.items[k],Dx.items[k-1]]; renderPanel(); return; }
  if(ds.down){ const k=+ds.down; [Dx.items[k+1],Dx.items[k]]=[Dx.items[k],Dx.items[k+1]]; renderPanel(); return; }
  if(ds.rm){ Dx.items.splice(+ds.rm,1); renderPanel(); return; }
  if(ds.ssave){ saveSession(); return; }
  if(ds.sclear){ Dx.items=[]; Dx.msg=""; renderPanel(); return; }
  if(ds.theme){ Dx.theme=ds.theme; renderPanel(); return; }
  if(ds.sopen){ const se=Dx.sessions.find(x=>x.id===ds.sopen); if(se){ Dx.items=(se.items||[]).map(it=>({...it})); Dx.name=se.name; Dx.grade=se.grade||Dx.grade; Dx.msg=`「${se.name}」を開きました`; window.scrollTo({top:document.getElementById("tabbody").offsetTop-10,behavior:"smooth"}); renderPanel(); } return; }
  if(ds.sdel){ Dx.confirmDel=ds.sdel; renderPanel(); return; }
  if(ds.scancel){ Dx.confirmDel=null; renderPanel(); return; }
  if(ds.sdel2){ const id=ds.sdel2; Dx.confirmDel=null;
    if(Dx.scol){ Dx.scol.doc(id).delete().catch(()=>{Dx.msg="削除できませんでした";renderPanel();}); }
    else { Dx.sessions=Dx.sessions.filter(x=>x.id!==id); saveLocalDx(); renderPanel(); } return; }
  if(ds.rec){ startRecording(ds.rec); return; }
  if(ds.cdel){ const id=ds.cdel;
    if(Dx.ccol){ Dx.ccol.doc(id).delete().catch(()=>{}); } else { Dx.custom=Dx.custom.filter(x=>x.id!==id); saveLocalDx(); renderPanel(); } return; }
});
async function connectDrills(){
  try{
    const db=await window.claude?.use?.("db"); if(!db) return;
    Dx.scol=db.collection("sessions"); Dx.ccol=db.collection("drills");
    Dx.scol.orderBy("savedAt","desc").onSnapshot(qs=>{ Dx.sessions=qs.docs.map(d=>({...d.data(),id:d.id})); if(S.tab==="drill") renderPanel(); });
    Dx.ccol.onSnapshot(qs=>{ Dx.custom=qs.docs.map(d=>({...d.data(),id:d.id})); if(S.tab==="drill") renderPanel(); });
  }catch(e){}
}

// auto scripts built from the auto-slide engine with the current formations
function positionsFor(bx,by,mineAtt,trans){
  bx=clamp(bx,.5,49.5); by=clamp(by,.5,67.5);
  const mir=([x,y])=>[50-x,68-y], offLine=P=>{ const ys=P.map(p=>p[1]).sort((a,b)=>b-a); return ys[1]; };
  if(mineAtt){ const od=defendTeam(S.opp,50-bx,68-by,trans), md=attackTeam(S.mine,bx,by,offLine(od.P),trans); od.P=markBox(S.opp,od.P,md.P.map(mir),50-bx,68-by,od.near); return {mine:md.P,opp:od.P.map(mir)}; }
  const md=defendTeam(S.mine,bx,by,trans), od=attackTeam(S.opp,50-bx,68-by,offLine(md.P),trans); md.P=markBox(S.mine,md.P,od.P.map(mir),bx,by,md.near); return {mine:md.P,opp:od.P.map(mir)};
}
function autoScript(kind){
  const path = kind==="slide"
    ? [{b:[25,30],a:false,cap:"コーチがボールを持って動く。全員でボールに合わせてスライド"},{b:[40,38],a:false,cap:"ボールが右へ → 全体が右へ、逆サイドは中に絞る"},{b:[42,52],a:false,cap:"自陣の右へ → 一番近い人が寄せて、斜め後ろがカバー"},{b:[10,40],a:false,cap:"逆サイドへ → 全員で素早く横にスライド"},{b:[25,20],a:false,cap:"相手陣へ戻る → ラインを押し上げて前からプレス"}]
    : [{b:[25,60],a:true,cap:"8対8。GKからつないで攻撃スタート"},{b:[40,48],a:true,cap:"サイドへ。幅を取って三角形を作る"},{b:[44,28],a:true,cap:"SHが前へ運ぶ。FWは相手DFの背後を狙う"},{b:[44,12],a:true,cap:"ゴール前：ニア・ファー・折り返しに入る"},{b:[30,40],a:false,cap:"奪われた！ 近い3人で即時奪回",t:true},{b:[30,40],a:true,cap:"奪い返したらカウンター",t:true}];
  const players={};
  F[S.mine].roles.forEach((r,i)=>players["m"+i]={t:"m",lab:r,p:[0,0]});
  if(kind==="game") F[S.opp].roles.forEach((r,i)=>players["o"+i]={t:"o",lab:r,p:[0,0]});
  else players.coach={t:"o",lab:"コーチ",p:[0,0]};
  const steps=path.map((st,k)=>{
    const P=positionsFor(st.b[0],st.b[1],st.a,!!st.t), mv={};
    P.mine.forEach((p,i)=>mv["m"+i]=p);
    if(kind==="game") P.opp.forEach((p,i)=>mv["o"+i]=p); else mv.coach=[st.b[0]+1.5,st.b[1]-1.5];
    return {cap:st.cap, ball:[st.b[0],st.b[1]], mv};
  });
  Object.keys(players).forEach(id=>players[id].p=steps[0].mv[id]);
  return {players,steps,area:null};
}
// resolve a script into absolute frames
function demoFrames(sc){
  const pos={}; Object.entries(sc.players).forEach(([id,p])=>pos[id]=[...p.p]);
  let holder=null, prevBall=null;
  return sc.steps.map(st=>{
    Object.entries(st.mv||{}).forEach(([id,p])=>pos[id]=[...p]);
    let ball=null, pass=false;
    if(typeof st.ball==="string"){ const p=pos[st.ball]; ball=[p[0]+1.1,p[1]-1.1]; pass=holder!==null&&holder!==st.ball; holder=st.ball; }
    else if(Array.isArray(st.ball)){ ball=[...st.ball]; pass=holder!==null||(prevBall&&Math.hypot(ball[0]-prevBall[0],ball[1]-prevBall[1])>2); holder=null; }
    prevBall=ball;
    return {cap:st.cap, pos:JSON.parse(JSON.stringify(pos)), ball, pass};
  });
}

// a script is only played when every number in it is a real position on (or just off) the pitch
function validScript(sc){
  const okP=p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==="number"&&isFinite(v)&&v>-5&&v<75);
  if(!sc||typeof sc!=="object"||!sc.players||!Array.isArray(sc.steps)) return false;
  const ids=Object.keys(sc.players); if(!ids.length||ids.length>20||!sc.steps.length||sc.steps.length>40) return false;
  if(!ids.every(id=>okP(sc.players[id].p))) return false;
  return sc.steps.every(st=>(st.ball==null||typeof st.ball==="string"&&sc.players[st.ball]||okP(st.ball)) && Object.entries(st.mv||{}).every(([id,p])=>sc.players[id]&&okP(p)));
}

  document.getElementById("demoCap").textContent=f.cap;
  document.getElementById("demoStep").textContent=`${i+1} / ${DM.frames.length}`;
}
function playDemo(){
  clearTimeout(DM.timer); DM.playing=true; document.getElementById("demoPlay").textContent="一時停止";
  const tick=()=>{ if(!DM.playing) return;
    if(DM.i>=DM.frames.length-1){ DM.timer=setTimeout(()=>{ showFrame(0,true); DM.timer=setTimeout(tick,1600); },1800); return; }
    showFrame(DM.i+1); DM.timer=setTimeout(tick,2000); };
  DM.timer=setTimeout(tick,1800);
}
function pauseDemo(){ DM.playing=false; clearTimeout(DM.timer); document.getElementById("demoPlay").textContent="再生"; }
function stopDemo(keep){
  clearTimeout(DM.timer); DM.playing=false; DM.id=null;
  const g=document.getElementById("demoLayer"); if(g) g.innerHTML="";
  if(!keep){ document.getElementById("demoBar").hidden=true; setBoardHidden(false); }
}
document.getElementById("demoPlay").addEventListener("click",()=>DM.playing?pauseDemo():playDemo());
document.getElementById("demoPrev").addEventListener("click",()=>{ pauseDemo(); showFrame(Math.max(0,DM.i-1)); });
document.getElementById("demoNext").addEventListener("click",()=>{ pauseDemo(); showFrame(Math.min(DM.frames.length-1,DM.i+1)); });
document.getElementById("demoStop").addEventListener("click",()=>stopDemo(false));

// ---------- Recording a custom drill's movement ----------
const REC={id:null, steps:[], players:null};
function boardSnapshot(){
  const players={}, pos={};
  F[S.mine].roles.forEach((r,i)=>{ const pl=playerById(R.lineup[i]); players["m"+i]={t:"m",lab:pl&&pl.num!==""?String(pl.num):r}; pos["m"+i]=S.pos.mine[i].map(v=>+v.toFixed(2)); });
  if(S.showOpp) F[S.opp].roles.forEach((r,i)=>{ players["o"+i]={t:"o",lab:r}; pos["o"+i]=S.pos.opp[i].map(v=>+v.toFixed(2)); });
  return {players,pos,ball:S.showBall?S.ball.map(v=>+v.toFixed(2)):null};
}
function startRecording(id){
  const dr=T_(id); if(!dr) return;
  stopDemo(false);
  REC.id=id; REC.steps=[]; REC.players=null;
  document.getElementById("recTitle").textContent=dr.name;
  document.getElementById("recBar").hidden=false;
  updateRecBar();
  document.querySelector(".board").scrollIntoView({behavior:"smooth",block:"start"});
}
function updateRecBar(){
  document.getElementById("recCount").textContent=REC.steps.length?`${REC.steps.length}場面 記録済み`:"まだ記録していません";
  document.getElementById("recSave").disabled=REC.steps.length<2;
  document.getElementById("recUndo").disabled=!REC.steps.length;
  document.getElementById("recList").innerHTML=REC.steps.map((st,k)=>`<li>${esc(st.cap||"（説明なし）")}</li>`).join("");
}
document.getElementById("recAdd").addEventListener("click",()=>{
  if(REC.steps.length>=40){ showNotice("場面は40までです"); return; }
  const snap=boardSnapshot();
  if(!REC.players) REC.players=Object.fromEntries(Object.entries(snap.players).map(([id,p])=>[id,{...p,p:snap.pos[id]}]));
  const mv={}; Object.keys(REC.players).forEach(id=>{ if(snap.pos[id]) mv[id]=snap.pos[id]; });
  const cap=document.getElementById("recCap").value.trim();
  REC.steps.push({cap, ball:snap.ball, mv});
  document.getElementById("recCap").value="";
  updateRecBar();
});
document.getElementById("recUndo").addEventListener("click",()=>{ REC.steps.pop(); if(!REC.steps.length) REC.players=null; updateRecBar(); });
document.getElementById("recCancel").addEventListener("click",()=>{ REC.id=null; document.getElementById("recBar").hidden=true; });
document.getElementById("recSave").addEventListener("click",async()=>{
  const demo={players:REC.players, steps:REC.steps};
  if(!validScript(demo)){ showNotice("記録した動きに読み込めない位置がありました。もう一度記録してください。"); return; }
  const id=REC.id;
  try{
    if(Dx.ccol) await Dx.ccol.doc(id).update({demo});
    else { Dx.custom=Dx.custom.map(d=>d.id===id?{...d,demo}:d); saveLocalDx(); }
  }catch(e){ showNotice("保存できませんでした。通信を確認してもう一度押してください。"); return; }
  REC.id=null; document.getElementById("recBar").hidden=true;
  Dx.cmsg="動きを保存しました。「▶ 動きを見る」で再生できます。";
  if(S.tab==="drill") renderPanel();
  if(!Dx.ccol) startDemo(id); else setTimeout(()=>startDemo(id),600);
});

// ---------- Problems are shown, never swallowed ----------
function showNotice(msg){
  const n=document.getElementById("notice"); n.querySelector("span").textContent=msg; n.hidden=false;
}
document.getElementById("noticeClose").addEventListener("click",()=>{document.getElementById("notice").hidden=true;});
window.addEventListener("error",e=>showNotice("うまく動かない部分がありました（"+(e.message||"不明なエラー")+"）。画面を再読み込みしてください。続く場合はこの文をそのまま教えてください。"));
window.addEventListener("unhandledrejection",e=>showNotice("保存か読み込みで問題が起きました（"+((e.reason&&(e.reason.code||e.reason.message))||"不明")+"）。もう一度試してください。"));

function renderPanel(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  document.getElementById("tabbody").innerHTML = S.tab==="match"?renderMatch():S.tab==="mine"?renderFormation(S.mine,true):S.tab==="opp"?renderFormation(S.opp,false):S.tab==="pos"?renderPositions():S.tab==="style"?renderStyle():S.tab==="drill"?renderDrills():S.tab==="roster"?renderRoster():renderBoards();
  if(S.tab==="pos") wirePositions();
  if(S.tab==="drill") wireDrills();
  if(S.tab==="roster") wireRoster();
  if(S.tab==="boards") wireBoards();
}
function updateScorebar(){
  const sb=document.getElementById("scorebar"); if(!sb) return;
  const poss=S.auto?(S.possession==="mine"?"自チーム保持":"相手保持"):"手動";
  sb.innerHTML=`<span class="t m"><small>自チーム</small>${esc(nameOf(S.mine))}</span><span class="vs">VS</span><span class="t o">${esc(nameOf(S.opp))}<small>相手</small></span><span class="meta">${S.auto?'<span class="live"></span>':''}${esc(S.grade)}・${poss}</span>`;
}
function renderAll(){ updateScorebar(); if(DM.id) stopDemo(false); drawZones(); drawTeam("opp"); drawTeam("mine"); drawBall(); drawStrokes(); drawSelection(); updateAutoHint(); renderPanel(); }

// ---------- Wiring ----------
const selMine=document.getElementById("mine"), selOpp=document.getElementById("opp");
ORDER.forEach(id=>{[selMine,selOpp].forEach(s=>{const o=document.createElement("option");o.value=id;o.textContent=nameOf(id);s.appendChild(o);});});
selMine.value=S.mine; selOpp.value=S.opp;
selMine.addEventListener("change",()=>{S.mine=selMine.value;freshPositions();renderAll();});
selOpp.addEventListener("change",()=>{S.opp=selOpp.value;freshPositions();renderAll();});
document.getElementById("swap").addEventListener("click",()=>{[S.mine,S.opp]=[S.opp,S.mine];selMine.value=S.mine;selOpp.value=S.opp;freshPositions();renderAll();});
document.querySelectorAll("[data-phase]").forEach(b=>b.addEventListener("click",()=>{
  S.phase=b.dataset.phase; document.querySelectorAll("[data-phase]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  freshPositions(); renderAll();
}));
document.getElementById("showOpp").addEventListener("change",e=>{S.showOpp=e.target.checked;renderAll();});
document.getElementById("reset").addEventListener("click",()=>{freshPositions();renderAll();});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;renderPanel();}));

document.getElementById("quickSave").addEventListener("click",async()=>{
  const d=new Date(), name=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} の配置`;
  await saveBoard(name,null);
  const m=document.getElementById("quickMsg"); m.textContent=B.msg+"（「保存した配置」タブで開く・上書き・削除ができます）"; m.hidden=false;
  setTimeout(()=>{m.hidden=true;},6000);
});
function setFs(on){
  document.body.classList.toggle("fs",on);
  const b=document.getElementById("fsBtn"); b.setAttribute("aria-pressed",String(on)); b.textContent=on?"✕ 全画面を閉じる":"⛶ 全画面";
  // real full screen where the browser allows it (desktop); the CSS layout above works everywhere else
  try{ if(on&&!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else if(!on&&document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); }catch(e){}
}
document.getElementById("fsBtn").addEventListener("click",()=>setFs(!document.body.classList.contains("fs")));
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement&&document.body.classList.contains("fs")) setFs(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.body.classList.contains("fs")) setFs(false); });
document.getElementById("ballCenter").addEventListener("click",()=>{S.ball=[25,34];S.showBall=true;document.getElementById("showBall").checked=true;drawBall();scheduleAuto();});
document.querySelectorAll("[data-poss]").forEach(b=>b.addEventListener("click",()=>{
  S.poss=b.dataset.poss;
  document.querySelectorAll("[data-poss]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  if(S.gk){ setGk(true); return; }                                    // GK of the team that now has it
  if(!S.auto){ S.auto=true; document.getElementById("autoSlide").checked=true; S.showBall=true; document.getElementById("showBall").checked=true; drawBall(); }
  scheduleAuto();
}));
function setGk(on){
  S.gk=on; document.getElementById("gkMode").checked=on;
  if(on){
    if(S.poss==="auto"){ S.poss="mine"; document.querySelectorAll("[data-poss]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.poss==="mine"))); }
    S.trans=false; document.getElementById("transMode").checked=false;
    S.ball = S.poss==="opp" ? [25,4.2] : [25,63.8];               // ball in the GK's hands
    S.auto=true; document.getElementById("autoSlide").checked=true; S.showBall=true; document.getElementById("showBall").checked=true; drawBall();
  }
  scheduleAuto();
}
document.getElementById("gkMode").addEventListener("change",e=>setGk(e.target.checked));
document.getElementById("gradeSel").addEventListener("change",e=>{
  S.grade=e.target.value; Dx.grade=S.grade;
  if(S.auto) scheduleAuto(); else { freshPositions(); renderAll(); }
  if(S.tab==="drill") renderPanel();
  updateAutoHint();
});
document.getElementById("transMode").addEventListener("change",e=>{
  S.trans=e.target.checked;
  if(!S.auto){ S.auto=true; document.getElementById("autoSlide").checked=true; S.showBall=true; document.getElementById("showBall").checked=true; drawBall(); }
  scheduleAuto();
});
document.getElementById("autoSlide").addEventListener("change",e=>{
  S.auto=e.target.checked;
  if(S.auto){ S.showBall=true; document.getElementById("showBall").checked=true; drawBall(); scheduleAuto(); }
  else { S.gk=false; document.getElementById("gkMode").checked=false; updateAutoHint(); }   // keep everyone where they are; from here players are moved by hand
});
document.getElementById("showBall").addEventListener("change",e=>{S.showBall=e.target.checked;drawBall();});

document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{
  S.mode=b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  svg.classList.toggle("penmode",S.mode==="pen");
  document.getElementById("modeHint").textContent = S.mode==="pen" ? "ピッチの上を指やペンでなぞると、離したところに矢印の先が付きます" : "選手とボールはドラッグで動かせます";
}));
document.querySelectorAll(".sw").forEach(b=>b.addEventListener("click",()=>{
  S.pen.color=b.dataset.color; document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
}));
document.querySelectorAll("[data-dash]").forEach(b=>b.addEventListener("click",()=>{
  S.pen.dash=b.dataset.dash==="1"; document.querySelectorAll("[data-dash]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
}));
document.getElementById("undo").addEventListener("click",()=>{S.draw.pop();drawStrokes();});
document.getElementById("clearDraw").addEventListener("click",()=>{S.draw=[];drawStrokes();});

loadLocal(); loadLocalBoards(); drawPitch(); freshPositions(); renderAll(); connectDb(); connectBoards(); connectDrills();
</script>
