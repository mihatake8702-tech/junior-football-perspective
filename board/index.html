<style>
/* Layout: night-match tactics board. Floodlit pitch on the left, broadcast-style coaching panel on the right; stacks on narrow screens */
:root{
  --bg:#0b1310; --surface:#121c18; --surface-2:#1a2620; --line:#26362e;
  --fg:#eef5f0; --muted:#8fa498;
  --accent:#ff6b2c; --accent-ink:#1b0a03;
  --opp:#4b8dff; --opp-ink:#06122a;
  --grass:#1f6a41; --grass-2:#1a5d39; --chalk:rgba(255,255,255,.88);
  --good:#3ddc8c; --warn:#ffc53d; --bad:#ff5f5f;
  --good-bg:rgba(61,220,140,.14); --warn-bg:rgba(255,197,61,.14); --bad-bg:rgba(255,95,95,.14);
  --glow:rgba(255,107,44,.35); --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --num:"Oswald","Dela Gothic One","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --good:#178a4e; --warn:#b97a00; --bad:#cc2f2f;
  --good-bg:#e1f4e9; --warn-bg:#fbf0d4; --bad-bg:#fde3e1;
  --glow:rgba(232,85,27,.25); --shadow:0 8px 24px rgba(16,26,21,.10);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --line:#d8e0da;
  --fg:#101a15; --muted:#56685d;
  --accent:#e8551b; --accent-ink:#ffffff;
  --opp:#1f63e0; --opp-ink:#ffffff;
  --grass:#2b7a4b; --grass-2:#256d42; --chalk:rgba(255,255,255,.9);
  --good:#178a4e; --warn:#b97a00; --bad:#cc2f2f;
  --good-bg:#e1f4e9; --warn-bg:#fbf0d4; --bad-bg:#fde3e1;
  --glow:rgba(232,85,27,.25); --shadow:0 8px 24px rgba(16,26,21,.10);
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
.pttable{display:grid;gap:6px;margin-top:10px}
.ptrow{display:grid;grid-template-columns:34px 1fr 90px 52px 70px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.03)}
.ptrow.on{background:rgba(255,159,28,.12)}
.ptbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.ptbar i{display:block;height:100%;background:var(--accent)}
.ptrow .pt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:14px 28px}
.app{max-width:1280px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--display);font-weight:400;font-size:1.55rem;letter-spacing:.02em;margin:0}
header p{margin:0;color:var(--muted);font-size:.85rem}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:860px){.board{position:static}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
svg.pitch{width:100%;max-width:520px;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;aspect-ratio:56/74;height:auto}
.player{cursor:grab;transition:transform 1.2s cubic-bezier(.25,.6,.3,1)}
.player.dragging{transition:none;cursor:grabbing}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.player text{font-family:var(--body);font-weight:700;font-size:1.2px;pointer-events:none}
.panel{display:grid;gap:14px;min-width:0}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;flex:1 1 150px;min-width:0}
.field label,.label{font-size:.75rem;color:var(--muted);letter-spacing:.06em;font-weight:500}
select{font:inherit;font-weight:700;font-size:1.05rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;min-height:46px}
select#mine{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
select#opp{border-color:var(--opp);box-shadow:inset 4px 0 0 var(--opp)}
button{font:inherit;cursor:pointer;color:var(--fg)}
.iconbtn{min-height:46px;min-width:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:1.1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:10px 16px;min-height:44px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;min-height:44px;font-size:.88rem}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.88rem;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--opp)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:1.3rem}
.vs .m{color:var(--accent)} .vs .o{color:var(--opp)} .vs small{font-family:var(--body);font-size:.8rem;color:var(--muted)}
.meters{display:grid;gap:8px}
.meter{display:grid;grid-template-columns:5.6em 4.2em 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.meter .zone{font-weight:700;font-size:.92rem}
.meter .zone small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.3}
.num{font-family:var(--display);font-size:1.35rem;text-align:center;border-radius:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.good .num{background:var(--good-bg);color:var(--good)}
.warn .num{background:var(--warn-bg);color:var(--warn)}
.bad .num{background:var(--bad-bg);color:var(--bad)}
.meter .desc{font-size:.86rem;min-width:0}
.meter .desc b{display:block}
h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:8px}
h3 .chip{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.chip.atk{background:var(--accent);color:var(--accent-ink)}
.chip.def{background:var(--opp);color:var(--opp-ink)}
.chip.note{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
li{font-size:.92rem}
.kid{border-left:3px solid var(--warn);padding:8px 12px;background:var(--warn-bg);border-radius:0 8px 8px 0;font-size:.9rem}
.foot{font-size:.75rem;color:var(--muted)}
.tag{font-size:.95rem;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grade{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-right:4px}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.player .pname{font-size:1.3px;font-weight:700;fill:#fff;stroke:rgba(0,0,0,.65);stroke-width:.35px;paint-order:stroke}
.ball{cursor:grab}
.ball.dragging{cursor:grabbing}
.board-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.addrow .field{flex:1 1 140px}
.addrow .field.numf{flex:0 0 88px}
input[type=text],input[type=number]{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;min-height:46px}
.primary{border:0;border-radius:10px;padding:10px 18px;min-height:46px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);min-width:0}
.pl .no{font-family:var(--display);min-width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:.85rem}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl button{border:0;background:none;color:var(--muted);font-size:1.1rem;min-width:36px;min-height:36px;border-radius:8px}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.slot{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:center}
.slot b{font-size:.85rem;text-align:center;padding:4px 0;border-radius:8px;background:var(--surface-2)}
.slot select{font-size:.95rem;min-height:42px;padding:8px}
.status{font-size:.75rem;color:var(--muted)}
.pentools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pentools .seg button{padding:10px 12px;font-size:.88rem}
.swatches{display:flex;gap:6px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--c);box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--fg)}
svg.pitch.penmode{cursor:crosshair}
.saverow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.saverow .field{flex:1 1 180px}
.boards{display:grid;gap:8px}
.bd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.bd .info{flex:1 1 160px;min-width:0}
.bd .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .info small{color:var(--muted);font-size:.75rem}
.bd button{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:700}
.bd button.open{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bd button.danger{color:var(--bad)}
.autochk{font-weight:700}
.autochk input{accent-color:var(--accent)}
#autoHint{min-height:1.2em;font-weight:700;color:var(--fg)}
.chip.es{background:#c8352b;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.chip.en{background:#1f3b73;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px}
.styletips{display:grid;gap:8px;font-size:.9rem}
.styletips .chip{margin:0 8px 0 0}
.principle{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.chip.both{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.drills{display:grid;gap:8px}
details.drill{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.drill summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.drill summary::-webkit-details-marker{display:none}
details.drill[open] summary{border-bottom:1px solid var(--line)}
.dhead{flex:1;min-width:0;display:grid;gap:4px}
.dmeta{font-size:.78rem;color:var(--muted)}
.dtags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ttag{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.why{font-size:.8rem;font-weight:700;color:var(--accent)}
button.add{border:0;border-radius:10px;padding:8px 12px;min-height:42px;font-weight:700;background:var(--fg);color:var(--bg);white-space:nowrap}
.dbody{padding:12px;display:grid;gap:12px}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.themes button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;font-weight:700}
.themes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ol.session{margin:0;padding-left:1.4em;display:grid;gap:6px}
ol.session li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
ol.session .sname{flex:1 1 160px;min-width:0;font-weight:700;font-size:.92rem}
ol.session input{width:4.2em;min-height:38px;padding:6px 8px}
ol.session button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
ol.session button:disabled{opacity:.35}
.total{margin:0;font-size:.95rem}
textarea{font:inherit;font-size:.95rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:100%;resize:vertical}
.cform{display:grid;gap:10px}
.drills.reveal>details.drill{animation:drillIn .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*45ms)}
@keyframes drillIn{from{opacity:0;transform:translateY(-14px) scaleY(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drills.reveal>details.drill{animation:none}}
.player.recoff{opacity:.15;pointer-events:none}
body.recpick .player{cursor:pointer}
body.recpick .player.recoff{opacity:.35;pointer-events:auto}
body.recpick .player:not(.recoff) circle:not(.hit){stroke:#ffd23d;stroke-width:.4}
.dplayer{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.darrowlab{font-family:var(--jp,sans-serif);font-weight:700;font-size:1.6px;pointer-events:none}
.dplayer text{font-family:var(--body);font-weight:700;font-size:1.2px;pointer-events:none}
.dball{transition:transform .7s cubic-bezier(.3,.7,.2,1)}
body.demoslow .dplayer{transition-duration:1.45s} body.demoslow .dball{transition-duration:1.1s}
@media (prefers-reduced-motion:reduce){.dplayer,.dball{transition:none}}
.trail{stroke:#fff;stroke-width:.3;stroke-dasharray:.8 .6;opacity:.9;animation:fade 2.6s forwards}
@keyframes fade{to{opacity:0}}
.demobar{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--accent)}
/* while a drill plays, its bar stays at the bottom of the screen as long as the board is on screen */
.demobar:not([hidden]),.recbar:not([hidden]){position:sticky;bottom:8px;z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.55);
  background:color-mix(in srgb,var(--surface-2) 58%,transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.demobar:not([hidden]) .dcap,.demobar:not([hidden]) .dtitle{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.demobar .dcap{font-size:.95rem;min-height:0}
.demobar .dctl button{min-height:34px;padding:4px 10px;font-size:.85rem}
/* 音声: orange while it reads out; a red slash across the whole button when it is off */
#demoVoice{position:relative;overflow:hidden}
#demoVoice[aria-pressed="false"]::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top right,transparent calc(50% - 1.2px),#ff2340 calc(50% - 1.2px),#ff2340 calc(50% + 1.2px),transparent calc(50% + 1.2px))}
#demoVoice[aria-pressed="true"]{background:var(--accent) !important;border-color:var(--accent) !important;color:var(--accent-ink,#1a0f00) !important}
.dtitle{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dcap{margin:0;font-size:1.05rem;font-weight:700;min-height:2.6em}
.dctl{display:flex;flex-wrap:wrap;gap:8px}
.dbtns{display:flex;flex-direction:column;gap:6px}
button.play{border:1px solid var(--accent);border-radius:10px;padding:8px 12px;min-height:42px;font-weight:700;background:transparent;color:var(--accent);white-space:nowrap}
.recbar{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:2px dashed var(--bad)}
.reclist{margin:0;padding-left:1.4em;font-size:.85rem;color:var(--muted);display:grid;gap:2px}
.notice{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:10px;align-items:center;max-width:720px;margin:0 auto;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);font-weight:700;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.notice span{flex:1;min-width:0}
.notice button{border:0;background:none;color:var(--bad);font-size:1.1rem;min-width:40px;min-height:40px}
/* full-screen board: pitch as large as the screen allows, tools beside it (landscape) or below (portrait) */
.fsbtn{min-height:40px;padding:6px 12px;font-weight:700}
body.fs{overflow:hidden}
body.fs .board{position:fixed;inset:0;z-index:30;border-radius:0;border:0;overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface)}
body.fs svg.pitch{max-width:100%;width:auto;height:min(calc(100dvh - 260px), calc((100vw - 32px) * 74 / 56))}
@media (min-aspect-ratio: 1/1){
  body.fs .board{display:grid;grid-template-columns:auto minmax(260px,360px);grid-auto-rows:min-content;column-gap:20px;align-content:start}
  body.fs .board > svg.pitch{grid-column:1;grid-row:1 / span 30;width:auto;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px)}
  body.fs .board > *:not(svg){grid-column:2}
}
.poslist{display:grid;gap:12px}
.poscard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px;scroll-margin-top:12px}
.poscard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.poshead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rolechip{font-family:var(--display);font-size:.85rem;min-width:2.6em;text-align:center;padding:3px 8px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.extra{font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.chip.warnchip{background:var(--bad-bg);color:var(--bad)}
.toast{font-size:.85rem;font-weight:700;color:var(--good)}

/* ---------- look & feel: broadcast / floodlit pitch ---------- */
body{background:

html[data-digital] svg.pitch .player circle{filter:drop-shadow(0 0 2.5px currentColor)}
/* HUD frame over the pitch: corner brackets, a fine grid, a slow scan line, coordinates */
html[data-digital] .hud{position:absolute;pointer-events:none;z-index:3}
html[data-digital] .hud .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(160,255,210,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(160,255,210,.07) 1px,transparent 1px);background-size:12.5% 8.33%}
html[data-digital] .hud .scan{position:absolute;left:0;right:0;height:18%;background:linear-gradient(to bottom,transparent,rgba(80,255,170,.10),transparent);animation:hudscan 5s linear infinite}
@keyframes hudscan{from{top:-18%}to{top:100%}}
html[data-digital] .hud i{position:absolute;width:18px;height:18px;border:2px solid var(--good)}
html[data-digital] .hud i:nth-of-type(1){left:-6px;top:-6px;border-right:0;border-bottom:0}
html[data-digital] .hud i:nth-of-type(2){right:-6px;top:-6px;border-left:0;border-bottom:0}
html[data-digital] .hud i:nth-of-type(3){left:-6px;bottom:-6px;border-right:0;border-top:0}
html[data-digital] .hud i:nth-of-type(4){right:-6px;bottom:-6px;border-left:0;border-top:0}
html[data-digital] .hud b{position:absolute;font:600 9px/1 var(--en);letter-spacing:.2em;color:var(--good);opacity:.8;white-space:nowrap}
html[data-digital] .hud b.tl{left:4px;top:-16px}
html[data-digital] .hud b.tr{right:4px;top:-16px}
html[data-digital] .hud b.bl{left:4px;bottom:-16px}
/* the zone bands (人数の有利・不利): thinner colour so the pitch stays dark green */
html[data-digital] svg.pitch rect[fill="var(--warn)"], html[data-digital] svg.pitch rect[fill="var(--bad)"]{opacity:.22}
html[data-digital] .hud .grid{background-image:linear-gradient(rgba(160,255,210,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(160,255,210,.10) 1px,transparent 1px)}
/* the name */
html[data-digital] h1 .maestro{display:block;font-family:var(--en);font-weight:300 !important;font-size:1.9rem;letter-spacing:.26em;padding-left:.26em;line-height:1.05;color:#f2fff8;text-shadow:0 0 18px rgba(80,255,170,.35)}
html[data-digital] h1 .maestro em{font-style:normal;color:var(--good);margin-left:.4em;font-weight:400}
/* the title in the middle of the header, the small logo on the left; an English line under it */
header.brand{justify-content:center;position:relative}
/* the 3D board icon (seen from the side, like the 3D view) right beside the title */
header.brand .logo{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 18px rgba(80,255,170,.18)}
header.brand .brandtext{text-align:center;justify-items:center}
html[data-digital] header.brand p.tagline{margin:4px 0 0;font-family:var(--en) !important;font-weight:500;font-size:.72rem;letter-spacing:.34em;color:var(--good);opacity:.8;text-transform:uppercase}
@media (max-width:520px){ header.brand{flex-direction:column;gap:6px}
  html[data-digital] h1 .maestro{font-size:1.6rem} html[data-digital] header.brand p.tagline{font-size:.62rem;letter-spacing:.24em} }
</style>

    <div class="brandtext"><h1><span class="maestro">MAESTRO<em>BOARD</em></span></h1><p class="tagline">READ THE GAME. CONDUCT THE PLAY.</p></div>
    <!-- (the formations are shown at HOME/AWAY under the title; no score bar here) -->
  </header>

  <div class="main">
    <section class="board" aria-label="作戦ボード">
      <div class="row teamsel">
          <div class="field"><label for="mine" class="enlab">HOME<span class="vh">（自チーム）</span></label><select id="mine"></select></div>
          <button class="iconbtn" id="swap" aria-label="自チームと相手を入れ替える" title="入れ替え">⇄</button>
          <div class="field"><label for="opp" class="enlab">AWAY<span class="vh">（相手）</span></label><select id="opp"></select></div>
          <select id="gradeSel" hidden aria-hidden="true"><option selected>U-12</option></select><!-- 学年の選択はなし（いつも U-12 の動き） -->
      </div>
      <!-- 練習メニューのタブでは、HOME/AWAY の代わりにドリルを選ぶ（選ぶとすぐ動きが始まる） -->
      <div class="row teamsel drillsel">
          <div class="field dpick"><span class="enlab" id="drillPickLab">DRILL<span class="vh">（練習をえらぶ）</span></span>
            <button type="button" id="drillPick" class="dpbtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="drillPickLab"><span class="dpname">練習をえらぶ</span><span class="chev" aria-hidden="true"></span></button>
            <div id="drillPickList" class="dplist" role="listbox" hidden></div></div>
      </div>
      <div class="viewbar">
        <div class="seg" role="group" aria-label="見え方">
          <button data-view="top" aria-pressed="true">TOP VIEW</button>
          <button data-view="tv" aria-pressed="false">3D VIEW</button>
          <button data-view="eye" aria-pressed="false">PLAYER VIEW</button>
        </div>
        <button class="ghost fsbtn" id="fsBtn" aria-pressed="false">⛶ 全画面</button>
        <button class="ghost fsbtn" id="reset">配置をリセット</button>
        <button class="ghost" id="laneBtn" aria-pressed="false" hidden>パスコース</button>
        <button class="ghost" id="voiceBtn" data-voice aria-pressed="true" aria-label="読み上げ：オン" hidden>🔊</button>
        <div class="eyepick" id="eyePick" hidden></div>
      </div>
      <svg class="pitch" id="pitch" viewBox="-3 -3 56 74" role="img" aria-label="ピッチ図"></svg>
      <div class="pentools" aria-label="ペン">
        <div class="seg" role="group" aria-label="モード">
          <button data-mode="move" aria-pressed="true">✋ 動かす</button>
          <button data-mode="pen" aria-pressed="false">✏️ 矢印を書く</button>
        </div>
        <div class="swatches" role="group" aria-label="ペンの色">
          <button class="sw" data-color="#ffffff" aria-label="白" aria-pressed="true" style="--c:#ffffff"></button>
          <button class="sw" data-color="#ffd23f" aria-label="黄" aria-pressed="false" style="--c:#ffd23f"></button>
          <button class="sw" data-color="#ff4d4d" aria-label="赤" aria-pressed="false" style="--c:#ff4d4d"></button>
          <button class="sw" data-color="#5ec8ff" aria-label="水色" aria-pressed="false" style="--c:#5ec8ff"></button>
        </div>
        <div class="seg" role="group" aria-label="線の種類">
          <button data-dash="0" aria-pressed="true" title="パス・ボールの動き">― 実線</button>
          <button data-dash="1" aria-pressed="false" title="選手の動き">┄ 点線</button>
        </div>
        <button class="ghost" id="undo">1つ戻す</button>
        <button class="ghost" id="clearDraw">全部消す</button>
      </div>
      <p class="hint" id="modeHint">選手とボールはドラッグで動かせます</p>
      <div class="board-tools possrow">
        <span class="label">ボール保持</span>
        <div class="seg" role="group" aria-label="ボール保持">
          <button data-poss="mine" aria-pressed="true" class="enbtn" aria-label="自チームがボール保持">HOME</button>
          <button data-poss="opp" aria-pressed="false" class="enbtn" aria-label="相手がボール保持">AWAY</button>
        </div>
        <div class="seg segacts">
          <button class="primary" id="quickSave">この配置を保存</button>
          <button class="ghost" id="ballCenter">ボールを中央へ</button>
        </div>
      </div>
      <div class="board-tools">
        <label class="check"><input type="checkbox" id="showBall" checked>ボールを表示</label>
        <label class="check autochk"><input type="checkbox" id="autoSlide">ボールに合わせて自動スライド</label>
      </div>
      <div class="board-tools">
        <input type="checkbox" id="transMode" hidden><!-- 切り替えの瞬間の選択はなし -->
        <label class="check"><input type="checkbox" id="gkMode">GKがボールを持っている（ゴールキック・キャッチ）</label>
      </div>
      <div class="panel inboard">
      <input type="checkbox" id="showOpp" checked hidden><!-- 相手はいつも表示。配置をリセットはピッチの上（全画面の横） -->

      <div class="tabs" role="tablist">
        <button role="tab" data-tab="match" aria-selected="true">相性分析</button>
        <button role="tab" data-tab="mine" aria-selected="false">自チームの戦術</button>
        <button role="tab" data-tab="opp" aria-selected="false">相手の特徴</button>
        <button role="tab" data-tab="pos" aria-selected="false">ポジション</button>
        <button role="tab" data-tab="roster" aria-selected="false">選手</button>
        <button role="tab" data-tab="drill" aria-selected="false">練習メニュー</button>
        <button role="tab" data-tab="boards" aria-selected="false">保存した配置</button>
      </div>
      <div id="tabbody"></div>
      </div>
      <!-- 守り方・セットプレーの選択はなし（いつも「ふつう」） -->
      <p class="toast" id="quickMsg" role="status" style="text-align:center;margin:0" hidden></p>
      <p class="hint" id="autoHint" aria-live="polite"></p>
      <div class="recbar" id="recBar" hidden>
        <div class="dtitle"><span class="chip warnchip">動きを記録中</span><b id="recTitle"></b><span id="recCount" class="dmeta"></span><span id="recWho" class="dmeta"></span></div>
        <p class="foot">選手とボールを動かして場面を作り、「この場面を記録」を押します。これを繰り返すと、記録した順に動くアニメーションになります（2場面以上）。自動スライドを使うと、ボールを動かすだけで全員が動きます。</p>
        <div class="field"><label for="recCap">この場面の説明</label><input type="text" id="recCap" maxlength="60" placeholder="例：SHへパス。SBは外を回る"></div>
        <div class="dctl"><button class="primary" id="recAdd">この場面を記録</button><button class="ghost" id="recUndo">最後の場面を消す</button><button class="ghost" id="recPick" aria-pressed="false">選手を入れる・外す</button><button class="primary" id="recSave">保存して終了</button><button class="ghost" id="recCancel">やめる</button></div>
        <ol id="recList" class="reclist"></ol>
      </div>
      <div class="demobar" id="demoBar" hidden>
        <div class="dtitle"><span class="chip both">練習の動き</span><b id="demoTitle"></b><span id="demoStep" class="dmeta"></span><span id="demoDir" class="dmeta"></span></div>
        <p id="demoCap" class="dcap" aria-live="polite"></p>
        <div class="dctl"><button class="ghost" id="demoPrev">◀ 前へ</button><button class="primary" id="demoPlay">一時停止</button><button class="ghost" id="demoNext">次へ ▶</button><button class="ghost" id="demoSlow" aria-pressed="false">スロー</button><button class="ghost" id="demoVoice" aria-pressed="false" aria-label="音声" hidden>🔊 音声</button><button class="ghost" id="demoStop">終了してボードに戻る</button></div>
      </div>
    </section>

  </div>
</div>

  // "low" = drop off and defend from our half, "normal" = by the ball's zone

// high press near the attackers' goal: midfielders/forwards pick up the nearest outlets, standing goal-side and a bit inside

    .filter(t=>t.i!==0&&t.i!==holder&&(high? t.dist<18&&t.p[1]>by-1 : t.dist<16&&t.p[1]>by-8&&Math.abs(t.p[0]-25)>12&&Math.sign(t.p[0]-25)===side))

  const free=D.map((_,i)=>i).filter(i=>i!==0&&i!==presser&&(high? ["WM","WF","PV","IM","AM","CM","ST"].includes(cls[i])

    +((off[i]>6&&t.p[0]<20)||(off[i]<-6&&t.p[0]>30)?15:0)              // never cross to the other flank

function markOwnBox(fid,P,Opp,bx,by,holder){

  const threats=Opp.map((p,i)=>({i,p,dist:Math.hypot(p[0]-25,68-p[1])})).filter(t=>t.i!==0&&t.i!==presser&&(68-t.p[1])<13&&Math.hypot(t.p[0]-bx,t.p[1]-by)>5)   // only players in/at our box, not the ones already on our ball carrier.sort((a,b)=>a.dist-b.dist);   // only players in/at our box

function computeAuto(){
  const bx=clamp(S.ball[0],.5,49.5), by=clamp(S.ball[1],.5,67.5), mir=([x,y])=>[50-x,68-y];   // a ball dragged off the pitch counts as on the line

  else if(S.poss==="opp") mineAtt=false;
  else { // whoever is closer to the ball has it
    const dm=Math.min(...S.pos.mine.slice(1).map(p=>Math.hypot(p[0]-bx,p[1]-by)));
    const dop=Math.min(...S.pos.opp.slice(1).map(p=>Math.hypot(p[0]-bx,p[1]-by)));
    mineAtt = dm<=dop;
  }
  // offside line for the attackers = second-last defender (GK counts), measured from the attackers' own goal
  const offLine=P=>{ const ys=P.map(p=>p[1]).sort((a,b)=>b-a); return ys[1]; };
  const gk=!!S.gk;
  if(mineAtt && gk){
    const o=defendTeam(S.opp,50-bx,68-by,false,true);
    const m=attackTeam(S.mine,bx,by,offLine(o.P),false,true);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir); S.possession="mine"; return;
  }
  if(!mineAtt && gk){
    const m=defendTeam(S.mine,bx,by,false,true,S.press);
    const o=attackTeam(S.opp,50-bx,68-by,offLine(m.P),false,true);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir); S.possession="opp"; return;
  }
  if(mineAtt){
    const o=defendTeam(S.opp,50-bx,68-by,S.trans);
    const m=attackTeam(S.mine,bx,by,offLine(o.P),S.trans);
    o.P=markBox(S.opp,o.P,m.P.map(mir),50-bx,68-by,o.near);
    if(!S.trans) o.P=pressMarks(S.opp,o.P,m.P.map(mir),50-bx,68-by,o.near);
    m.P=markOwnBox(S.mine,m.P,o.P.map(mir),bx,by,m.near);
    S.pos.mine=m.P; S.pos.opp=o.P.map(mir);
  } else {
    const m=defendTeam(S.mine,bx,by,S.trans,false,S.press);
    const o=attackTeam(S.opp,50-bx,68-by,offLine(m.P),S.trans);
    m.P=markBox(S.mine,m.P,o.P.map(mir),bx,by,m.near);
    if(!S.trans) m.P=pressMarks(S.mine,m.P,o.P.map(mir),bx,by,m.near,S.press);
    o.P=markOwnBox(S.opp,o.P,m.P.map(mir),50-bx,68-by,o.near);

}

// ---------- Matchup math ----------
function matchup(a,b){
  const A=F[a], B=F[b];
  return {back:A.df-B.fw, mid:A.mf-B.mf, front:A.fw-B.df};
}
function rateBack(n){ return n<=0?["bad","危険：余りなし","MFを1人下げて後ろを+1に"] : n===1?["good","理想（+1）","1人はカバーに残す"] : ["warn","余りすぎ","1人を中盤に出せる"]; }
function rateMid(n){ return n>0?["good","有利","中盤でボールを持てる"] : n===0?["warn","互角","1対1で負けない・サポート次第"] : ["bad","不利","相手のフリーマンに注意"]; }
function rateFront(n){ return n>=0?["good","同数以上","相手DFにカバーがいない"] : n===-1?["warn","標準（−1）","FWはCBの間に立つ"] : ["bad","孤立","2列目の押し上げが必要"]; }
const sgn = n => n>0?"+"+n:n===0?"±0":String(n);

function advice(a,b){

  if(m.back>=2){ atk.push("後ろで"+m.back+"人余る → 余ったCBがドリブルで1列運ぶ。相手が寄ってきたらパス（ここに+1が生まれる）"); def.push("余ったDFを1人中盤に出し、相手の中盤のあまりを捕まえる"); }
  if(m.back===1) def.push("後ろは理想の+1。1人は必ずカバーに残す");
  if(m.back<=0) def.push("後ろが同数以下で危険 → 守備時はMFを1人下げて+1にする（例：3-3-1に変形）");
  if(m.mid>0) atk.push("中盤で"+m.mid+"人多い → 「あまりの人」にボールを集めて保持する");
  if(m.mid<0){ atk.push("中盤は不利 → 中盤を飛ばして縦に速く、またはサイドから"); def.push("相手の中盤のあまりは誰か？ 名前でマーク担当を決める（WG/FWが下がる、またはSBを押し上げる）"); }

  if(B.df===2) atk.push("相手は2バックで幅を守れない → SHを大外高く＋SBのオーバーラップでサイド2対1。2バックの背中が一番の狙い目");
  if(B.df===2) atk.push("相手の逆サイドのSHがDFラインに下りる前に、素早いサイドチェンジで攻める");
  if(B.df===3) atk.push("相手3バックの弱点はCBとSBの間（ニアゾーン）。サイドで相手SBを引き出し、MFやFWが斜めにそこへ走る");
  if(B.df===4&&B.mf===2) atk.push("相手MF2人の両脇（中盤のサイド）が空きやすい。そこで受けて前を向く");
  if(B.df>=4) atk.push("相手は4バックで引いて守る → ミドルシュート、サイドで数的優位を作る");
  if(B.fw===2) def.push("相手2トップはCBとサイドCBの間（ハーフスペース）に立ちやすい → 誰が出るかを試合前に決める");
  if(B.fw>=3) def.push("相手は3トップ → SBは同時に上がらない。WGへの縦パスを中盤が限定");
  if(A.df===2) def.push("自分は2バック → ボールを失った瞬間にプレス。DF2人の前を必ず誰かが埋める");
  if(A.df===2) def.push("ボールがサイドにあるときは、逆サイドのSHがDFラインまで下りて3人で守る");

  return {m,atk,def,notes:NOTES[groupOf(a)+"|"+groupOf(b)]||null,book:BOOK_NOTES[groupOf(a)+"|"+groupOf(b)]||null};
}

  const f=F[fid];
  if(role==="GK") return "GK";
  if(role==="CB") return f.df===2?"CB2":f.df===4?"CB4":"CB3";
  if(role==="LB"||role==="RB") return f.df===4?"SB4":"SB3";
  if(role==="LH"||role==="RH") return "SH";

// The players in the line-up (スタメン) collect time while the clock runs. Change the line-up for a substitution.
const PT={running:false, t0:0, period:1, sec:{}, games:[], confirmReset:false};

function savePT(){ try{localStorage.setItem("playtime8",JSON.stringify(ptBody()));}catch(e){} if(ptDoc) ptDoc.set(ptBody()).catch(()=>{}); }
function ptFlush(){                       // add the time since the last flush to everyone on the pitch
  if(!PT.running) return;
  const now=Date.now(), dt=(now-PT.t0)/1000; PT.t0=now;
  R.lineup.forEach(id=>{ if(id) PT.sec[id]=(PT.sec[id]||0)+dt; });
}
const mmss=sec=>{ sec=Math.round(sec||0); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); };
function renderPlaytime(){
  ptFlush();
  const onField=new Set(R.lineup.filter(Boolean));
  const season=id=>PT.games.reduce((a,g)=>a+(g.sec[id]||0),0);
  const rows=R.players.map(p=>({p,now:PT.sec[p.id]||0,tot:season(p.id)+(PT.sec[p.id]||0)}));
  const max=Math.max(1,...rows.map(r=>r.now));
  return `<div class="card">
    <div><h3>試合の出場時間</h3><p class="foot">「スタメン」に入っている選手の時間が進みます。交代はスタメンの割り当てを変えるだけ。3ピリオド制のように、全員が試合に出られるように使ってください。</p></div>

      <button class="primary" id="ptStart">${PT.running?"一時停止":"開始"}</button>

      <button class="ghost" id="ptSave">この試合を記録して次へ</button>
      <button class="ghost" id="ptReset">${PT.confirmReset?"もう一度押すと消えます":"この試合の時間を0に"}</button>
      <span class="dmeta" id="ptState">${PT.running?"計測中":"停止中"}・ピリオド${PT.period}</span>
    </div>
    ${R.players.length?`<div class="pttable">${rows.map(r=>`<div class="ptrow${onField.has(r.p.id)?" on":""}">
      <span class="no">${r.p.num!==""?esc(r.p.num):"-"}</span><span class="nm">${esc(r.p.name)}${onField.has(r.p.id)?" ●":""}</span>
      <span class="ptbar"><i data-ptbar="${esc(r.p.id)}" style="width:${Math.round(r.now/max*100)}%"></i></span>
      <span class="pt" data-pt="${esc(r.p.id)}">${mmss(r.now)}</span><span class="foot">通算 ${Math.round(r.tot/60)}分</span></div>`).join("")}</div>`
      :`<p class="foot">先に上で選手を登録してください。</p>`}
    <p class="foot">記録した試合：${PT.games.length}試合</p>
  </div>`;
}

    if(v) R.lineup=R.lineup.map((x,j)=>x===v&&j!==i?null:x); // one player, one slot
    R.lineup[i]=v; saveRoster(); renderPanel(); drawTeam("mine");
  }));
}

// ---------- Pen (freehand arrows) ----------
function pathD(p){
  if(p.length<3) return "M"+p.map(q=>q[0].toFixed(2)+","+q[1].toFixed(2)).join(" L");
  let d=`M${p[0][0].toFixed(2)},${p[0][1].toFixed(2)}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=` Q${p[i][0].toFixed(2)},${p[i][1].toFixed(2)} ${mx.toFixed(2)},${my.toFixed(2)}`;}
  const l=p[p.length-1]; return d+` L${l[0].toFixed(2)},${l[1].toFixed(2)}`;
}
function arrowHead(p){
  const e=p[p.length-1]; let k=p.length-2;
  while(k>0 && Math.hypot(e[0]-p[k][0],e[1]-p[k][1])<1.8) k--;
  const a=Math.atan2(e[1]-p[k][1],e[0]-p[k][0]), s=1.5, w=.5;
  const pt=t=>[e[0]+Math.cos(a+t)*s*(t?1:0),e[1]+Math.sin(a+t)*s*(t?1:0)];
  const L=[e[0]-Math.cos(a-w)*s,e[1]-Math.sin(a-w)*s], R=[e[0]-Math.cos(a+w)*s,e[1]-Math.sin(a+w)*s];
  const tip=[e[0]+Math.cos(a)*.35,e[1]+Math.sin(a)*.35];
  return `M${tip[0].toFixed(2)},${tip[1].toFixed(2)} L${L[0].toFixed(2)},${L[1].toFixed(2)} L${R[0].toFixed(2)},${R[1].toFixed(2)} Z`;
}
function strokeEl(st,parent,withHead){
  const g=el("g",{},parent);
  el("path",{d:pathD(st.pts),fill:"none",stroke:"rgba(0,0,0,.35)","stroke-width":.85,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":st.dash?"1.1 1.1":"none"},g);
  const main=el("path",{d:pathD(st.pts),fill:"none",stroke:st.color,"stroke-width":.5,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":st.dash?"1.1 1.1":"none"},g);
  if(withHead) el("path",{d:arrowHead(st.pts),fill:st.color,stroke:"rgba(0,0,0,.35)","stroke-width":.15},g);
  return g;
}
function drawStrokes(){
  const layer=document.getElementById("drawLayer"); layer.innerHTML="";
  S.draw.forEach(st=>strokeEl(st,layer,true));
}
let cur=null, curEl=null;
function penDown(e){
  if(S.mode!=="pen") return;
  e.preventDefault(); try{svg.setPointerCapture(e.pointerId);}catch(_){}
  const p=svgPoint(e); cur={pts:[[p.x,p.y]],color:S.pen.color,dash:S.pen.dash};
}
function penMove(e){
  if(!cur) return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const p=svgPoint(ev), l=cur.pts[cur.pts.length-1];
    if(Math.hypot(p.x-l[0],p.y-l[1])>.35) cur.pts.push([p.x,p.y]);
  }
  if(curEl) curEl.remove();
  curEl=strokeEl(cur,document.getElementById("drawLayer"),cur.pts.length>3);
}
function penUp(){
  if(!cur) return;
  let len=0; for(let i=1;i<cur.pts.length;i++) len+=Math.hypot(cur.pts[i][0]-cur.pts[i-1][0],cur.pts[i][1]-cur.pts[i-1][1]);
  if(len>1.5) S.draw.push({...cur,pts:cur.pts.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2)])});
  cur=null; if(curEl){curEl.remove();curEl=null;} drawStrokes();
}
svg.addEventListener("pointerdown",penDown);
svg.addEventListener("pointermove",penMove);
svg.addEventListener("pointerup",penUp);
svg.addEventListener("pointercancel",penUp);

// ---------- Saved boards ----------
const B = {list:[], col:null, mode:"local", msg:"", confirmDel:null};
function loadLocalBoards(){ try{const v=JSON.parse(localStorage.getItem("boards8")||"[]"); if(Array.isArray(v)) B.list=v;}catch(e){} }
function saveLocalBoards(){ try{localStorage.setItem("boards8",JSON.stringify(B.list));}catch(e){} }
function snapshotBoard(name){
  return {name, savedAt:Date.now(), mine:S.mine, opp:S.opp, phase:S.phase, poss:S.poss, auto:S.auto, gk:!!S.gk, grade:S.grade, showOpp:S.showOpp, showBall:S.showBall,
    ball:S.ball.map(v=>+v.toFixed(2)), pos:{mine:S.pos.mine.map(q=>q.map(v=>+v.toFixed(2))), opp:S.pos.opp.map(q=>q.map(v=>+v.toFixed(2)))},
    draw:S.draw};
}
async function saveBoard(name,id){
  const body=snapshotBoard(name);
  if(B.col){
    try{ if(id) await B.col.doc(id).set(body); else await B.col.doc().set(body); B.msg=`「${name}」を保存しました`; }
    catch(e){ B.msg="保存できませんでした。通信を確認してもう一度押してください"; }
  }else{
    if(id){ B.list=B.list.map(b=>b.id===id?{...body,id}:b); } else { B.list.unshift({...body,id:"b"+Date.now().toString(36)}); }
    saveLocalBoards(); B.msg=`「${name}」を保存しました`;
  }
  if(S.tab==="boards") renderPanel();
}
async function deleteBoard(id){
  if(B.col){ try{ await B.col.doc(id).delete(); }catch(e){ B.msg="削除できませんでした"; } }
  else { B.list=B.list.filter(b=>b.id!==id); saveLocalBoards(); }
  B.confirmDel=null; if(S.tab==="boards") renderPanel();
}
function openBoard(b){
  S.mine=F[b.mine]?b.mine:S.mine; S.opp=F[b.opp]?b.opp:S.opp; S.phase="base";
  S.showOpp=true; S.showBall=b.showBall!==false;
  S.ball=b.ball?[...b.ball]:[25,34];
  S.pos.mine=(b.pos&&b.pos.mine||F[S.mine][S.phase]).map(q=>[...q]);
  S.pos.opp=(b.pos&&b.pos.opp||F[S.opp][oppPhase(S.phase)].map(([x,y])=>[50-x,68-y])).map(q=>[...q]);
  S.draw=(b.draw||[]).map(st=>({...st,pts:st.pts.map(q=>[...q])}));
  selMine.value=S.mine; selOpp.value=S.opp;
  document.querySelectorAll(".seg [data-phase]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.phase===S.phase)));
  document.getElementById("showOpp").checked=S.showOpp; document.getElementById("showBall").checked=S.showBall;
  S.poss=b.poss==="opp"?"opp":"mine"; S.auto=!!b.auto; document.getElementById("autoSlide").checked=S.auto;
  S.gk=!!b.gk; document.getElementById("gkMode").checked=S.gk;

  document.querySelectorAll("[data-poss]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.poss===S.poss)));
  B.msg=`「${b.name}」を開きました`;
  renderAll();
}
function fmtDate(ms){const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function renderBoards(){
  return `<div class="card">
    <div><h3>いまの配置を保存</h3><p class="foot">フォーメーション・選手の位置・ボール・書いた矢印をまとめて保存します。</p></div>
    <form class="saverow" id="saveForm" autocomplete="off">

      <button class="primary" type="submit">保存</button>
    </form>
    ${B.msg?`<p class="toast" role="status">${esc(B.msg)}</p>`:""}
    ${B.list.length?`<div class="boards">${B.list.map(b=>`<div class="bd">
      <div class="info"><b>${esc(b.name)}</b><small>${esc(nameOf(b.mine))} vs ${esc(nameOf(b.opp))} ・ ${(b.draw||[]).length}本の矢印 ・ ${fmtDate(b.savedAt)}</small></div>
      <button class="open" data-open="${esc(b.id)}">開く</button>
      <button data-over="${esc(b.id)}">上書き</button>
      ${B.confirmDel===b.id?`<button class="danger" data-del2="${esc(b.id)}">本当に削除</button><button data-cancel="1">やめる</button>`:`<button class="danger" data-delb="${esc(b.id)}">削除</button>`}
    </div>`).join("")}</div>`:`<p class="foot">保存した配置はまだありません。ピッチで配置を作ってから名前を付けて保存してください。</p>`}
    <p class="status">${B.col?"保存先：このアプリ（どの端末から開いても同じ）":"保存先：この端末のブラウザのみ"}</p>
  </div>`;
}
function wireBoards(){
  const f=document.getElementById("saveForm"); if(!f) return;
  f.addEventListener("submit",e=>{e.preventDefault();const n=document.getElementById("bName").value.trim();if(n) saveBoard(n,null);});
  const byId=id=>B.list.find(b=>b.id===id);
  document.querySelectorAll("[data-open]").forEach(x=>x.addEventListener("click",()=>{const b=byId(x.dataset.open);if(b)openBoard(b);}));
  document.querySelectorAll("[data-over]").forEach(x=>x.addEventListener("click",()=>{const b=byId(x.dataset.over);if(b)saveBoard(b.name,b.id);}));
  document.querySelectorAll("[data-delb]").forEach(x=>x.addEventListener("click",()=>{B.confirmDel=x.dataset.delb;B.msg="";renderPanel();}));
  document.querySelectorAll("[data-del2]").forEach(x=>x.addEventListener("click",()=>deleteBoard(x.dataset.del2)));
  document.querySelectorAll("[data-cancel]").forEach(x=>x.addEventListener("click",()=>{B.confirmDel=null;renderPanel();}));
}
async function connectBoards(){
  try{
    const db=await window.claude?.use?.("db"); if(!db) return;
    B.col=db.collection("boards");
    B.col.orderBy("savedAt","desc").onSnapshot(qs=>{
      B.list=qs.docs.map(d=>({...d.data(),id:d.id}));
      if(S.tab==="boards") renderPanel();
    });
  }catch(e){}
}

function autoSession(total){
  const g=Dx.grade, low=g==="U-9"||g==="U-10", ok=id=>!!T_(id);
  const rec=recommendDrills().map(r=>r.id).filter(id=>ok(id)&&id!=="regain5");
  const mids=[...new Set(rec)].slice(0,total>=90?3:2);
  if(low && !mids.includes("v1goal")) mids.unshift("v1goal");     // 1対1 is the core at U-9/U-10
  if(ok("regain5")) mids.push("regain5");                         // transition every session
  if(!mids.length) mids.push("v1goal");
  if(total>=90){ const sh=ok("shot-onetwo")?"shot-onetwo":"shot-dribble"; if(!mids.includes(sh)) mids.push(sh); }
  const wu=10, cool=total>=90?10:0, game=total>=90?20:15, rest=total-wu-game-cool;
  const per=clamp(Math.floor(rest/mids.length/5)*5,10,20);
  const items=[{id:low?"wu-tag":"wu-rondo41",min:wu}, ...mids.map(id=>({id,min:per}))];
  items.push({id:low?"ssg4v4":"game8",min:Math.max(10,total-cool-items.reduce((a,b)=>a+b.min,0))});
  if(cool) items.push({id:"cooldown",min:cool});
  Dx.items=items; const d=new Date(); Dx.name=Dx.name||`${d.getMonth()+1}/${d.getDate()}の練習`;
  Dx.msg=`${nameOf(S.mine)} vs ${nameOf(S.opp)} の相性に合わせて ${items.reduce((a,b)=>a+b.min,0)}分のメニューを組みました`;
}

      <span class="dtags">${dr.custom?`<span class="chip both">自作</span>`:""}${dr.theme.map(t=>`<span class="ttag">${esc(t)}</span>`).join("")}</span>
      ${why?`<span class="why">${esc(why)}</span>`:""}</div>
      <span class="dbtns">${demoOf(dr)?`<button class="play" data-demo="${esc(dr.id)}">▶ 動きを見る</button>`:""}<button class="add" data-dadd="${esc(dr.id)}">＋追加</button></span></summary>
    <div class="dbody">
      ${dr.how&&dr.how.length?`<div><h3>やり方</h3>${list(dr.how)}</div>`:""}
      ${dr.points&&dr.points.length?`<div><h3><span class="chip warnchip">ポイント</span>コーチングポイント</h3>${list(dr.points)}</div>`:""}
      ${dr.kid?`<div class="kid"><b>子どもへの一言：</b>「${esc(dr.kid)}」</div>`:""}
      ${dr.custom?`<div class="row" style="gap:8px"><button class="primary" data-rec="${esc(dr.id)}">${dr.demo?"動きを作り直す":"動きを作る"}</button><button class="ghost" data-cdel="${esc(dr.id)}">このドリルを削除</button></div>`:""}
    </div></details>`;
}

async function saveSession(){
  const name=(Dx.name||"").trim()||"練習メニュー";
  const body={name, grade:Dx.grade, items:Dx.items.map(it=>({id:it.id,min:+it.min||0})), savedAt:Date.now()};
  if(Dx.scol){ try{ await Dx.scol.doc().set(body); Dx.msg=`「${name}」を保存しました`; }catch(e){ Dx.msg="保存できませんでした。通信を確認してもう一度押してください"; } }
  else { Dx.sessions.unshift({...body,id:"s"+Date.now().toString(36)}); saveLocalDx(); Dx.msg=`「${name}」を保存しました`; }
  renderPanel();
}
async function addCustomDrill(d){
  if(Dx.ccol){ try{ await Dx.ccol.doc(d.id).set(d); }catch(e){ Dx.cmsg="登録できませんでした"; renderPanel(); return; } }
  else { Dx.custom.push(d); saveLocalDx(); }
  Dx.cmsg=`「${d.name}」を登録しました`; renderPanel();
}
function wireDrills(){
  const body=document.getElementById("tabbody");
  const gsel=document.getElementById("dGrade"); if(gsel) gsel.addEventListener("change",()=>{Dx.grade=gsel.value; S.grade=gsel.value; document.getElementById("gradeSel").value=gsel.value; if(S.auto) scheduleAuto(); renderPanel();});
  const nm=document.getElementById("dName"); if(nm) nm.addEventListener("input",()=>{Dx.name=nm.value;});
  body.querySelectorAll("[data-imin]").forEach(inp=>inp.addEventListener("change",()=>{Dx.items[+inp.dataset.imin].min=clamp(+inp.value||1,1,60);renderPanel();}));
  body.querySelectorAll("details.drill").forEach(dt=>dt.addEventListener("toggle",()=>{
    const b=dt.querySelector("[data-demo]"); if(dt.open&&b&&DM.id!==b.dataset.demo) startDemo(b.dataset.demo);
  }));
  const f=document.getElementById("cForm");
  if(f) f.addEventListener("submit",e=>{
    e.preventDefault();
    const name=document.getElementById("cName").value.trim(); if(!name) return;
    const lines=id=>document.getElementById(id).value.split("\n").map(x=>x.trim()).filter(Boolean);
    const nm=clamp(Math.round(+document.getElementById("cNm").value||3),1,8), no=clamp(Math.round(+document.getElementById("cNo").value||0),0,8);
    addCustomDrill({id:"c"+Date.now().toString(36), custom:true, name, min:clamp(+document.getElementById("cMin").value||15,1,60), nm, no,
      theme:[document.getElementById("cTheme").value], grade:[...GRADES], style:"both", players:`味方${nm}人${no?`・相手${no}人`:""}`, area:"", how:lines("cHow"), points:lines("cPts"), kid:""});
  });
}
document.getElementById("tabbody").addEventListener("click",e=>{
  if(S.tab!=="drill") return;
  const b=e.target.closest("button"); if(!b) return;
  const ds=b.dataset;
  if(ds.demo){ e.preventDefault(); startDemo(ds.demo); return; }
  if(ds.dadd){ e.preventDefault(); const dr=T_(ds.dadd); if(dr){ Dx.items.push({id:dr.id,min:dr.min}); Dx.msg=`「${dr.name}」をメニューに追加しました`; renderPanel(); } return; }
  if(ds.auto){ autoSession(+ds.auto); renderPanel(); return; }
  if(ds.up){ const k=+ds.up; [Dx.items[k-1],Dx.items[k]]=[Dx.items[k],Dx.items[k-1]]; renderPanel(); return; }
  if(ds.down){ const k=+ds.down; [Dx.items[k+1],Dx.items[k]]=[Dx.items[k],Dx.items[k+1]]; renderPanel(); return; }
  if(ds.rm){ Dx.items.splice(+ds.rm,1); renderPanel(); return; }
  if(ds.ssave){ saveSession(); return; }
  if(ds.sclear){ Dx.items=[]; Dx.msg=""; renderPanel(); return; }
  if(ds.theme){ Dx.theme=Dx.theme===ds.theme?null:ds.theme; Dx.anim=!!Dx.theme; renderPanel(); return; }
  if(ds.sopen){ const se=Dx.sessions.find(x=>x.id===ds.sopen); if(se){ Dx.items=(se.items||[]).map(it=>({...it})); Dx.name=se.name; Dx.grade=se.grade||Dx.grade; Dx.msg=`「${se.name}」を開きました`; window.scrollTo({top:document.getElementById("tabbody").offsetTop-10,behavior:"smooth"}); renderPanel(); } return; }
  if(ds.sdel){ Dx.confirmDel=ds.sdel; renderPanel(); return; }
  if(ds.scancel){ Dx.confirmDel=null; renderPanel(); return; }
  if(ds.sdel2){ const id=ds.sdel2; Dx.confirmDel=null;
    if(Dx.scol){ Dx.scol.doc(id).delete().catch(()=>{Dx.msg="削除できませんでした";renderPanel();}); }
    else { Dx.sessions=Dx.sessions.filter(x=>x.id!==id); saveLocalDx(); renderPanel(); } return; }
  if(ds.rec){ startRecording(ds.rec); return; }
  if(ds.cdel){ const id=ds.cdel;
    if(Dx.ccol){ Dx.ccol.doc(id).delete().catch(()=>{}); } else { Dx.custom=Dx.custom.filter(x=>x.id!==id); saveLocalDx(); renderPanel(); } return; }
});
async function connectDrills(){
  try{
    const db=await window.claude?.use?.("db"); if(!db) return;
    Dx.scol=db.collection("sessions"); Dx.ccol=db.collection("drills");
    Dx.scol.orderBy("savedAt","desc").onSnapshot(qs=>{ Dx.sessions=qs.docs.map(d=>({...d.data(),id:d.id})); if(S.tab==="drill") renderPanel(); });
    Dx.ccol.onSnapshot(qs=>{ Dx.custom=qs.docs.map(d=>({...d.data(),id:d.id})); if(S.tab==="drill") renderPanel(); });
  }catch(e){}
}

// ---------- レッスン（MAESTRO LESSONS /learn/ から ?lesson=ID で開く）: 見て学ぶ。お手本 → スローで解説 → よくある失敗 → もう一回 ----------
// a lesson is a drill script whose steps may also say: part (the chip above the words), slow, view ("tv"|"eye"|"top"), eye (whose eyes),
// cut (jump there, no running back), wait (ms more on this scene)
// a lesson chapter: the scenes once (お手本), then again slowly with the points (スローで解説); the 「ダメな例」 is its own short script
function LCH(o){
  const players={}; Object.entries(o.who).forEach(([id,w])=>{ const [t,lab]=w.split(" "); players[id]=(t==="m"?pm:po)(lab,...o.P0[id]); });
  const first={view:"tv",cut:true,mv:{...o.P0}};
  const main=[...o.steps.map((st,i)=>({...st,part:"お手本",...(i?{}:first)})),
   {part:"スローで解説",cut:true,slow:true,view:"tv",cap:`スローでもう一度。見るポイントは${o.n}つ`,ball:o.steps[0].ball,mv:{...o.P0}},
   ...o.steps.slice(1).map((st,i)=>({...st,part:"スローで解説",slow:true,...(o.slow[i+1]||{})}))];
  const bad=o.bad.map((st,i)=>({...st,part:"ダメな例",...(i?{}:{...first,mv:{...o.P0,...(st.mv||{})}})}));
  return {t:o.t, sc:{area:null,players,steps:main,camZoom:o.cam}, bad:{area:null,players,steps:bad,camZoom:o.cam}};   // (cam: 1.3 = the camera 1.3 times further away)
}

function positionsFor(bx,by,mineAtt,trans){
  bx=clamp(bx,.5,49.5); by=clamp(by,.5,67.5);
  const mir=([x,y])=>[50-x,68-y], offLine=P=>{ const ys=P.map(p=>p[1]).sort((a,b)=>b-a); return ys[1]; };
  if(mineAtt){ const od=defendTeam(S.opp,50-bx,68-by,trans), md=attackTeam(S.mine,bx,by,offLine(od.P),trans); od.P=markBox(S.opp,od.P,md.P.map(mir),50-bx,68-by,od.near); if(!trans) od.P=pressMarks(S.opp,od.P,md.P.map(mir),50-bx,68-by,od.near); return {mine:md.P,opp:od.P.map(mir)}; }
  const md=defendTeam(S.mine,bx,by,trans,false,S.press), od=attackTeam(S.opp,50-bx,68-by,offLine(md.P),trans); md.P=markBox(S.mine,md.P,od.P.map(mir),bx,by,md.near); if(!trans) md.P=pressMarks(S.mine,md.P,od.P.map(mir),bx,by,md.near,S.press); return {mine:md.P,opp:od.P.map(mir)};
}
function autoScript(kind){
  const path = kind==="slide"
    ? [{b:[25,30],a:false,cap:"コーチがボールを持って動く。全員でボールに合わせてスライド"},{b:[40,38],a:false,cap:"ボールが右へ → 全体が右へ、逆サイドは中に絞る"},{b:[42,52],a:false,cap:"自陣の右へ → 一番近い人が寄せて、斜め後ろがカバー"},{b:[10,40],a:false,cap:"逆サイドへ → 全員で素早く横にスライド"},{b:[25,20],a:false,cap:"相手陣へ戻る → ラインを押し上げて前からプレス"}]
    : [{b:[25,60],a:true,cap:"8対8。GKからつないで攻撃スタート"},{b:[40,48],a:true,cap:"サイドへ。幅を取って三角形を作る"},{b:[44,28],a:true,cap:"SHが前へ運ぶ。FWは相手DFの背後を狙う"},{b:[44,12],a:true,cap:"ゴール前：ニア・ファー・折り返しに入る"},{b:[30,40],a:false,cap:"奪われた！ 近い3人で即時奪回",t:true},{b:[30,40],a:true,cap:"奪い返したらカウンター",t:true}];
  const players={};
  F[S.mine].roles.forEach((r,i)=>players["m"+i]={t:"m",lab:r,p:[0,0]});
  if(kind==="game") F[S.opp].roles.forEach((r,i)=>players["o"+i]={t:"o",lab:r,p:[0,0]});
  else players.coach={t:"o",lab:"コーチ",p:[0,0]};
  const steps=path.map((st,k)=>{
    const P=positionsFor(st.b[0],st.b[1],st.a,!!st.t), mv={};
    P.mine.forEach((p,i)=>mv["m"+i]=p);
    if(kind==="game") P.opp.forEach((p,i)=>mv["o"+i]=p); else mv.coach=[st.b[0]+1.5,st.b[1]-1.5];
    return {cap:st.cap, ball:[st.b[0],st.b[1]], mv};
  });
  Object.keys(players).forEach(id=>players[id].p=steps[0].mv[id]);
  return {players,steps,area:null};
}
// resolve a script into absolute frames
function demoFrames(sc,tight){
  const pos={}; Object.entries(sc.players).forEach(([id,p])=>pos[id]=[...p.p]);
  let holder=null, prevBall=null, runner=null;
  const frames=sc.steps.map(st=>{
    // the one who ran onto a pass into space reaches the ball in the next scene (unless the scene moves them itself)
    if(runner&&prevBall&&!(st.mv&&st.mv[runner])) pos[runner]=[prevBall[0]-1.1,prevBall[1]+1.1];
    runner=null;
    const prev=JSON.parse(JSON.stringify(pos));
    Object.entries(st.mv||{}).forEach(([id,p])=>pos[id]=[...p]);
    let ball=null, pass=false, lead=false;
    if(typeof st.ball==="string"&&st.lead){
      // into space: the ball goes ~2.5 m ahead of the runner, along their run; nobody has it until they get there
      const p=pos[st.ball], q=prev[st.ball]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=Math.hypot(dx,dy)||1;
      ball=[p[0]+dx/L*2.5, p[1]+dy/L*2.5]; pass=true; holder=null; lead=st.ball; runner=st.ball; }
    else if(typeof st.ball==="string"){
      // the ball is in front of the one who has it: on the way they run, or (standing) towards the goal they attack
      const p=pos[st.ball], q=prev[st.ball]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=Math.hypot(dx,dy);
      const gy=(sc.players[st.ball]||{}).t==="o"?68:0, gx=25-p[0], gd=gy-p[1], G=Math.hypot(gx,gd)||1;
      ball = L>1 ? [p[0]+dx/L*1.3, p[1]+dy/L*1.3] : [p[0]+gx/G*1.3, p[1]+gd/G*1.3];
      pass=holder!==null&&holder!==st.ball&&!st.steal; holder=st.ball; }   // (a steal is not a pass: no pass line)
    else if(Array.isArray(st.ball)){ ball=[...st.ball]; pass=holder!==null||(prevBall&&Math.hypot(ball[0]-prevBall[0],ball[1]-prevBall[1])>2); holder=null; }
    prevBall=ball;
    return {cap:st.cap, pos:JSON.parse(JSON.stringify(pos)), ball, pass, lead, hold:typeof st.ball==="string"&&!lead?st.ball:null, look:st.look||null,
      part:st.part, slow:!!st.slow, view:st.view, eye:st.eye, cut:!!st.cut, wait:st.wait||0, space:st.space||null};
  });
  return tight?clearLanes(sc,tightenPress(sc,frames)):frames;
}
// a pass must not go through an opponent: anyone of the other team standing on the line of a pass (where it starts, or
// where they end up) steps 1.6 m to the side of it — the side they are on, or towards their own goal if right on it
// (not for shots, and never the keeper)
function clearLanes(sc,frames){
  const P=sc.players;
  const off=(a,b,q)=>{ const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,t=(q[0]-a[0])*ux+(q[1]-a[1])*uy;
    if(t<1||t>L-.8) return null; const cr=(q[0]-a[0])*uy-(q[1]-a[1])*ux; return {t,cr,ux,uy}; };
  frames.forEach((f,i)=>{ if(!i||!f.ball) return; const pf=frames[i-1];
    const from=pf.hold?pf.pos[pf.hold]:pf.ball, to=f.hold?f.pos[f.hold]:f.ball; if(!from||!to||!f.pass) return;
    const team=P[pf.hold||f.hold]?.t; if(!team) return;
    if(!f.hold&&(to[1]<3||to[1]>65)) return;                       // a shot: the keeper and the wall stay where they are
    Object.keys(f.pos).forEach(id=>{ const p=P[id]; if(!p||p.t===team||p.lab==="GK") return;
      for(const fr of [pf,f]){ const q=fr.pos[id], o=off(from,to,q); if(!o||Math.abs(o.cr)>=1.4) continue;
        let side=Math.sign(o.cr); if(!side){ const gy=p.t==="m"?68:0; side=Math.sign(-o.ux*(gy-q[1]))||1; }
        const k=1.6*side-o.cr; fr.pos[id]=[+(q[0]+o.uy*k).toFixed(2),+(q[1]-o.ux*k).toFixed(2)]; } });
  });
  return frames;
}
// the drills that come with the app: the defender on the ball presses closer (about 6/10 of the drawn gap, not under
// 1.8 m), on the same line so goal-side / inside stays as drawn; not in the first scene (the starting places), and not
// where it would stand in the way of the pass that comes in or goes out
function tightenPress(sc,frames){
  const sd=(a,b,p)=>{ const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L)); return [Math.hypot(a[0]+dx*t-p[0],a[1]+dy*t-p[1]),t*Math.sqrt(L)]; };
  frames.forEach((f,i)=>{ if(!i||!f.hold) return;
    const P=sc.players, h=f.pos[f.hold], team=P[f.hold].t; let k=null, bd=6;
    Object.entries(f.pos).forEach(([id,q])=>{ const p=P[id]; if(!p||p.t===team||p.lab==="GK") return; const d=Math.hypot(q[0]-h[0],q[1]-h[1]); if(d<bd){ bd=d; k=id; } });
    if(!k||bd<=1.9) return;
    const q=f.pos[k], nd=Math.max(1.8,bd*.6), np=[h[0]+(q[0]-h[0])*nd/bd, h[1]+(q[1]-h[1])*nd/bd];
    const lanes=[]; const pf=frames[i-1]; if(pf&&pf.hold&&pf.hold!==f.hold) lanes.push([pf.pos[pf.hold],h]);
    const nf=frames[i+1]; if(nf&&nf.hold&&nf.hold!==f.hold) lanes.push([h,nf.pos[nf.hold]]);
    if(nf&&nf.lead) lanes.push([h,nf.ball]);
    const blocks=lanes.some(([a,b])=>{ const [d,along]=sd(a,b,np), L=Math.hypot(b[0]-a[0],b[1]-a[1]); return d<1.2&&along>1&&along<L-.8; });
    const crowds=Object.entries(f.pos).some(([id,o])=>id!==k&&id!==f.hold&&Math.hypot(o[0]-np[0],o[1]-np[1])<1);
    if(!blocks&&!crowds) f.pos[k]=np.map(v=>+v.toFixed(2));
  });
  return frames;
}

function demoAttack(sc,frames){ if(sc.att) return sc.att;   // (a lesson: always our attack, even in a scene where the other team keeps the ball)

// ---------- 🔊 音声: the scene's words read out by the browser's own voice (no files, works offline) ----------
const TTS=window.speechSynthesis||null;
// position names as a Japanese voice should say them
// (said with their Japanese names: the letters read out one by one were hard to catch, e.g. CH sounded like 新聞紙)
const SAY=[["GK","ゴールキーパー"],["CB","センターバック"],["SB","サイドバック"],["CH","センターハーフ"],["SH","サイドハーフ"],["CF","センターフォワード"],["FW","フォワード"],["DF","ディフェンダー"],["MF","ミッドフィルダー"],["LH","左ハーフ"],["RH","右ハーフ"],["LB","左バック"],["RB","右バック"],["DM","ボランチ"],["→","、"],["＋","と"]];
// 間 is あいだ here (not かん), except in 時間・瞬間・仲間
// (each fix below was found by reading every scene with the Mac's Kyoko voice and transcribing it back with Whisper)
const SAY2=[["バックパス","後ろへのパス"],["こぼれ球","こぼれだま"],["ターンして","くるっと回って"],["ターンした","くるっと回った"],["ターンしない","くるっと回らない"],["ターン","くるっと回る"],["復帰","戻れる"],["＝","は"]];
const voiceText=t=>SAY2.reduce((a,[k,v])=>a.split(k).join(v),SAY.reduce((a,[k,v])=>a.split(k).join(v),String(t||"")))
  .replace(/[（）「」()・]/g,"、").replace(/人\s*対\s*/g,"人、たい、")                                // brackets are a pause; 3人 対 was heard as 忍耐
  .replace(/(^|[、。！\s])間/g,"$1すきま")                                                // あいだ at the start of a phrase was heard as 缶
  .replace(/(?<![時瞬仲])間/g,"あいだ")
  .replace(/(?<![実国交])際/g,"ぎわ")                                                    // タッチライン際 was read as 祭
  .replace(/(?<![以案海国])外(?![すれしさ])/g,"そと")                                    // 外へ出て was read as がいへ (but 外す・外れる stay)
  .replace(/(\d)\s?m(?![a-zA-Z])/g,"$1メートル")
  .replace(/①/g,"ひとつめ、").replace(/②/g,"ふたつめ、").replace(/③/g,"みっつめ、")              // ③先に was heard as サンさきに
  .replace(/の方([へにを])/g,"のほう$1")                                                      // ボールの方へ was heard as 肩へ                                             // 2m → 2メートル
  .replace(/(?<![0-9０-９])1人(?!目)/g,"ひとり").replace(/(?<![0-9０-９])2人(?!目)/g,"ふたり");   // (1人 was heard as 一人目)
function jaVoice(){ if(!TTS) return null; const vs=TTS.getVoices().filter(v=>/^ja/i.test(v.lang)); return vs.find(v=>/Kyoko|O-ren|Google|Siri|Nanami|Haruka/i.test(v.name))||vs[0]||null; }
// speak a scene; when it has been said, the playback may go on (DM.saidDone / DM.waitSaid)
function speakCap(text){
  DM.saidDone=true; if(!DM.voice||!TTS||!text) return;
  const id=DM.sayId=(DM.sayId||0)+1; if(TTS.speaking||TTS.pending){ TTS.cancel(); DM.cancelAt=performance.now(); } DM.saidDone=false;
  const u=new SpeechSynthesisUtterance(voiceText(text)); u.lang="ja-JP"; u.rate=DM.slow?.95:1.15; const v=jaVoice(); if(v) u.voice=v;
  // (only this scene's words count: stopping the previous one must not let the playback go on)
  let fin=false; const done=()=>{ if(fin||id!==DM.sayId) return; fin=true; DM.saidDone=true; const w=DM.waitSaid; DM.waitSaid=null; if(w) w(); };
  u.onend=done; u.onerror=done;
  // (never wait for ever: some browsers never say the words are over — about as long as the words take, then go on;
  //  and if the voice has stopped (or never started) for a moment, it is over)
  const said=voiceText(text), t0=performance.now(), most=Math.min(14000,2500+said.length*(DM.slow?190:150));
  const watch=setInterval(()=>{ if(fin||id!==DM.sayId){ clearInterval(watch); return; }
    const t=performance.now()-t0; if(t>most||(t>1500&&!TTS.speaking&&!TTS.pending)){ clearInterval(watch); done(); } },400);
  // (phones drop words spoken right after cancel(): wait a moment after a cancel)
  const wait=250-(performance.now()-(DM.cancelAt||0)); if(wait>0) setTimeout(()=>{ if(id===DM.sayId) TTS.speak(u); },wait); else TTS.speak(u);
}
function stopSpeak(){ DM.sayId=(DM.sayId||0)+1; if(TTS&&(TTS.speaking||TTS.pending)){ TTS.cancel(); DM.cancelAt=performance.now(); } DM.saidDone=true; DM.waitSaid=null; }

function lessonChapters(L){

  if(L.from) return L.chapters=L.from.map(([id,t,k])=>({...lessonChapters(LESSONS[id])[k||0],t}));   // ([id, title, which chapter of it])

  const main=st.filter(x=>x.part!=="よくある失敗"), bad=st.filter(x=>x.part==="よくある失敗").map(x=>({...x,part:"ダメな例"}));
  if(bad.length&&cut>0) bad[0]={...bad[0],mv:{...Object.fromEntries(Object.entries(L.sc.players).map(([k,p])=>[k,p.p])),...(bad[0].mv||{})}};

// ---------- Recording a custom drill's movement ----------
var REC={id:null, steps:[], players:null, keep:null, pick:false};   // (var: the board is drawn before this line runs)
// in a drill being recorded, is this board player left out?
const recOff=(side,i)=>!!(REC.id&&REC.keep&&!REC.keep[side].has(i));
function pickRecPlayers(dr){
  const nm=dr.nm??8, no=dr.no??8, d=(side,i)=>Math.hypot(S.pos[side][i][0]-S.ball[0],S.pos[side][i][1]-S.ball[1]);
  const pick=(side,n)=>{ const roles=F[S[side]].roles, ids=roles.map((r,i)=>i);
    // field players first (nearest to the ball); the keeper only when everyone is wanted
    ids.sort((a,b)=>((roles[a]==="GK")-(roles[b]==="GK"))||d(side,a)-d(side,b)); return new Set(ids.slice(0,n)); };

function markRecOff(){ ["mine","opp"].forEach(side=>document.querySelectorAll(`#${side==="mine"?"mineLayer":"oppLayer"} .player`).forEach(g=>g.classList.toggle("recoff",recOff(side,+g.dataset.i)))); }

  const players={}, pos={};

// mine: own goal at y=68. Returns screen positions for both teams + ball + a short note.
function setPieceLayout(kind){
  const cm=teamSetup(S.mine,25).cls, co=teamSetup(S.opp,25).cls;
  const outfield=c=>c.map((x,i)=>i).filter(i=>i>0);
  const mine=Array(8), opp=Array(8);
  mine[0]=[25,66.5]; opp[0]=[25,1.5];
  const isDF=c=>["CD","SD","FB"].includes(c);
  if(kind==="ckDef"||kind==="fkDef"){
    // attackers (opp, attacking down toward y=68)
    const ball = kind==="ckDef" ? [49.3,67.4] : [23,47];
    const atkSpots = kind==="ckDef"
      ? [[48.6,66.6],[27.5,59.5],[22,58.5],[31,57],[18.5,61.5],[26,52],[22,34]]       // kicker, 4 in the box, edge, 1 back
      : [[23.5,46.5],[26.5,46],[19,57.5],[31,57.5],[25,59],[35,52],[25,34]];           // kicker, 2nd, 3 on the line, wide, 1 back
    outfield(co).forEach((i,k)=>opp[i]=atkSpots[k]);
    // defenders (mine)
    const ids=outfield(cm), st=ids.filter(i=>cm[i]==="ST"), rest=ids.filter(i=>cm[i]!=="ST");
    rest.sort((a,b)=>(isDF(cm[b])?1:0)-(isDF(cm[a])?1:0));                             // defenders first
    let spots;
    if(kind==="ckDef"){
      const threats=[[27.5,59.5],[22,58.5],[31,57],[18.5,61.5]].map(([x,y])=>[x,y+1.6]);  // goal side of the runners
      spots=[[30.5,63],[25,62],...threats,[25,53.5]];      // ストーン(near post), centre zone, man-markers, edge of the box
    } else {
      spots=[[22.5,53.5],[24,53.5],[20.5,59],[30.5,59],[25,60.5],[34,53.5],[27,55]];   // 2-man wall, markers on the runners, wide, second ball
    }
    rest.forEach((i,k)=>mine[i]=spots[Math.min(k,spots.length-1)]);
    st.forEach((i,k)=>mine[i]=[25+(k?6:0),38]);                                          // forward stays up for the counter
    const note = kind==="ckDef"
      ? "相手のコーナーキック：ニアにストーン1人、ゴール前の真ん中に1人、ほかは相手の前（ゴール側）でマーク。エリアの外にこぼれ球係。FWは前に残ってカウンターの準備。競り合いは相手より先に跳ぶ"
      : "相手のフリーキック：壁は2人（ボールとニアポストを結ぶ線上）。ほかは走り込む相手のゴール側に立つ。こぼれ球係を1人。8人制は相手との距離7m";
    return {mine,opp,ball,note};
  }
  // kick-off: base shape, each team in its own half and the defending team outside the centre circle (7m)
  const mineKick = kind==="koMine";
  const place=(fid,cls,arr,own)=>{               // own: "bottom" (mine) or "top" (opp)
    const base=F[fid].base;
    outfield(cls).forEach(i=>{ let [x,y]=base[i]; if(own==="top"){ x=50-x; y=68-y; }
      y = own==="bottom" ? Math.max(y,35.5) : Math.min(y,32.5);
      arr[i]=[x,y]; });
  };
  place(S.mine,cm,mine,"bottom"); place(S.opp,co,opp,"top");
  const kicker=(cls,arr,own)=>{ const ids=outfield(cls), st=ids.filter(i=>cls[i]==="ST"), mid=ids.filter(i=>["PV","IM","AM","CM"].includes(cls[i]));
    const k=st[0]??mid[0]??ids[ids.length-1], sup=st[1]??mid[0]??ids[ids.length-2];
    arr[k]=[25,own==="bottom"?34.3:33.7]; if(sup!==k) arr[sup]=[27.5,own==="bottom"?36:32]; return k; };
  const pushOut=(arr,own,skip)=>arr.forEach((p,i)=>{ if(i===0||i===skip) return; const dx=p[0]-25, dy=p[1]-34, r=Math.hypot(dx,dy); if(r<7.5){ const s=7.5/(r||1); p[0]=25+dx*s; p[1]=own==="bottom"?Math.max(34+Math.abs(dy*s),35.5):Math.min(34-Math.abs(dy*s),32.5); } });
  let kMine=-1,kOpp=-1;
  if(mineKick){ kMine=kicker(cm,mine,"bottom"); pushOut(opp,"top",-1); } else { kOpp=kicker(co,opp,"top"); pushOut(mine,"bottom",-1); }
  // keep team-mates apart and in their own half
  [[mine,"bottom",kMine],[opp,"top",kOpp]].forEach(([arr,own,k])=>{ spread(arr,[0,k].filter(i=>i>=0),4);
    arr.forEach((p,i)=>{ if(i===0||i===k) return; p[0]=clamp(p[0],2,48); p[1]= own==="bottom"?clamp(p[1],35.5,66):clamp(p[1],2,32.5);
      if(i!==k && Math.hypot(p[0]-25,p[1]-34)<7.5 && (own==="bottom"?!mineKick:mineKick)) p[0]=p[0]<25?17:33; }); });
  const ball=[25,34];
  const note = mineKick
    ? "キックオフ（自チーム）：最初の1本をどうするか決めておく。①後ろに下げてGK・CBからつなぐ ②相手のSBの裏へ蹴って押し込む。ペンで矢印を書いて約束にしよう"
    : "キックオフ（相手）：FWはボールと相手CBの間に立って前へのパスを切る。全員がすぐ自分の場所へ。相手の最初のロングボールに備えて、DFは少し下がって始める";
  return {mine,opp,ball,note};
}

  const L=setPieceLayout(kind);

<script>/* CLIP3D BEGIN: copied from app/drill/clip3d.js by build.py, do not edit here */

// ===== CLIP3D: the shared 3D clip engine =====
// Used by 3D解説 (explain3d.js), 戦術ドリル「3Dで見る」(view3d.js) and MAESTRO BOARD 局面の切り替え (tactics-board.html, B3D).
// The board is one hand-written file, so it keeps a copy of this file between the CLIP3D markers; build.py and
// build-explain.py write it there. Edit this file only.
//   voice:  VOICE (above CLIP3D) reads each step aloud; player.voice = false turns it off for one player
//   look:   pitchTexture, label, makePlayer (arms and legs that swing), arrow, disc, makeBall, addPitch
//   motion: run (move a player, face the way they go, swing arms and legs)
//   clips:  plan (a drill question → the steps じょうきょう → もんだい → ◎ → ○ → ✕ → ポイント), pose (where everyone is),
//           player (plays a clip in any three.js scene), fitBox / eyeCam (the cameras)
// ===== VOICE: reads the captions aloud (the browser's own Japanese voice; no files, no account) =====
// On by default; the 🔊 button turns it off and the choice is kept. A clip step waits until its words are read.
const VOICE = (() => {
  const ok = typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
  let on = (() => { try{ return localStorage.getItem("voice_on") !== "0"; }catch(e){ return true; } })(), voice = null, talking = false, unlocked = false;
  // the nicest Japanese voice the device has
  const pick = () => { if (!ok) return; const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)); if (!vs.length) return;
    const pref = [/Kyoko.*(Enhanced|Premium)/i, /O-ren.*(Enhanced|Premium)/i, /Google/i, /Nanami/i, /Kyoko/i, /O-ren/i];
    voice = pref.map(r => vs.find(v => r.test(v.name))).find(Boolean) || vs[0]; };
  if (ok){ pick(); speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", pick) : (speechSynthesis.onvoiceschanged = pick); }
  // phones only let a page talk after a tap, and only from inside the tap itself (iPhone: touchend / click, not
  // pointerdown): say one silent word on the first real tap; from then on the page may talk by itself
  const unlock = () => { if (unlocked || !ok) return; unlocked = true; try{ const u = new SpeechSynthesisUtterance("あ"); u.lang = "ja-JP"; u.volume = 0; speechSynthesis.speak(u); }catch(e){} };
  if (ok) for (const ev of ["touchend", "click", "keydown"]) addEventListener(ev, unlock, {capture:true});
  // position names as a Japanese voice should say them (the same words as MAESTRO BOARD's 練習メニュー voice:
  // letters read one by one were hard to catch, e.g. CH sounded like 新聞紙), and words the voice misreads

      fan.visible = true; fan.position.copy(W(p[0], p[1], .03)); fan.rotation.y = yaw;
      // name tags: smaller in the player view, and hidden when someone is right in front of the eyes
      players.mine.concat(players.opp).forEach(g => { const d = g.position.distanceTo(eye); g.userData.lab.visible = true; eyeTag(g.userData.lab, d); });
      const role = F[S.mine].roles[i];
      setNote(`<b>PLAYER VIEW</b>${role} の目線・左右にドラッグで首をふる`);
    }
    cam.updateProjectionMatrix(); renderer.render(scene, cam); raf = requestAnimationFrame(frame);
  }
  // ---------- 局面の切り替え (HOME / AWAY ボール保持, GK, セットプレー): everyone runs to the new places, with captions ----------
  // phaseShift() is called just before the board moves the players (S.pos); the 3D keeps them where they were and runs
  // them over SHIFT seconds. The caption: what the new 局面 is (the board's own hint), and per player of ours where they go.
  const SHIFT = 2.4, HOLD = 4;
  let shift = null;
  function phaseShift(title){
    if (view === "top" || !renderer || (typeof DM !== "undefined" && DM.id)) return;
    const from = {}; for (const side of ["mine","opp"]) from[side] = players[side].map(g => g.userData.placed ? [g.position.x + 25, g.position.z + 34] : null);
    if (shift) shift.el.remove();
    const el = document.createElement("div"); el.className = "v3phase"; el.setAttribute("aria-live", "polite"); wrap.append(el);
    shift = {t:0, from, title, el, arrows:new THREE.Group(), key:""}; scene.add(shift.arrows);
  }
  // where one of ours goes, in a few words: forward / back (towards the goal we attack = y 0), out wide / in
  function moveWords(a, b){
    const fwd = a[1] - b[1], wide = Math.abs(b[0] - 25) - Math.abs(a[0] - 25), w = [];
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 2) return "そのまま";
    if (fwd > 3) w.push(`前へ${Math.round(fwd)}m`); else if (fwd < -3) w.push(`下がる${Math.round(-fwd)}m`);
    if (wide > 2.5) w.push("外へ広がる"); else if (wide < -2.5) w.push("中へしぼる");
    if (!w.length) w.push(b[0] > a[0] ? "右へ" : "左へ");
    return w.join("・");
  }
  function shiftStep(dt){
    const s = shift; s.t += dt;
    // (the board sets the new places on its next frame: the words and the arrows follow them until the run is under way)
    if (s.t < .8){
      const roles = F[S.mine].roles, rows = [];
      while (s.arrows.children.length) s.arrows.remove(s.arrows.children[0]);
      roles.forEach((r, i) => { const a = s.from.mine[i], b = S.pos.mine[i]; if (!a || !b || recOff("mine", i)) return;
        const tag = players.mine[i] ? players.mine[i].userData.text : r;
        rows.push(`<li><b>${esc(String(tag))}</b>${tag !== r ? `<small>${esc(r)}</small>` : ""}${esc(moveWords(a, b))}</li>`);
        if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 2) s.arrows.add(CLIP3D.arrow(a, b, "#ff7a3c", false, .55)); });
      const hint = (document.getElementById("autoHint").textContent || "").split("　")[0].replace(/^自チーム：/, "");
      const html = `<div class="ph"><span class="k">局面</span><b>${esc(s.title)}</b></div>${hint ? `<p>${esc(hint)}</p>` : ""}<ul>${rows.join("")}</ul>`;
      if (html !== s.key){ s.key = html; s.el.innerHTML = html; }
    }
    s.arrows.children.forEach(a => a.traverse(m => { if (m.material) m.material.opacity = .55*(1 - CLIP3D.clamp((s.t - SHIFT)/1.2)); }));
    // read the 局面 aloud once the board has set the new places (the title and the board's hint, not every player)
    if (s.t >= .8 && !s.said){ s.said = true; const hint = (document.getElementById("autoHint").textContent || "").split("　")[0].replace(/^自チーム：/, ""); VOICE.speak(`局面、${s.title}。${hint}`); }
    if (s.t > SHIFT + HOLD){ s.el.remove(); scene.remove(s.arrows); shift = null; }
  }
  function pickBar(){
    const bar = document.getElementById("eyePick"); bar.hidden = view !== "eye"; if (view !== "eye") return;
    if (demo.id){ const mine = demo.list.filter(g => g.userData.t === "m"), pool = mine.length ? mine : demo.list, cur = (pool.find(x => x.userData.pid === demo.eye) || pool[0] || {userData:{}}).userData.pid;
      bar.innerHTML = pool.map(g => `<button data-deye="${esc(g.userData.pid)}" aria-pressed="${g.userData.pid === cur}">${esc(String(g.userData.tag))}</button>`).join(""); return; }
    const roles = F[S.mine].roles, h = holder(), cur = eyeIdx ?? (h && h.side === "mine" ? h.i : 0);
    bar.innerHTML = roles.map((r,i) => `<button data-eye="${i}" aria-pressed="${i === cur}">${r}</button>`).join("");
  }
  function setView(v){
    view = v; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
    const tr = document.querySelector(".hud b.tr"); if (tr) tr.textContent = {top:"TOP VIEW", tv:"3D VIEW", eye:"PLAYER VIEW"}[v];   // the label on the pitch frame
    if (v !== "top" && !renderer) init();
    document.body.classList.toggle("view3d-on", v !== "top"); if (wrap){ wrap.hidden = v === "top"; place(); }
    const lb = document.getElementById("laneBtn"); lb.hidden = v === "top"; lb.setAttribute("aria-pressed", showLanes);
    const vb = document.getElementById("voiceBtn"); vb.hidden = v === "top" || !VOICE.ok; if (!vb.hidden){ vb.textContent = VOICE.on ? "🔊" : "🔇"; vb.setAttribute("aria-pressed", VOICE.on); }
    orbit.eyeYaw = 0; pickBar(); if (v !== "top" && !raf) raf = requestAnimationFrame(frame);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (b){ setView(b.dataset.view); return; }
    if (e.target.closest("#laneBtn")){ showLanes = !showLanes; document.getElementById("laneBtn").setAttribute("aria-pressed", showLanes); return; }
    const k = e.target.closest("[data-eye]"); if (k){ eyeIdx = +k.dataset.eye; orbit.eyeYaw = 0; pickBar(); }
    const dk = e.target.closest("[data-deye]"); if (dk){ demo.eye = dk.dataset.deye; orbit.eyeYaw = 0; pickBar(); }
  });
  // which goal the drill attacks: the side of whoever has the ball most (HOME attacks y=0, AWAY y=68)
  function demoGoal(){ const at = demoAttack(DM.sc, DM.frames); return at ? at.goal : 0; }
  // start from behind the attackers, a little to the side, looking down at about 45°, so the goal they attack is in the picture
  function demoStart(){ orbit.yaw = demoGoal() === 68 ? Math.PI + .32 : .32; orbit.pitch = .82; orbit.zoom = 1; orbit.dkey = null; if (view === "top") setView("tv"); }
  function setEye(pid){ if (demo.eye !== pid){ demo.eye = pid; orbit.eyeYaw = 0; pickBar(); } }
  return {setView, demoStart, phaseShift, setEye};
})();
</script>
<script>
// ===== MAESTRO BOARD: English kickers, the HUD over the pitch, the code rain =====
(() => {
  const EN = {"ボール保持":"POSSESSION", "守り方":"PRESSING", "セットプレー":"SET PIECE", "自チームの局面":"PHASE",
    "自チーム":"HOME", "相手":"AWAY", "学年":"GRADE", "相性分析":"MATCHUP", "自チームの戦術":"GAME PLAN", "相手の特徴":"SCOUTING", "プレー原則":"PRINCIPLES",
    "ポジション":"POSITIONS", "選手":"SQUAD", "練習メニュー":"DRILLS", "保存した配置":"SAVED", "パスコース":"PASS LANES", "動かす":"MOVE", "矢印を書く":"DRAW", "実線":"SOLID", "点線":"DASH",
    "基本":"BASE", "攻撃時":"ATTACK", "守備時":"DEFEND", "前から行く":"HIGH", "ふつう":"MID", "引いて守る":"LOW", "近い方":"NEAREST"};
  const clean = s => s.replace(/[✋✏️―┄⛶\s]/g, ""), map = {}; for (const k in EN) map[clean(k)] = EN[k];
  const label = () => document.querySelectorAll(".label, button, label").forEach(el => {
    if (el.closest("#scorebar") || el.closest("svg")) return; const en = map[clean(el.textContent)]; if (en && el.dataset.en !== en) el.dataset.en = en; });
  let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(label, 60); }).observe(document.body, {childList:true, subtree:true}); label();
  // HUD frame over the pitch
  const svg = document.querySelector("svg.pitch"); if (svg) { const host = svg.parentElement;
    const hud = document.createElement("div"); hud.className = "hud"; hud.setAttribute("aria-hidden", "true");
    hud.append(Object.assign(document.createElement("div"), {className:"grid"}), Object.assign(document.createElement("div"), {className:"scan"}));
    for (let i = 0; i < 4; i++) hud.append(document.createElement("i"));
    for (const [c, txt] of [["tl","PITCH 68 × 50 M"],["tr","TOP VIEW"],["bl","▲ ATTACK"]]) { const b = document.createElement("b"); b.className = c; b.textContent = txt; hud.append(b); }
    if (getComputedStyle(host).position === "static") host.style.position = "relative"; host.append(hud);
    // the frame is as wide as the board (like the 3D box) and as tall as the pitch; the pitch itself keeps its size
    const place = () => { const p = svg.getBoundingClientRect(), h = host.getBoundingClientRect(), cs = getComputedStyle(host), pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
      const r = {left:h.left + pl, top:p.top, width:h.width - pl - pr, height:p.height}; Object.assign(hud.style, {left:(r.left-h.left)+"px", top:(r.top-h.top)+"px", width:r.width+"px", height:r.height+"px"}); };
    place(); addEventListener("resize", place); new ResizeObserver(place).observe(svg); setInterval(place, 400); }
  // code rain, very faint, far behind (stops when the tab is hidden; off for reduced motion)
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const c = document.createElement("canvas"); c.id = "digi-rain"; c.setAttribute("aria-hidden", "true"); document.body.prepend(c);
    const x = c.getContext("2d"), chars = "0123456789ABCDEF<>/+=-".split(""); let cols = [];
    const fit = () => { c.width = innerWidth; c.height = innerHeight; cols = Array(Math.ceil(c.width/18)).fill(0).map(() => Math.random()*c.height/18|0); };
    fit(); addEventListener("resize", fit);
    setInterval(() => { if (document.hidden) return; x.fillStyle = "rgba(3,10,7,.14)"; x.fillRect(0,0,c.width,c.height); x.fillStyle = "#4dffa6"; x.font = '13px "Chakra Petch", monospace';
      cols.forEach((y, i) => { x.fillText(chars[Math.random()*chars.length|0], i*18, y*18); cols[i] = y*18 > c.height && Math.random() > .975 ? 0 : y + 1; }); }, 80);
  }
})();
</script>
