<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1310">

<title>自主練メニュー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 3D example player for the 自主練メニュー (three.js r128). One renderer is kept for the whole app; the practice screen
// calls FIG3D.show(container, drillId) and the canvas moves into it. A muscular, faceless figure in compression wear is
// built from turned (lathe) shapes; joints are placed every frame, knees/elbows come from 2-bone IK.
// Units: metres (about 1.78 m tall). The figure faces +z; x is its right side when seen from behind.
// Rules for every move: the boots never go inside the ball (keepOut), the foot only comes to the ball from outside,
// and every curve eases in and out (ss) so nothing jumps.
const FIG3D = (() => {
  if(!window.THREE) return {has: () => false, show(){}, hide(){}};
  const V = (x,y,z) => new THREE.Vector3(x,y,z);
  const ss = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
  const BALL_R = .11, GINGA_BPM = 128;

  // ---------- renderer, scene, lights ----------
  let renderer = null, scene, camera, fig, ball, parts = {}, props, ground, glowMat = {}, marks = {};
  function init(){
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.domElement.style.cssText = "display:block;width:100%;height:100%;touch-action:none;cursor:grab";
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a3832).convertSRGBToLinear();
    camera = new THREE.PerspectiveCamera(32, 1, .1, 50);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3a30, .55));
    const key = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set(3.3, 5.2, 3.9); key.castShadow = true;
    key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera, {left:-7,right:7,top:8,bottom:-4, far:30}); key.shadow.camera.updateProjectionMatrix(); scene.add(key);   // big enough for the dribbling courses
    const rim = new THREE.DirectionalLight(0xbfd8ff, .7); rim.position.set(-2.5, 2.2, -2.5); scene.add(rim);
    const fill = new THREE.DirectionalLight(0xffffff, .25); fill.position.set(-2, 1, 2); scene.add(fill);
    ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({color:new THREE.Color(0x2f6b48).convertSRGBToLinear(), roughness:.95}));
    ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
    // three.js is right-handed: for a figure facing +z, its own right side is −x. The moves are written with +x as the
    // player's right (as seen from behind), so the figure and everything on the ground sit in a mirrored group —
    // then 右足 in a move really is the right foot on screen. (three.js flips the face winding for mirrored objects.)
    const mirror = new THREE.Group(); mirror.scale.x = -1; scene.add(mirror);
    props = new THREE.Group(); mirror.add(props);
    fig = new THREE.Group(); mirror.add(fig);
    build();
    // drag to orbit
    const el = renderer.domElement; let drag = null;
    el.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, yaw:cam.yaw, pitch:cam.pitch}; el.setPointerCapture(e.pointerId); el.style.cursor = "grabbing"; });
    el.addEventListener("pointermove", e => { if(!drag) return; cam.yaw = drag.yaw - (e.clientX-drag.x)*.01; cam.pitch = Math.max(-.05, Math.min(.9, drag.pitch + (e.clientY-drag.y)*.006)); });
    addEventListener("pointerup", () => { drag = null; el.style.cursor = "grab"; });
  }

  // ---------- the figure ----------
  const M = c => { const m = new THREE.MeshStandardMaterial(c); m.color.convertSRGBToLinear(); return m; };
  let skin, bootMat, soleMat, studMat, shirtMat, shortsMat, hemMat;
  const L = {thigh:.44, shin:.43, upper:.29, fore:.26};
  const P = {
    thigh:[[0,.094],[.12,.1],[.3,.096],[.55,.084],[.8,.064],[1,.056]],
    shin: [[0,.054],[.08,.06],[.25,.069],[.42,.062],[.7,.041],[1,.031]],
    upper:[[0,.054],[.2,.05],[.5,.055],[.75,.046],[1,.038]],
    fore: [[0,.04],[.18,.047],[.4,.042],[.75,.032],[1,.027]]
  };
  function lathe(profile, len, sx=1, sz=1, mat=skin){
    const pts = profile.map(([t,r]) => new THREE.Vector2(r, t*len));
    pts.unshift(new THREE.Vector2(.0001, -profile[0][1]*.6)); pts.push(new THREE.Vector2(.0001, len + profile[profile.length-1][1]*.6));
    const g = new THREE.LatheGeometry(pts, 28); g.scale(sx, 1, sz); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; fig.add(m); m.userData.len = len; return m;
  }
  const UP = V(0,1,0), ZAX = V(0,0,1);
  function place(m, a, b){ const d = new THREE.Vector3().subVectors(b, a), l = d.length(); m.position.copy(a); m.quaternion.setFromUnitVectors(UP, d.normalize()); m.scale.set(1, l / m.userData.len, 1); }
  function blob(r, sx, sy, sz, mat=skin){ const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), mat); m.scale.set(sx,sy,sz); m.castShadow = true; fig.add(m); return m; }
  const ring = mat => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, .09, 8, 28), mat); fig.add(m); return m; };
  function hem(m, p, dir, r){ m.position.copy(p); m.quaternion.setFromUnitVectors(ZAX, dir.clone().normalize()); m.scale.set(r, r, r*1.4); }
  const sleeveOf = (prof, to, add=.006) => { const out = prof.filter(([t])=>t<to).map(([t,r])=>[t/to, r+add]); const n = prof.findIndex(([t])=>t>=to);
    const [t1,r1] = prof[n-1], [t2,r2] = prof[n]; out.push([1, r1+(r2-r1)*(to-t1)/(t2-t1)+add]); return out; };
  // a football boot (local: ankle at the origin, toe towards +z): a sole shaped like a foot (narrow heel, wide forefoot,
  // round toe), no studs, an upper whose underside sits flat on the sole and whose toe springs up a little
  function makeBoot(bootMat){
    const g = new THREE.Group();
    // the outline seen from below: [z, half-width] from heel to toe
    const W = [[-.07,.022],[-.062,.034],[-.04,.037],[-.005,.034],[.03,.039],[.08,.048],[.12,.047],[.15,.039],[.168,.024],[.177,0]];   // a touch wider than the upper, like a real outsole
    const shape = new THREE.Shape();
    shape.moveTo(0, W[0][0]); W.forEach(([z,w]) => shape.lineTo(w, z)); for(let i=W.length-2;i>=0;i--) shape.lineTo(-W[i][1], W[i][0]);
    const soleG = new THREE.ExtrudeGeometry(shape, {depth:.007, bevelEnabled:true, bevelThickness:.002, bevelSize:.002, bevelSegments:2, curveSegments:6});
    soleG.rotateX(Math.PI/2);                                       // shape y → boot z, thickness goes down
    // toe spring: the front of the sole bends up a little
    const pos = soleG.attributes.position; for(let i=0;i<pos.count;i++){ const z = pos.getZ(i); if(z > .11) pos.setY(i, pos.getY(i) + (z - .11)*.18); }
    soleG.computeVertexNormals();
    const sole = new THREE.Mesh(soleG, soleMat); sole.position.y = -.014; sole.castShadow = true; g.add(sole);   // right under the upper, no gap
    // the upper: an egg shape flattened underneath, narrower at the heel, toe springing up with the sole
    const upG = new THREE.SphereGeometry(1, 28, 18), up = upG.attributes.position;
    for(let i=0;i<up.count;i++){
      let x = up.getX(i)*.044, y = up.getY(i)*.072, z = up.getZ(i)*.122 + .055;
      if(y < 0) y *= .22;                                           // flat underneath, sitting on the sole
      if(z < .02) x *= .78 + .22*Math.max(0, (z + .07)/.09);         // narrower heel
      if(z > .11) y += (z - .11)*.18;                               // toe spring
      if(z > .1 && y > 0) y *= 1 - (z - .1)*3;                      // the toe box gets lower towards the tip
      up.setXYZ(i, x, y + .002, z);
    }
    upG.computeVertexNormals();
    const upper = new THREE.Mesh(upG, bootMat); upper.castShadow = true; g.add(upper);
    // the collar round the ankle
    const ank = new THREE.Mesh(new THREE.CylinderGeometry(.034, .041, .075, 18), bootMat); ank.position.set(0, .045, -.008); ank.castShadow = true; g.add(ank);
    return g;
  }
  function build(){
    skin = M({color:0xdfe5ea, metalness:.35, roughness:.22}); bootMat = M({color:0xff6b2c, metalness:.15, roughness:.38}); soleMat = M({color:0xc2410c, roughness:.5}); studMat = M({color:0xe8edf1, roughness:.4});
    shirtMat = M({color:0x2a3038, metalness:.05, roughness:.5}); shortsMat = M({color:0x1d2127, metalness:.05, roughness:.55}); hemMat = M({color:0xff6b2c, roughness:.5});
    for(const s of ["L","R"]){
      glowMat["thigh"+s] = skin.clone(); glowMat["boot"+s] = bootMat.clone();
      parts["thigh"+s] = lathe(P.thigh, L.thigh, 1, .92, glowMat["thigh"+s]); parts["shin"+s] = lathe(P.shin, L.shin, 1, .95);
      parts["upper"+s] = lathe(P.upper, L.upper); parts["fore"+s] = lathe(P.fore, L.fore, 1, .85);
      parts["delt"+s] = blob(.06, 1.05, .95, 1, shirtMat); parts["hand"+s] = blob(.042, .7, 1.15, .45);
      parts["glute"+s] = blob(.07, 1, .9, .5, shortsMat); parts["knee"+s] = blob(.052, 1, 1, 1);
      parts["sleeve"+s] = lathe(sleeveOf(P.upper, .45), L.upper*.45, 1, 1, shirtMat);
      parts["short"+s] = lathe(sleeveOf(P.thigh, .52), L.thigh*.52, 1, .92, shortsMat);
      parts["sleeveHem"+s] = ring(hemMat); parts["shortHem"+s] = ring(hemMat);
      const boot = makeBoot(glowMat["boot"+s]); fig.add(boot); parts["boot"+s] = boot;
    }
    const TORSO = [[0,.13],[.1,.14],[.28,.115],[.45,.125],[.62,.15],[.78,.166],[.88,.158],[.94,.125],[1,.06]];
    parts.torso = lathe(TORSO.map(([t,r])=>[t, r+.004]).filter(([t])=>t>=.28 && t<.9).map(([t,r])=>[(t-.26)/.64, r]).concat([[1,.14]]), .6*.64, 1.25, .66, shirtMat);
    parts.hips = lathe([[0,.134],[.35,.144],[.85,.12],[1,.118]], .6*.3, 1.25, .66, shortsMat);
    parts.waistband = ring(hemMat);
    parts.chestTop = lathe([[0,.14],[.45,.11],[1,.058]], .6*.16, 1.25, .66, shirtMat);
    parts.neck = lathe([[0,.055],[.5,.047],[1,.045]], .12);
    glowMat.head = skin.clone(); parts.head = blob(.105, .86, 1.14, .98, glowMat.head);
    // a dark visor across the eyes, so you can see which way the face is turned
    const visor = new THREE.Mesh(new THREE.SphereGeometry(.108, 24, 6, Math.PI/2 - .95, 1.9, 1.3, .36), M({color:0x161a1f, metalness:.4, roughness:.25}));
    parts.head.add(visor);
    // markers on the ground: the standing (plant) foot, and where the player is looking
    const yellow = c => new THREE.MeshBasicMaterial({color:new THREE.Color(c).convertSRGBToLinear(), transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide});
    marks.plant = new THREE.Mesh(new THREE.RingGeometry(.1, .135, 40), yellow(0xffd23d)); marks.plant.rotation.x = -Math.PI/2; fig.add(marks.plant);
    const fan = new THREE.BufferGeometry(), fp = [], N = 16, H = .32, RR = 2.2;
    for(let i=0;i<N;i++){ const a1 = -H + 2*H*i/N, a2 = -H + 2*H*(i+1)/N; fp.push(0,0,0, RR*Math.sin(a1),0,RR*Math.cos(a1), RR*Math.sin(a2),0,RR*Math.cos(a2)); }
    fan.setAttribute("position", new THREE.Float32BufferAttribute(fp, 3)); marks.look = new THREE.Mesh(fan, yellow(0xfff1b0)); fig.add(marks.look);
    const c = document.createElement("canvas"); c.width = 256; c.height = 128; const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0,0,256,128); x.fillStyle = "#111";
    for(let i=0;i<12;i++){ const px=(i%6)*44+(i>5?22:0)+10, py=i>5?88:34; x.beginPath(); for(let k=0;k<5;k++){ const a=k/5*Math.PI*2-Math.PI/2; x.lineTo(px+Math.cos(a)*12, py+Math.sin(a)*12); } x.fill(); }
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 28, 20), new THREE.MeshStandardMaterial({map:tex, roughness:.4})); ball.castShadow = true; fig.add(ball);
  }

  // ---------- joints ----------
  function ik(a, c, l1, l2, pole){
    const d = new THREE.Vector3().subVectors(c, a); let len = Math.min(d.length(), l1 + l2 - .001);
    const dir = d.clone().normalize(), x = (l1*l1 - l2*l2 + len*len) / (2*len), h = Math.sqrt(Math.max(0, l1*l1 - x*x));
    const side = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
    return a.clone().add(dir.multiplyScalar(x)).add(side.multiplyScalar(h));
  }
  const bootTilt = ankle => Math.min(.3, Math.max(0, ankle.y - .1) * 1.2);
  // points on the boot (relative to the ankle): sole/studs underneath, toe, sides and top of the upper
  const BOOT_PTS = [V(0,-.083,-.05), V(0,-.083,.02), V(0,-.083,.09), V(0,-.074,.15), V(0,-.04,.177), V(.042,-.075,.06), V(-.042,-.075,.06), V(0,.0,.1), V(.044,-.03,.04), V(-.044,-.03,.04), V(0,-.01,.14)];
  // move the ankle until no point of the boot is inside the ball
  // how a boot is turned (yaw: + turns the toe to the player's right) and tilted (+ toe down, − toe up), unless a move says:
  //  · standing: toes a little out, like people stand;  · lifted: toe a little down;
  //  · sole on top of the ball (tap, pull, stop, trap): toe up so the sole sits on the ball, not the toe digging in
  function footAngles(p, side, ft){
    const yaw = (side === "L" ? p.lfYaw : p.rfYaw) ?? (side === "L" ? -.13 : .13);
    let tilt = side === "L" ? p.lfTilt : p.rfTilt;
    if(tilt === undefined || tilt === null){
      tilt = bootTilt(ft);
      if(p.ball && !p.ballFree){
        const b = p.ball, dxz = Math.hypot(ft.x - b.x, ft.z - (b.z - .03));
        const sole = (1 - ss(.08, .17, dxz)) * ss(b.y + BALL_R*.5, b.y + BALL_R + .04, ft.y);
        tilt = tilt*(1 - sole) - .3*sole;
      }
    }
    return {yaw, tilt};
  }
  const bootQ = (ankle, yaw=0, tilt=null) => new THREE.Quaternion().setFromAxisAngle(UP, yaw).multiply(new THREE.Quaternion().setFromAxisAngle(V(1,0,0), tilt ?? bootTilt(ankle)));
  function keepOut(ankle, ballC, yaw=0, tilt=null){
    for(let k=0; k<6; k++){
      const q = bootQ(ankle, yaw, tilt); let worst = 0, push = null;
      for(const pt of BOOT_PTS){ const w = pt.clone().applyQuaternion(q).add(ankle), gap = BALL_R + .004 - w.distanceTo(ballC); if(gap > worst){ worst = gap; push = w.sub(ballC).normalize(); } }
      if(!push) break;
      // never push the foot down into the ground: move it sideways/back instead
      if(push.y < 0 && ankle.y + push.y*worst < .085){ push.y = 0; if(push.lengthSq() < 1e-6) push.set(0,0,-1); push.normalize(); }
      ankle.add(push.multiplyScalar(worst));
    }
    return ankle;
  }
  function setBody(p){
    const pel = p.pelvis, lean = p.lean || V(0,0,0), up = k => lean.clone().multiplyScalar(k);
    // twist: the upper body turned on the hips (opening up to receive); look: the head turned on top of that (scanning)
    const tw = p.twist || 0, look = p.look || 0, rot = v => v.clone().applyAxisAngle(UP, tw);
    const hipL = pel.clone().add(V(-.095,-.01,0)), hipR = pel.clone().add(V(.095,-.01,0));
    const shL = pel.clone().add(rot(V(-.195,.468,-.01))).add(up(1)), shR = pel.clone().add(rot(V(.195,.468,-.01))).add(up(1));
    const hand = h => tw ? pel.clone().add(rot(h.clone().sub(pel))) : h;
    for(const [s, hip, ft] of [["L",hipL,p.lf],["R",hipR,p.rf]]){
      const {yaw: fy, tilt: ftl} = footAngles(p, s, ft);
      const ankle = p.ball && !p.ballFree ? keepOut(ft.clone(), p.ball, fy, ftl) : ft.clone();
      const knee = ik(hip, ankle, L.thigh, L.shin, V(0,0,1));
      place(parts["thigh"+s], hip, knee); place(parts["shin"+s], knee, ankle);
      parts["knee"+s].position.copy(knee).add(V(0,0,.008));
      const se = hip.clone().lerp(knee, .52); place(parts["short"+s], hip, se); hem(parts["shortHem"+s], se, knee.clone().sub(hip), .084);
      // the boot turns about the ankle (as the collision points do); the sole just touches the ground when the ankle is at 0.085
      parts["boot"+s].rotation.set(ftl, fy, 0, "YXZ");
      parts["boot"+s].position.copy(ankle).add(V(0,-.06,0).applyEuler(parts["boot"+s].rotation));
    }
    for(const [s, sh, hd, sx] of [["L",shL,hand(p.lh),-1],["R",shR,hand(p.rh),1]]){
      const elb = ik(sh, hd, L.upper, L.fore, (p.armPole || V(sx*.4,0,-1)).clone().normalize());
      place(parts["upper"+s], sh, elb); place(parts["fore"+s], elb, hd);
      const se = sh.clone().lerp(elb, .45); place(parts["sleeve"+s], sh, se); hem(parts["sleeveHem"+s], se, elb.clone().sub(sh), .057);
      parts["delt"+s].position.copy(sh).add(V(-sx*.012,-.012,0));
      parts["hand"+s].position.copy(hd).add(new THREE.Vector3().subVectors(hd, elb).normalize().multiplyScalar(.045));
      parts["glute"+s].position.copy(pel).add(V(sx*.06,.03,-.03));
    }
    const tb = pel.clone().add(V(0,-.03,0));
    place(parts.hips, tb, tb.clone().add(V(0,.18,0)));
    place(parts.torso, tb.clone().add(V(0,.156,0)), tb.clone().add(V(0,.54,0)).add(up(1)));
    place(parts.chestTop, tb.clone().add(V(0,.504,0)).add(up(.95)), tb.clone().add(V(0,.6,0)).add(up(1.05)));
    const twQ = new THREE.Quaternion().setFromAxisAngle(UP, tw); parts.torso.quaternion.multiply(twQ); parts.chestTop.quaternion.multiply(twQ);
    parts.waistband.position.copy(tb).add(V(0,.162,0)); parts.waistband.rotation.set(Math.PI/2,0,0); parts.waistband.scale.set(.16, .0845, .14);
    place(parts.neck, pel.clone().add(V(0,.55,-.01)).add(up(1.05)), pel.clone().add(V(0,.66,-.005)).add(up(1.15)));
    parts.head.position.copy(pel).add(V(0,.75,.005)).add(up(1.25)); parts.head.rotation.set(0, tw + look, 0);
    // where the player is looking (only shown while the head is turned away from straight ahead)
    const lk = Math.abs(tw + look); marks.look.material.opacity = .32*ss(.3,.6,lk)*(p.marks === false ? 0 : 1);
    marks.look.position.set(pel.x, .012, pel.z); marks.look.rotation.set(0, tw + look, 0);
    // the standing foot while kicking: a yellow ring round it
    const pl = p.plant, pf = pl ? (pl.side === "L" ? p.lf : p.rf) : null;
    marks.plant.material.opacity = pf && p.marks !== false ? .95*ss(.3,.7,pl.k) : 0; if(pf) marks.plant.position.set(pf.x, .008, pf.z + .03);
    ball.visible = !!p.ball && (p.ballScale ?? 1) > .01; if(p.ball) ball.position.copy(p.ball);
    ball.scale.setScalar(p.ballScale ?? 1);                                 // a new ball "appears" after a long kick
    // the whole figure can turn (e.g. hopping around the ball): it turns about the point p.root.pivot
    const r = p.root || {}, yaw = r.yaw || 0;
    fig.rotation.set(r.pitch || 0, yaw, 0, "YXZ");                       // pitch: the whole body tilted (plank)
    if(r.pos) fig.position.copy(r.pos);                                    // moving drills: the figure's place on the ground
    else { const pivot = r.pivot || V(0,0,0); fig.position.copy(pivot).sub(pivot.clone().applyAxisAngle(UP, yaw)); }
  }

  // ---------- moves (local to the figure). Each returns pelvis, lean, feet (ankles), hands, ball ----------
  const STAND = {pelvis:V(0,.9,0), lf:V(-.13,.085,0), rf:V(.13,.085,0), lh:V(-.34,.88,.05), rh:V(.34,.88,.05)};
  const ballOnTop = (b, dx=0, dz=-.03) => V(b.x + dx, b.y + BALL_R + .055, b.z + dz);
  // a ball rolled across under the sole in 2-beat bars (roll on 1, both feet down on 2) — used by sole roll and ginga
  function rollBars(t, bpm, width, feetX, ballZ){
    const b = t*bpm/60, n = Math.floor(b), ph = b - n, within = n % 2, bar = Math.floor(n/2), side = bar % 2 ? -1 : 1;
    const roll = within === 0 ? ss(.18,.82,ph) : 1, bx = width*(-side + 2*side*roll), ball = V(bx, BALL_R, ballZ);
    const carry = within === 0 ? ss(0,.38,ph) * (1 - ss(.68,1,ph)) : 0;
    return {n, ph, side, ball, carry, top: V(bx, BALL_R*2 + .055, ballZ - .03)};
  }
  const MOVES = {
    // 足うらタッチ: the foot rises, moves over the ball, rests the sole on top, comes back; feet take turns
    t1: {view:"diag", f: t => { const ph = (t*1.2)%2, k = ph%1, right = ph<1;
      const arc = ss(0,.42,k) * (1-ss(.5,.92,k)), rise = ss(0,.3,k) * (1-ss(.62,1,k));
      const lift = (on, x) => on ? V(x*(1-.65*arc), .085 + rise*.215, arc*.145) : V(x, .085, 0);
      const sway = Math.sin(ph*Math.PI);

function fits(d, g, place, cone, wall){
  if(g<d.g[0] || g>d.g[1]) return false;
  if(!d.pl.includes(place)) return false;
  if(d.need.includes("cone") && !cone) return false;
  if(d.need.includes("wall") && !wall) return false;
  return true;
}
// today's menu: warm up with the body, then ginga + touch, then dribble / kick / wall, until the minutes are used
function makePlan(){
  const g = me().grade, ok = D.filter(d=>fits(d,g,S.place,S.cone,S.wall));
  const pick = cats => shuffle(ok.filter(d=>cats.includes(d.cat)));
  const order = [pick(["body"]), pick(["ginga"]), pick(["touch"]), pick(["dribble"]), pick(["kick","wall"]), pick(["touch"]), pick(["dribble","kick","wall"]), pick(["body"])];
  const plan = [], used = new Set(); let t = 0;
  for(const pool of order){
    const d = pool.find(x=>!used.has(x.id)); if(!d) continue;
    if(t + minsOf(d,g) > S.mins && plan.length >= 3) continue;
    plan.push(d.id); used.add(d.id); t += minsOf(d,g);
    if(t >= S.mins) break;
  }
  S.plan = {ids:plan, done:[]}; S.i = 0;
}

let AC = null;
function beep(f=880, ms=120, vol=.18){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.type="sine";
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+ms/1000);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+ms/1000);
  }catch(e){}
}

  <section class="card"><h2>${m+1}月の スタンプ</h2><div class="cal">${cal}</div></section>
  <section class="card"><h2>さいこう きろく</h2>
    ${recs.length?`<table><thead><tr><th>れんしゅう</th><th style="text-align:right">さいこう</th><th style="text-align:right">さいご</th></tr></thead><tbody>${recs.map(x=>`<tr><td>${esc(x.d.name)}</td><td class="n">${x.best}${x.d.rec==="hit"?"/10":""}</td><td class="n" style="color:var(--muted)">${x.last.n}${x.d.rec==="hit"?"/10":""}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">まだきろくがありません。リフティングやかべ当てで、回数を入れるとここにならびます。</p>`}
  </section>
  <p><button class="del" id="switch">ほかの人にかえる</button>　<button class="del" id="wipe">${esc(me().name)} のきろくを消す</button></p>`;
}

function render(){
  renderMe();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  document.getElementById("tabs").hidden = !me() || !!S.run;
  if(!me()){ view.innerHTML = renderWho(); return; }
  if(S.run){ view.innerHTML = renderRun(); if(document.getElementById("demo") && !animRAF) runAnim();
    const d3 = document.getElementById("demo3d"); if(d3) FIG3D.show(d3, d3.dataset.id); return; }
  if(typeof FIG3D !== "undefined") FIG3D.stopBeat();
  view.innerHTML = S.tab==="today" ? renderToday() : S.tab==="list" ? renderList() : renderLog();
}

// ---------- Timer ----------
let tick = null, beatT = null;
function stopTimers(){ clearInterval(tick); tick=null; clearInterval(beatT); beatT=null; }
// no rhythm sound (たけし: 音は入れなくていい); the timer cues (start, last 3 seconds, change feet) stay
function startBeat(){ clearInterval(beatT); }
function startRun(id){
  stopTimers();
  const d = DBY[id];
  S.run = {id, phase:"ready", set:1, left:secsOf(d,me().grade), rest:10, beat:!!d.beat, flash:""};
  render(); scrollTo({top:0});
}
function go(){
  const r = S.run, d = DBY[r.id], sec = secsOf(d,me().grade);
  r.phase = "go"; r.flash = ""; render(); startBeat();
  beep(1200,180); buzz(80);
  tick = setInterval(()=>{
    r.left--;
    if(d.side && r.left === Math.floor(sec/2)){ r.flash="足をかえて！"; beep(700,200); buzz([60,60,60]); setTimeout(()=>{ if(S.run===r){ r.flash=""; paintTimer(); } },1600); }
    if(r.left<=3 && r.left>0) beep(700,90);
    if(r.left<=0){
      clearInterval(tick); clearInterval(beatT); beep(1300,400); buzz([120,60,120]);
      if(r.set < d.sets){ r.phase="rest"; r.rest=10; render(); tick=setInterval(()=>{ r.rest--; if(r.rest<=0){ clearInterval(tick); r.set++; r.left=sec; go(); } else paintTimer(); },1000); }
      else { r.phase="record"; render(); const el=document.getElementById("recn"); if(el) el.focus(); }
      return;
    }
    paintTimer();
  },1000);
}
// update only the numbers, so the screen does not flicker every second
function paintTimer(){
  const r = S.run; if(!r) return;
  const d = DBY[r.id], full = r.phase==="rest" ? 10 : secsOf(d,me().grade), left = r.phase==="rest" ? r.rest : r.left;
  const num = document.getElementById("num"), sub = document.getElementById("sub"), ring = document.querySelector(".ring svg circle:last-child");
  if(!num){ render(); return; }
  num.textContent = left;
  const C = 2*Math.PI*54; ring.setAttribute("stroke-dashoffset", C*(1-left/full));
  sub.textContent = r.flash || (r.phase==="rest" ? "やすみ" : `${r.set}／${d.sets}セット`); sub.classList.toggle("flash", !!r.flash);
}
function finishRun(n){
  const r = S.run, d = DBY[r.id];
  DB.log.push({pid:me().id, id:d.id, at:Date.now(), secs:d.secs?secsOf(d,me().grade)*d.sets:0, ...(typeof n==="number"?{n}:{})});
  DB.log = DB.log.slice(-3000); save();
  stopTimers(); S.run = null;
  if(S.plan){
    if(!S.plan.done.includes(d.id)) S.plan.done.push(d.id);
    const next = S.plan.ids.findIndex(id=>!S.plan.done.includes(id));
    if(next>=0){ S.i = next; startRun(S.plan.ids[next]); return; }
    beep(990,150); setTimeout(()=>beep(1320,300),160);
  }
  render(); scrollTo({top:0});
}

// ---------- Events ----------
document.addEventListener("click", e=>{
  if(e.target.closest("#demo")){ animPaused = !animPaused; return; }
  const b3 = e.target.closest("[data-v3]"); if(b3){ FIG3D.view(b3.dataset.v3); return; }
  if(e.target.closest("#slow3d")){ const on = FIG3D.toggleSlow(); const b = e.target.closest("#slow3d"); b.setAttribute("aria-pressed", on); b.textContent = on ? "ふつう" : "スロー"; return; }
  if(e.target.closest("#pause3d")){ const p = FIG3D.togglePause(); e.target.closest("#pause3d").textContent = p ? "動かす" : "止める"; return; }
  if(e.target.closest("#beat3d")){ const on = FIG3D.toggleBeat(); e.target.closest("#beat3d").setAttribute("aria-pressed", on); return; }
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.pid){ DB.cur=t.dataset.pid; save(); S.plan=null; render(); return; }
  if(t.id==="who" || t.id==="switch"){ DB.cur=null; save(); S.plan=null; stopTimers(); S.run=null; render(); return; }
  if(t.dataset.place){ S.place=t.dataset.place; DB.set.place=S.place; save(); render(); return; }
  if(t.dataset.mins){ S.mins=+t.dataset.mins; DB.set.mins=S.mins; save(); render(); return; }
  if(t.dataset.cat){ S.catFilter=t.dataset.cat; render(); return; }
  if(t.id==="make" || t.id==="reroll"){ makePlan(); render(); return; }
  if(t.id==="replan"){ S.plan=null; render(); return; }
  if(t.dataset.go!=null){ S.i=+t.dataset.go; startRun(S.plan.ids[S.i]); return; }
  if(t.dataset.one){ S.plan=null; startRun(t.dataset.one); return; }
  if(t.id==="start"){ go(); return; }
  if(t.id==="pause"){ clearInterval(tick); clearInterval(beatT); S.run.phase="pause"; render(); return; }
  if(t.id==="resume"){ go(); return; }
  if(t.id==="skiprest"){ clearInterval(tick); S.run.set++; S.run.left=secsOf(DBY[S.run.id],me().grade); go(); return; }
  if(t.id==="finish"){ S.run.phase="record"; render(); return; }
  if(t.id==="saverec"){ const el=document.getElementById("recn"); const v = el && el.value!=="" ? Math.max(0, Math.round(+el.value)) : undefined; finishRun(Number.isFinite(v)?v:undefined); return; }
  if(t.id==="back"){ stopTimers(); S.run=null; render(); return; }
  if(t.id==="skip"){ stopTimers(); const id=S.run.id; S.run=null; const ids=S.plan.ids; const next=ids.findIndex((x,i)=>i>ids.indexOf(id) && !S.plan.done.includes(x)); if(next>=0){ S.i=next; startRun(ids[next]); } else render(); return; }
  if(t.id==="wipe"){ if(!confirm(`${me().name} のきろくを、すべて消します。元にはもどせません。消しますか？`)) return; const id=me().id; DB.log=DB.log.filter(l=>l.pid!==id); DB.players=DB.players.filter(p=>p.id!==id); DB.cur=null; save(); render(); return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="cone"){ S.cone=e.target.checked; DB.set.cone=S.cone; save(); }
  if(e.target.id==="wall"){ S.wall=e.target.checked; DB.set.wall=S.wall; save(); }
  if(e.target.id==="beat" && S.run){ S.run.beat=e.target.checked; if(S.run.phase==="go") startBeat(); else clearInterval(beatT); }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="addp") return; e.preventDefault();
  const name = document.getElementById("pname").value.trim().slice(0,16), grade = +document.getElementById("pgrade").value;
  if(!name) return;
  const p = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, grade};
  DB.players.push(p); DB.cur = p.id; save(); render();
});
render();
</script>

if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
